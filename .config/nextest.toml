# cargo-nextest config — runs ahead of `cargo test` on every recipe
# that touches tests. Mirrors architect's profile shape.

[profile.default]
fail-fast = true
status-level = "pass"
slow-timeout = { period = "2s", terminate-after = 2 }

# The integration suite is not a unit suite with a wide scope: one test
# boots two servers on real iroh endpoints, adopts two trees and hires
# four people, and then does its actual work. Alone that is about a
# second; with the whole suite running at once — every test builds its
# own world, which is what keeps a subset run honest — contention puts it
# nearer four.
#
# Under the default 2s/×2 that reads as a hang and gets killed, which is
# how a correct test turns into a flake. The budget below is per test and
# generous on purpose: `terminate-after` is what catches a genuine stall,
# and a stall here means a deadlock rather than a slow disk.
[[profile.default.overrides]]
filter = 'package(integration)'
slow-timeout = { period = "10s", terminate-after = 3 }

# The cadence tests in `files` are real-time: a recording storm is
# simulated by sleeping past the quiescence window, and a file changing
# mid-hash is a race the test deliberately sets up. Under the default
# 2s/×2 they pass alone and time out one run in several when fifty
# binaries start cold at once — the same shape as the integration case
# above, and the same cure.
[[profile.default.overrides]]
filter = 'package(files) and binary(cadence)'
slow-timeout = { period = "10s", terminate-after = 3 }

# The daemon's peering tests bind real iroh endpoints and dial between
# them, and one of them exists to prove a dial to an absent machine
# *gives up* — which takes the dial timeout (5s, matching
# `files::remotes`) by construction. A budget shorter than the timeout
# under test can only fail.
[[profile.default.overrides]]
filter = 'package(files-daemon) and binary(peering)'
slow-timeout = { period = "15s", terminate-after = 3 }

# `task-server`'s e2e binaries boot a whole `AppState` — every org under
# the data root, which on a developer machine is the real `~/.task` —
# before the first assertion. Three to four seconds of boot against a 4s
# budget is a test that passes or times out on machine load.
[[profile.default.overrides]]
filter = 'package(task-server)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Tests that measure PHYSICAL disk usage — "did storing this file consume
# a second copy", "did linking it consume no space".
#
# They read free space off the *filesystem*, because that is the only
# measure that sees extent sharing: a reflink makes a new inode whose
# `blocks()` reports the full size, so a per-directory byte count reads
# a clone as a copy. (Tried. It does.)
#
# The cost of that is they cannot be measured beside heavy I/O — the
# budget is 16 MiB against a 256 MiB copy, and any other test writing
# more than that during the window fails this one. Alone they take a
# second and a half and always pass; in a full-workspace run they fail
# or time out perhaps one run in three.
#
# One at a time and with room to finish, which helps and does not cure
# it: the noise is the rest of the workspace, not this group. A real fix
# is a filesystem-level measurement that survives concurrency, and there
# may not be one.
[test-groups]
disk-measurement = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(chunk_whole_file)'
test-group = 'disk-measurement'
slow-timeout = { period = "20s", terminate-after = 3 }

[profile.ci]
fail-fast = false
status-level = "all"
final-status-level = "flaky"
slow-timeout = { period = "5s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'binary(chunk_whole_file)'
test-group = 'disk-measurement'
slow-timeout = { period = "40s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'package(integration)'
slow-timeout = { period = "20s", terminate-after = 3 }

[profile.patient]
slow-timeout = { period = "30s", terminate-after = 4 }
