# cargo-nextest config — runs ahead of `cargo test` on every recipe
# that touches tests. Mirrors architect's profile shape.

[profile.default]
fail-fast = true
status-level = "pass"
slow-timeout = { period = "2s", terminate-after = 2 }

# The integration suite is not a unit suite with a wide scope: one test
# boots two servers on real iroh endpoints, adopts two trees and hires
# four people, and then does its actual work. Alone that is about a
# second; with the whole suite running at once — every test builds its
# own world, which is what keeps a subset run honest — contention puts it
# nearer four.
#
# Under the default 2s/×2 that reads as a hang and gets killed, which is
# how a correct test turns into a flake. The budget below is per test and
# generous on purpose: `terminate-after` is what catches a genuine stall,
# and a stall here means a deadlock rather than a slow disk.
[[profile.default.overrides]]
filter = 'package(integration)'
slow-timeout = { period = "10s", terminate-after = 3 }

# The cadence tests in `files` are real-time: a recording storm is
# simulated by sleeping past the quiescence window, and a file changing
# mid-hash is a race the test deliberately sets up. Under the default
# 2s/×2 they pass alone and time out one run in several when fifty
# binaries start cold at once — the same shape as the integration case
# above, and the same cure.
[[profile.default.overrides]]
filter = 'package(files) and binary(cadence)'
slow-timeout = { period = "10s", terminate-after = 3 }

# The daemon's peering tests bind real iroh endpoints and dial between
# them, and one of them exists to prove a dial to an absent machine
# *gives up* — which takes the dial timeout (5s, matching
# `files::remotes`) by construction. A budget shorter than the timeout
# under test can only fail.
[[profile.default.overrides]]
filter = 'package(files-daemon) and binary(peering)'
slow-timeout = { period = "15s", terminate-after = 3 }

# `task-server`'s e2e binaries boot a whole `AppState` — every org under
# the data root, which on a developer machine is the real `~/.task` —
# before the first assertion. Three to four seconds of boot against a 4s
# budget is a test that passes or times out on machine load.
[[profile.default.overrides]]
filter = 'package(task-server)'
slow-timeout = { period = "10s", terminate-after = 3 }

# `wiki-live`'s repo-sourced tests drive the real `git` binary against a
# bare remote: a sync, a push, a merge and another sync is thirty-odd
# process spawns, each a disk round trip. Alone that is a second or
# three; ten of them starting cold on a slow disk read as a hang under
# the default 2s/×2 and get killed mid-push.
[[profile.default.overrides]]
filter = 'package(wiki-live) and test(/repo_source|repo_sourced|working_copy/)'
slow-timeout = { period = "15s", terminate-after = 3 }

# Tests that measure PHYSICAL disk usage — "did storing this file consume
# a second copy", "did linking it consume no space".
#
# They read free space off the *filesystem*, because that is the only
# measure that sees extent sharing: a reflink makes a new inode whose
# `blocks()` reports the full size, so a per-directory byte count reads
# a clone as a copy. (Tried. It does.)
#
# The cost of that is they cannot be measured beside heavy I/O — the
# budget is 16 MiB against a 256 MiB copy, and any other test writing
# more than that during the window fails this one. Alone they take a
# second and a half and always pass; in a full-workspace run they fail
# or time out perhaps one run in three.
#
# One at a time and with room to finish, which helps and does not cure
# it: the noise is the rest of the workspace, not this group. A real fix
# is a filesystem-level measurement that survives concurrency, and there
# may not be one.
[test-groups]
disk-measurement = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(chunk_whole_file)'
test-group = 'disk-measurement'
slow-timeout = { period = "20s", terminate-after = 3 }

[profile.ci]
fail-fast = false
# nextest scales test threads to core count, and CI moved from a 4-core
# hosted runner to a 32-core host — eight times the concurrency, against a
# suite whose slow cases are servers on real endpoints and one test that
# measures physical free space. The whole suite runs in ~52 seconds, so
# capping this costs seconds and buys back the contention headroom every
# override below is already fighting for.
test-threads = 16
status-level = "all"
final-status-level = "flaky"
slow-timeout = { period = "5s", terminate-after = 3 }
# `final-status-level = "flaky"` above has been inert since it was
# written: nextest can only report a test FLAKY when it failed and then
# passed on a retry, and no retries were configured. So every
# environment-sensitive failure was reported as a plain failure, and the
# gate went red.
#
# That is not a hypothetical cost. Main was red for five days with a
# stale assertion in `device_sync_e2e`, and nobody could see it, because
# a red gate was the normal state and every branch inherited it. Two
# consecutive runs of the same green commit failed on two DIFFERENT
# tests — `transcode_rpc`, then `chunk_whole_file` — 2946 of 2947
# passing each time. A gate that fails one random test per run says
# nothing about the change under test.
#
# Two retries, and the honest reading of what that buys: a test that
# passes on retry is reported FLAKY, loudly, in the summary — it is not
# silently green. A test that is genuinely broken fails all three times
# and still fails the run. What this removes is the class of failure
# where a correct test loses a race for a core or a few megabytes of
# free space against 2,946 others.
#
# The tests this covers measure physical resources — free space on the
# filesystem, real elapsed time, servers on real endpoints. The comment
# on `disk-measurement` below is honest that a real fix "may not
# exist"; until it does, retrying is what keeps the signal.
retries = 2

[[profile.ci.overrides]]
filter = 'binary(chunk_whole_file)'
test-group = 'disk-measurement'
slow-timeout = { period = "40s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'package(integration)'
slow-timeout = { period = "20s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'package(wiki-live) and test(/repo_source|repo_sourced|working_copy/)'
slow-timeout = { period = "15s", terminate-after = 3 }

# The two binaries that boot a whole server before their first assertion.
#
# `profile.default` already gives `package(task-server)` 10s×3 for this
# reason, and `profile.ci` did not carry the override across — so in CI
# those tests ran against the bare 5s×3, a budget a third the size of the
# one the same tests were judged to need locally. `task-cli`'s embedded
# vox suite is here for the same reason and was not covered by either:
# it starts an in-process server per test and then drives real CLI verbs
# through it.
#
# This was not theoretical. `wiki_scaffold_over_embedded_vox` was killed
# at 15.021s — not hung, just over by twenty milliseconds, while sharing
# a 32-core box with 2,900 other tests. Passing or failing on how loaded
# the runner happened to be is the definition of a flaky gate, and the
# cure is the budget the default profile already agreed on.
[[profile.ci.overrides]]
filter = 'package(task-server) or (package(task-cli) and binary(vox_embedded))'
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.patient]
slow-timeout = { period = "30s", terminate-after = 4 }
