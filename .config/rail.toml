# cargo-rail policy (0.32). Sparse: only what differs from rail's defaults.
# Docs: https://github.com/loadingalias/cargo-rail/blob/v0.32.0/docs/config.md
#
# Task uses rail for CI change selection (`cargo rail plan`, see the `plan`
# job in .github/workflows/checks.yml) and for change files (`cargo rail
# change add` / `change check`, .changes/README). Commands stay in the
# Justfile; this file only declares inputs.

# The browser build is a first-class target (task-app-web, task-dial,
# files-client must stay wasm-clean), so target-aware decisions resolve
# for it too.
targets = ["wasm32-unknown-unknown"]

# App releases go through scripts/release.sh (fleet `release-workflow`
# skill): rail 0.32 cannot bump an inherited `version.workspace = true`.
# release.sh reads rail's change files (`source = "changes"`) for the
# CHANGELOG. rail's default would publish to crates.io and create GitHub
# releases; make `cargo rail release` inert here.
[release]
publish = "none"
github_release = false
checks = "none"
source = "changes"

# Inputs outside the Cargo graph that change what CI itself does. Any of
# these changing makes the plan job run the FULL set (workflows, the
# Justfile recipes the steps call, the nix CI shell, the scripts the
# steps run). Built-in Cargo work already covers manifests, Cargo.lock,
# .cargo/config.toml and rust-toolchain.toml; don't repeat them.
[plan.work.ci-infra]
scope = "repository"
paths = [
  ".github/**",
  "Justfile",
  "flake.nix",
  "flake.lock",
  "nix/**",
  "scripts/**",
]

# nextest's own configuration (profiles, test groups, scripts): a change
# can alter how every test runs, so it means the full test set.
[plan.work.test-runner]
scope = "repository"
paths = [".config/nextest.toml"]

# The browser build (`just ci-wasm`): one catalog row per package checked
# for wasm32, so the plan names WHICH of them a change reaches instead of
# scripts/ci-rail-plan.py guessing from a hard-coded set. `kind = "all"`
# means every row.
[plan.work.wasm]
scope = "variants"
variant_catalog = ".config/rail-wasm.json"
