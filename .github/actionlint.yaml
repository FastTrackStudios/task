# actionlint: the self-hosted runner labels this repo's workflows use.
# `task` / `task-plan` / `task-deploy` / `task-tests` / `task-lint` /
# `task-wasm` — Task's runners on the Mac Pro VM (starcommand
# hosts/toms-mac-pro-vm/github-runners.nix; one label per job kind);
# `airlock` — the Mac that builds and signs the Apple apps.
self-hosted-runner:
  labels:
    - task
    - task-plan
    - task-deploy
    - task-tests
    - task-lint
    - task-wasm
    - airlock
