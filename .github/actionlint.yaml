# actionlint: the self-hosted runner labels this repo's workflows use.
# Only the heavy jobs are self-hosted; everything light runs on hosted
# ubuntu-latest (checks.yml header).
#   `task`        the Mac Pro VM's general Task runner (desktop-cache.yml)
#   `task-tests`  the Mac Pro VM's warm test-build runner (checks.yml tests)
#   `task-deploy` the release deploy (deploy.yml)
#   `airlock`     the Mac that builds and signs the Apple apps.
#   `warp-*`      WarpBuild runners (checks.yml tests-warpbuild trial).
self-hosted-runner:
  labels:
    - task
    - task-deploy
    - task-tests
    - airlock
    - warp-*
