# Deploy: a release tag ships. Production is the latest `v*` tag.
#
# Releases are tags (tag-from-main, the same flow as studio's): `just
# release` pushes vYY.M.MICRO on main's newest commit whose `CI passed` is
# green (or on a release/v* hotfix line), as a person or fts-forge (a tag
# pushed with GITHUB_TOKEN would start nothing). Nothing is committed for
# a release: every job that builds stamps the tag's version into its own
# checkout (`release.sh stamp`). This workflow, on the tag:
#   1. stamps and checks the tag: vX.Y.Z on a commit of main or a
#      release/v* line, with `CI passed` green on it (the suite is not run
#      again),
#   2. builds and pushes the images (images.yml)
#        ghcr.io/fasttrackstudios/task-server:<X.Y.Z>
#        ghcr.io/fasttrackstudios/task-web:<X.Y.Z>
#      starcommand's argocd-image-updater rolls production to the highest
#      X.Y.Z image (the chart, deploy/chart/task, pins none),
#   3. beside 2, publishes the GitHub Release (release.yml) with the notes
#      from the change files added since the previous tag, then attaches
#      what the version ships: the headless node binaries
#      (node-binaries.yml), the web bundle and the Linux AppImage
#      (release-assets.yml, after the images), and pushes the Linux desktop
#      to cachix. The macOS app joins the same release from task-macos.yml,
#      so one `v*` release carries everything,
#   4. for our sake only, after the images: waits for task.starcommand.live
#      to serve the tagged commit (the GitHub Deployment goes Active only
#      then). The release is the artifacts, not our deployment of them, so
#      nothing waits on it and its failure fails nothing.
#
# Rollback: image-updater runs the HIGHEST version, so redeploying an old
# one is not possible from here. Revert on main and release again (or, in
# an emergency, pin the image tag in starcommand). A workflow_dispatch on a
# tag re-runs the checks, the build, the verification and the publishing.

name: Deploy

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  # Re-verify / re-publish a release: run this workflow with the v* tag
  # selected as the ref. A branch ref skips every job (the `if` below).
  workflow_dispatch:

# Queue, never cancel: two releases must not verify side by side.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The tag is a release: vX.Y.Z on a commit of main or a release/v* line,
  # with `CI passed` green on it. (`just release` checked the same before
  # tagging; this catches a tag pushed some other way.) Everything else
  # waits on it.
  deploy:
    name: Tag guard
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag guard walks main's and release/v*'s history.
          fetch-depth: 0
      # Releases commit no version: the tag's goes into the checkout.
      - name: Stamp the release version
        run: bash scripts/release.sh stamp "$GITHUB_REF_NAME"
      - name: Tag guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh tag-guard

  # task-server + task-web `:X.Y.Z` on GHCR, built from the tag on the
  # `task-release` pool. Production follows once they are there.
  images:
    name: Images
    needs: deploy
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml

  # The GitHub Deployment goes Active only when the cluster serves this
  # commit — both halves, web and server — so "Active" keeps meaning
  # "serving", not "images pushed". Polling the public URL needs nothing
  # from the LAN, so it runs on a hosted runner and costs us no slot.
  #
  # Informational: the release (GitHub Release + assets) is published from
  # the tag, not from our cluster, so it runs beside this rather than after
  # it, and a red or timed-out verification shows on the run without
  # failing it or holding back a release anyone else can install.
  verify:
    name: Verify live
    runs-on: ubuntu-latest
    # Production can roll only once the images exist.
    needs: images
    continue-on-error: true
    timeout-minutes: 30
    environment:
      name: task-production
      url: https://task.starcommand.live
    steps:
      # A green run must mean the cluster serves THIS commit. Both the web
      # bundle and the server report their build, and both must match —
      # otherwise a half-rolled-out pair looks like success.
      - name: Verify live
        run: |
          url="https://task.starcommand.live"
          want="${GITHUB_SHA}"
          echo "waiting for $url to serve $want"
          # 100 polls at 15s is 25 minutes, inside the job's 30.
          #
          # It was 60 — fifteen minutes — and that is under what a roll
          # actually takes: Argo notices the new tag on its own poll
          # interval (~3 minutes), and the deployment's Recreate strategy
          # then stops the old pod before starting the new one, pulling a
          # few hundred megabytes in between. Two consecutive deploys in
          # this series rolled perfectly and were still reported failed
          # because the window closed first, and a red deploy that means
          # nothing is one everybody learns to scroll past.
          for i in $(seq 1 100); do
            web="$(curl -sf --max-time 10 "$url/version.json" | sed -n 's/.*"rev":"\([^"]*\)".*/\1/p' || true)"
            srv="$(curl -sf --max-time 10 "$url/.well-known/task-server.json" | sed -n 's/.*"build":"\([^"]*\)".*/\1/p' || true)"
            echo "  poll $i: web=${web:-?} server=${srv:-?}"
            if [ "$web" = "$want" ] && [ "$srv" = "$want" ]; then
              echo "LIVE: $url serves $want"
              break
            fi
            sleep 15
          done
          if [ "$web" != "$want" ] || [ "$srv" != "$want" ]; then
            echo "TIMED OUT: $url never served $want — check starcommand's Argo \`task\` Application (did it pick up the tag? ImagePullBackOff?)"
            exit 1
          fi

          # The build stamp says WHICH binary answers, not that it works.
          # `/health` on the public host is the web bundle's SPA fallback
          # (the ingress sends it to task-web, so it is 200 HTML whatever
          # the server's state); the server's own probes are per org,
          # `/org/<slug>/health`, listed by the well-known document. Each
          # must answer exactly "ok", so an org whose stores failed to open
          # fails the deploy instead of passing on the build stamp alone.
          paths="$(curl -sf --max-time 10 "$url/.well-known/task-server.json" \
            | grep -o '"health":"[^"]*"' | cut -d'"' -f4)"
          [ -n "$paths" ] || { echo "no org health paths in the well-known document"; exit 1; }
          bad=0
          for p in $paths; do
            body="$(curl -s --max-time 10 "$url$p" || true)"
            echo "  $p: ${body:-<no answer>}"
            [ "$body" = "ok" ] || bad=1
          done
          [ "$bad" = 0 ] || { echo "UNHEALTHY: an org did not answer ok"; exit 1; }

  # The tag is a release: publish the GitHub Release for it (notes from the
  # change files added since the previous tag, migrations list, moved git
  # deps). A no-op when the release already exists (a re-run, a dispatch
  # on an older tag).
  #
  # It needs only the tag guard, not the images or Verify live: a release
  # is what the version ships, for anyone to install, and doesn't wait on
  # (or mean) our own production rolling it out. The tag was pushed by
  # `just release`: it is what started this run, and the Apple builds.
  release:
    name: GitHub Release
    needs: deploy
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  # The release exists: attach the standalone headless node binaries
  # (linux-x86_64, linux-aarch64, macos-aarch64 + SHA256SUMS) to it, for
  # nodes outside the cluster and outside Nix (docs/headless-node.md).
  # Hosted runners, so no deploy slot is held; a no-op when the release
  # already carries them.
  node-binaries:
    name: Headless node binaries
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    uses: ./.github/workflows/node-binaries.yml
    # Only the one secret the called workflow needs, by name, never
    # `secrets: inherit` (the repo's other secrets stay out of it).
    # TASK_RELEASE_MINISIGN_KEY, which signs SHA256SUMS, lives only in the
    # `release-signing` environment. GitHub resolves it there, for the
    # called `publish` job that declares that environment, but ONLY if
    # the caller names it here; unnamed, it reaches the job as "".
    secrets:
      TASK_RELEASE_MINISIGN_KEY: ${{ secrets.TASK_RELEASE_MINISIGN_KEY }}

  # The release exists: attach the rest of what the version ships — the
  # web bundle (from the published task-web image) and the Linux desktop
  # AppImage + its updater manifest. Hosted runners; each asset is a no-op
  # when the release already carries it. (The macOS app is attached by
  # task-macos.yml, on the Mac.)
  release-assets:
    name: Web bundle + Linux desktop
    # The web bundle comes out of the published task-web image.
    needs: [release, images]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml

  # The release is tagged: build the Linux desktop package at the tag and
  # push it to fasttrackstudio.cachix.org, so NixOS hosts (nix-fleet's
  # task-desktop timer) download the release instead of compiling it.
  desktop-cache:
    name: Linux desktop -> cachix
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/desktop-cache.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
