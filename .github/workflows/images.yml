# Images: build task-server + task-web from a release tag and push them to
# GHCR.
#
#   ghcr.io/fasttrackstudios/task-server:<X.Y.Z>
#   ghcr.io/fasttrackstudios/task-web:<X.Y.Z>
#
# Called by deploy.yml on every release tag vX.Y.Z (after its tag guard):
# check out the tag, stamp its version into the checkout (`release.sh
# stamp`; releases commit no version), build, and push `:X.Y.Z` (the bare
# version, `release.sh image-tag`), `:sha-<short>` and, when this is the
# highest release, `:latest`. starcommand's argocd-image-updater then rolls
# production to the highest X.Y.Z image (the chart, deploy/chart/task, no
# longer carries the release). Versions are CalVer (26.10.2), no `v`.
#
# workflow_dispatch with `tag`: build and push the images of an EXISTING
# release tag from that tag's source. Creates no git tag. For re-publishing
# a lost image.
#
#   gh workflow run images.yml -R FastTrackStudios/task --ref main -f tag=v26.10.2
#
# Packages pushed with GITHUB_TOKEN are created PRIVATE; the org must make
# task-server and task-web public once, or the cluster cannot pull them
# (and `ghcr-images.sh check`, which is anonymous, fails).

name: Images

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish images for, e.g. v0.2.4 (not with prewarm)"
        required: false
        type: string
      # `just pre-warm-ci release`: build the release artifacts of the
      # dispatched ref into the `task-release` pool's warm release target
      # dir, and publish nothing, so the next release recompiles only what
      # changed (after a toolchain bump, a lockfile overhaul, a wiped cache).
      prewarm:
        description: "Pre-warm only: build the release server and web bundle; push nothing."
        type: boolean
        default: false

# One group PER RELEASE, never cancelled. A shared group would hold only one
# pending run and drop it for the next, so a release queued behind another
# could vanish. Two publishes still never run side by side in practice: the
# publish job runs on the `task-release` pool, in arrival order.
concurrency:
  group: images-${{ inputs.prewarm && format('prewarm-{0}', github.run_id) || inputs.tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: What to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      tags: ${{ steps.plan.outputs.tags }}
      prewarm: ${{ steps.plan.outputs.prewarm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PREWARM: ${{ inputs.prewarm == true }}
        run: |
          set -euo pipefail
          # --force: on a tag push the checkout wrote the tag as a plain
          # ref to its commit, and origin's is annotated; without it git
          # refuses to clobber the tag and this step fails (v26.10.3).
          git fetch --quiet --tags --force origin
          if [ "$PREWARM" = true ]; then
            echo "pre-warm: build $GITHUB_SHA's release artifacts, publish nothing"
            printf 'build=true\nsha=%s\ntag=\ntags=\nprewarm=true\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release tag: the dispatch's input, else the tag push that
          # started deploy.yml (a called workflow sees the caller's ref).
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          else
            case "$GITHUB_REF" in
              refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;;
              *) echo "::error::images are built from a release tag (ref is $GITHUB_REF)"; exit 1 ;;
            esac
          fi
          v="$(bash scripts/release.sh image-tag "$tag")"
          sha="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}")" \
            || { echo "::error::no tag $tag"; exit 1; }
          tags="$v sha-$(git rev-parse --short "$sha")"
          # `latest` is the newest release: a re-publish of an older tag, or
          # a hotfix below a newer main release, leaves it alone.
          highest="$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          [ "$tag" != "$highest" ] || tags="$tags latest"
          echo "publishing $tag ($sha) as: $tags"
          {
            echo "build=true"
            echo "sha=$sha"
            echo "tag=$tag"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "### Images for $tag: \`$tags\` from \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build + push to GHCR
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    # THEBATTLESHIP's `task-release` pool (~/.flake
    # hosts/THEBATTLESHIP/github-runners.nix): a warm nix store and a warm
    # release target dir per instance ($TASK_CACHE_DIR/release-<runner>), so a release recompiles
    # what changed since the last one instead of the whole server and web
    # bundle. Production rolls once these images are on GHCR, so a release
    # reaches it as fast as this build.
    runs-on: [self-hosted, task-release-images]
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      # Newer skopeo rejects some hosts' v1 registries.conf; we name the
      # registry explicitly everywhere, so use an empty (valid) config.
      CONTAINERS_REGISTRIES_CONF: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # Releases commit no version: write the tag's into this checkout, so
      # the server and the web bundle report the release. (A pre-warm
      # builds the ref as it is.)
      - name: Stamp the release version
        if: ${{ needs.plan.outputs.tag != '' }}
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/release.sh stamp "$TAG"
      # The image's unused toolchains (Android SDK, .NET, GHC, CodeQL, ~30 GB):
      # a release build of the server and the web bundle needs the disk.
      - name: Free disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: cachix/install-nix-action@v31
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://fasttrackstudio.cachix.org
            extra-trusted-public-keys = fasttrackstudio.cachix.org-1:r7v7WXBeSZ7m5meL6w0wttnvsOltRvTpXeVNItcy9f4=

      # The release binary and the web bundle are built HERE, in the dev
      # shell; nix only assembles the images from these outputs
      # (nix/modules/packages/prebuilt-images.nix). The pure
      # `.#task-*-image` attributes remain for a machine without the shell.
      - name: Build release artifacts
        id: build
        run: |
          set -euo pipefail
          # This instance's warm release target dir (per instance: a dir is
          # warm only for the ~/.cargo and checkout paths that built it;
          # .github/actions/battleship-nix-rust); a hosted runner's home if
          # this ever runs off the pool.
          dir="${TASK_CACHE_DIR:-$HOME/cargo-target}/release-${RUNNER_NAME}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          export CARGO_TARGET_DIR="$dir"
          nix develop --accept-flake-config .#ci -c \
            cargo build --release -p task-server
          # tailwind first: dx reads assets/ before cargo runs. (Older tags,
          # e.g. v0.2.4, predate architect-ui-link.sh.)
          nix develop --accept-flake-config .#default -c bash -c '
            set -e
            if [ -f scripts/architect-ui-link.sh ]; then bash scripts/architect-ui-link.sh; fi
            (cd apps && tailwindcss -i tailwind.css -o web/assets/tailwind.css)
            cd apps/web
            dx build --release --platform web --debug-symbols false \
              --wasm-split --features wasm-split'
          # dx writes under the cargo target dir: <target>/dx/<app>/release/web/public.
          web="$dir/dx/task-app-web/release/web/public"
          test -f "$web/index.html" || { echo "::error::dx wrote no web bundle at $web"; exit 1; }
          echo "server=$dir/release/task-server" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          ls -la "$dir/release/task-server"; du -sh "$web"
          # The image's payload reports the release's version, and
          # answering `--version` must not boot it.
          bash scripts/check-versions.sh --bin "$dir/release/task-server"

      - name: Push images
        if: ${{ needs.plan.outputs.prewarm != 'true' }}
        env:
          TASK_PREBUILT_SERVER_BIN: ${{ steps.build.outputs.server }}
          TASK_PREBUILT_WEB_ROOT: ${{ steps.build.outputs.web }}
          TAGS: ${{ needs.plan.outputs.tags }}
          # The images' revision label and TASK_BUILD_REV come from here,
          # and their version label from TASK_RELEASE_VERSION (`stamp`
          # exported it), as nix/modules/crane.nix and task-server.nix read
          # them; the build is --impure.
          FTS_BUILD_REV: ${{ needs.plan.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/ghcr-auth.json"
          skopeo() { nix run nixpkgs#skopeo -- "$@"; }
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io -u "$GHCR_USER" --password-stdin
          read -r -a tags <<<"$TAGS"
          for img in task-server task-web; do
            echo "── $img ──"
            dest="docker://ghcr.io/fasttrackstudios/$img"
            streamer="$(nix build --impure ".#${img}-image-prebuilt" --no-link --print-out-paths)"
            "$streamer" | skopeo --insecure-policy copy docker-archive:/dev/stdin "$dest:${tags[0]}"
            for tag in "${tags[@]:1}"; do
              skopeo --insecure-policy copy "$dest:${tags[0]}" "$dest:$tag"
            done
          done
          rm -f "$REGISTRY_AUTH_FILE"

      # What the cluster needs: anonymous pull, built from the tag's commit.
      # Fails (with the reason) while the packages are still private.
      - name: Pullable without credentials?
        if: ${{ needs.plan.outputs.prewarm != 'true' }}
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          first="${TAGS%% *}"
          if [ -f scripts/ghcr-images.sh ]; then
            bash scripts/ghcr-images.sh check "$first" "$SHA" \
              || { echo "::warning::not anonymously pullable yet: make ghcr.io/fasttrackstudios/task-server and task-web PUBLIC (org package settings)"; exit 1; }
          else
            echo "this tag predates scripts/ghcr-images.sh; skipped"
          fi
