# PR title — every PR is squash-merged ("PR title and description"), so
# the PR TITLE becomes the one commit subject on main (or on a release/v*
# hotfix branch). This checks it is a conventional commit before the
# squash bakes it in. Release notes come from the PR's `.changes/*.md`
# change file, not from the title (fleet `release-workflow` skill).
#
# A hosted runner, a regex, seconds.
#
#   feat(files): a device that syncs the audio and leaves the footage
#   fix: the share list keys by commit
#   chore(deps)!: architect v1.0 — the attach hooks take an EventSink
#
# Types: feat fix perf refactor docs test build ci chore revert style.
# `!` before the colon marks a breaking change.

name: pr-title

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9][a-z0-9/_.-]*\))?!?: .+'
          if [[ "$TITLE" =~ $re ]]; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title is not a conventional commit: '$TITLE'"
            echo "::error::It becomes the squash commit and the changelog line. e.g. 'feat(files): …', 'fix: …'"
            exit 1
          fi
