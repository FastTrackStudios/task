# CI — the full suite after every merge, on hotfix PRs, and runs
# by hand (fleet flow v4: the `release-workflow` skill,
# references/ci-gates.md).
#
# WHO CHECKS WHAT. Every CI minute of a Rust workspace this size is a
# build, so the expensive half of the PR gate runs on the developer's own
# warm target dir, and CI pays for builds once per merge:
#
#   PR into main   NOT this workflow: pr.yml (`PR checks`, a free backstop
#                  that compiles nothing) plus the `Local CI` commit
#                  status the pre-push hook posts (prek.toml ->
#                  scripts/ci-local.sh: the static guards, clippy, wasm and
#                  the rail-planned tests). Main requires both.
#   push to main   the FULL set, once per merge. It catches two PRs that each
#                  passed alone but break together, and its green
#                  `CI passed` is what `just release-tag` requires.
#
# WHERE EACH JOB RUNS: all on GitHub's free hosted runners (the repo is
# public). Nobody waits on this workflow except `release-tag`, so a slower
# free runner beats a fast billed one (WarpBuild until 2026-10-23).
#
#   plan            ubuntu-latest   rustup + cargo-rail (rust-rail), to narrow only
#   deps-cache      ubuntu-latest   main only: saves cargo's dependencies for pr.yml
#   lint            ubuntu-latest   nix .#ci + rust-cache (checks-lint): clippy, docs
#   tests           ubuntu-latest   nix .#ci + rust-cache (checks-tests): the nextest build
#   wasm            ubuntu-latest   nix .#ci + rust-cache (checks-wasm): 3 min
#   checks-passed   ubuntu-latest   the aggregator
#
# Each build kind restores its dependencies from a rust-cache saved on
# main (.github/actions/hosted-nix-rust); the workspace's own crates
# rebuild every run. The runner's unused SDKs are deleted first for disk.
#
# Toolchain comes from the repo flake: every job enters `.#ci` once (rust
# 1.98 pin, wasm target, clang env for ring, native headers, tailwindcss,
# cargo-rail) and every later step runs inside it.
#
# CHANGE SELECTION: `cargo rail plan` (the version nix/modules/cargo-rail.nix
# pins) through cargo's resolved reverse-dependency graph, turned into
# gates plus a nextest filterset by scripts/ci-rail-plan.py. The local hook
# uses it for every PR; here only a dispatch with `base` narrows. Only which
# tests RUN narrows; the test BUILD stays --workspace so the warm target
# dir keeps one artifact set. Full runs record rail's observed-input
# EVIDENCE for their commit into the Actions cache; a later plan against
# that commit restores it, so a change to docs/fixtures/examples narrows
# instead of widening. Workflow, Justfile, nix, scripts or nextest-config
# changes (.config/rail.toml [plan.work.*]), workspace scope, or any rail
# failure FAIL OPEN to the full set.
#
# CACHE: Swatinem/rust-cache, one entry per build kind (checks-lint,
# checks-tests, checks-wasm), SAVED ONLY ON MAIN. A repo gets 10 GB of
# Actions cache, evicted LRU across all branches; with main the only
# writer the budget holds one entry per kind (+ the small rail evidence,
# cargo-rail and cargo-dependency entries). The tests entry (dependency
# codegen) is the big one: watch `gh cache list` if runs start restoring
# nothing.

name: CI

# WHEN THIS RUNS:
#
#   PR into main        never (pr.yml).
#   PR into release/**  a hotfix: the FULL set (no narrowing, and nothing
#                       left to a hook, on a branch that ships straight to
#                       production). A hotfix release PR (release/pending:
#                       version + changelog only, proved by the BASE commit's
#                       release.sh) skips everything.
#   push to main        the FULL set, once per merge, and records rail
#   or release/v*       evidence for that commit.
#   by hand             `gh workflow run checks.yml --ref <branch>` runs
#                       everything and, when green, posts `Local CI` on the
#                       branch's head (for a push the hook couldn't vouch
#                       for); add `-f base=main` to check only what the
#                       branch changed.
#
# No schedule: every main commit already gets its run when it merges, so a
# nightly re-run of an unchanged main would only repeat it.
#
# A merge never deploys: production changes only when a v* tag is pushed
# (deploy.yml).
on:
  pull_request:
    branches: ["release/**"]
  push:
    # release/v* (hotfix branches), not release/pending: a release PR's
    # head is version + changelog only and gets no full run of its own.
    branches: [main, "release/v*"]
  workflow_dispatch:
    inputs:
      base:
        description: "Only check crates affected since this ref (e.g. main). Empty = everything."
        required: false
        default: ""

# Nothing on main is ever cancelled by a newer run: every push and
# dispatch gets its own group (the run id), so each merge's full suite
# runs to the end and every main commit gets its own `CI passed`. Only a
# hotfix PR's newer push cancels its older run.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # mold for the host target only -- 326 test binaries get linked on a
  # `nextest run`, and GNU ld is the serial part of that. Scoped to the
  # host triple so the wasm32 rustflags in .cargo/config.toml are
  # untouched.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  # Terse, stable logs — this is CI, not a terminal.
  CARGO_TERM_COLOR: never
  # Incremental compilation helps repeated edits in one tree; a CI run is a
  # fresh tree, and incremental output only bloats the rust-cache.
  CARGO_INCREMENTAL: "0"

jobs:
  # Hosted, and without nix: the plan only resolves cargo's graph and
  # diffs two commits, so it needs cargo and cargo-rail (.github/actions/
  # rust-rail), not the dev shell's ~3 GB closure, and installs them only
  # when it actually has to narrow (a dispatch with `base`).
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.filter.outputs.full }}
      cargo: ${{ steps.filter.outputs.cargo }}
      tests: ${{ steps.filter.outputs.tests }}
      test_filter: ${{ steps.filter.outputs.test_filter }}
      wasm: ${{ steps.filter.outputs.wasm }}
      skip: ${{ steps.filter.outputs.skip }}
      ref: ${{ steps.filter.outputs.ref }}
      record: ${{ steps.filter.outputs.record }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the plan needs both diff endpoints' ancestry.
          fetch-depth: 0
      # Which commit to plan against (only a dispatch with `base` narrows),
      # decided before the evidence restore (its cache key is that commit).
      - name: Choose the comparison base
        id: base
        env:
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          set -u
          base=""
          if [ "${GITHUB_EVENT_NAME:-}" = workflow_dispatch ] && [ -n "${DISPATCH_BASE}" ]; then
            git fetch --quiet origin "${DISPATCH_BASE}" || true
            base="$(git merge-base "origin/${DISPATCH_BASE}" HEAD 2>/dev/null || true)"
          fi
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
          echo "base: ${base:-<none>}"
      # The path is a LITERAL `~/rail-evidence` in both this restore and the
      # tests job's save: actions/cache versions an entry by its path
      # strings (and compression), so `${{ runner.temp }}` — a different
      # directory on every runner — never matched across runners.
      - name: Restore rail evidence for the base
        if: ${{ steps.base.outputs.sha != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/rail-evidence
          key: rail-evidence-${{ runner.os }}-${{ runner.arch }}-cargo.test-${{ steps.base.outputs.sha }}
      # Toolchain + cargo-rail, only to narrow. Fail open: if this fails the
      # plan step finds no cargo-rail and runs everything.
      - uses: ./.github/actions/rust-rail
        if: ${{ steps.base.outputs.sha != '' }}
        continue-on-error: true
      - name: Plan affected crates
        id: filter
        env:
          BASE: ${{ steps.base.outputs.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVIDENCE: ~/rail-evidence/cargo.test.json
        run: |
          set -u
          EVIDENCE="${EVIDENCE/#\~/$HOME}"

          # Fail open: if we cannot compute an honest plan, run everything.
          run_all() {
            echo "plan: $1 — running EVERYTHING"
            printf 'full=true\ncargo=true\ntests=true\ntest_filter=\nwasm=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          skip_all() {
            echo "plan: $1 — nothing to run"
            printf 'skip=true\nfull=false\ncargo=false\ntests=false\ntest_filter=\nwasm=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Full runs record evidence for the commit they check, so later
          # plans against it can narrow.
          record() { echo "record=true" >> "$GITHUB_OUTPUT"; }

          case "${GITHUB_EVENT_NAME:-}" in
            pull_request)
              # The release commit: its content was checked before it.
              # The BASE commit's release.sh decides, never the PR's own
              # copy: a release/pending branch that edited the script
              # must not be able to skip every check.
              git show "${BASE_SHA}:scripts/release.sh" > "${RUNNER_TEMP}/release-base.sh"
              if bash "${RUNNER_TEMP}/release-base.sh" release-only; then
                skip_all "release commit only (${HEAD_REF})"
              fi
              # Only PRs into release/** reach this workflow (pr.yml has main).
              run_all "PR into ${BASE_REF} (hotfix): full set" ;;
            push)
              record; run_all "push to ${GITHUB_REF_NAME}: full set after every merge" ;;
            workflow_dispatch)
              [ -n "${BASE}" ] || { record; run_all "manual dispatch"; } ;;
            *) run_all "event ${GITHUB_EVENT_NAME:-?}" ;;
          esac
          [ -n "${BASE}" ] || run_all "no comparison base"

          # Narrowing: rust-rail (above) installed the toolchain and rail.
          cargo rail --version || run_all "cargo-rail is not installed (rust-rail failed)"

          ev=()
          if [ -f "${EVIDENCE}" ]; then
            ev=(--evidence "${EVIDENCE}")
            echo "plan: using rail evidence for ${BASE}"
          else
            echo "plan: no rail evidence for ${BASE} (non-Rust changes will widen)"
          fi
          plan="${RUNNER_TEMP}/rail-plan.json"
          cargo rail plan --from "${BASE}" --to HEAD "${ev[@]}" --json > "${plan}" \
            || run_all "cargo rail plan failed"
          cargo rail plan --from "${BASE}" --to HEAD "${ev[@]}" --explain-work cargo.test || true

          gates="$(python3 scripts/ci-rail-plan.py "${plan}")" \
            || run_all "plan parse failed"
          [ -n "${gates}" ] || run_all "plan parse produced no gates"
          echo "${gates}" >> "$GITHUB_OUTPUT"
          echo "${gates}"

  # Main is the only writer of the cargo-dependency cache the PR checks
  # restore (the 10 GB Actions cache budget): fetched once per lockfile,
  # on a free runner, and no job waits on it.
  deps-cache:
    name: Dependency cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-rail
        with:
          save-deps: "true"

  # THREE full-run jobs, one per BUILD KIND.
  #
  #   lint   fmt, manifests, architect-ui, clippy, docs: check/doc mode,
  #          no codegen.
  #   tests  the nextest build (full codegen) + rail evidence.
  #   wasm   the wasm32 check (another target triple).
  #
  # The three kinds share NO artifacts except build scripts and proc
  # macros (clippy re-checked 250 crates straight after the test build:
  # check-mode units are not the test build's units). So they run side by
  # side, each with its own rust-cache entry.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty = the event's own ref (a hotfix PR's merge ref, a
          # dispatched branch, a push's commit).
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: ./.github/actions/hosted-nix-rust
        with:
          kind: lint
      # Every step is a `just ci-*` recipe; the Justfile is the single
      # source of truth, and `just ci` runs the same set locally.
      - name: fmt
        run: just ci-fmt
      # A hotfix PR into release/**: its changed crates need change files.
      - name: Change files
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: just ci-changes "$(git rev-parse HEAD^1)"
      - name: One version everywhere
        if: ${{ !cancelled() }}
        run: just ci-versions
      - name: Manifests + lockfile
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        run: just ci-manifests
      - name: architect-ui sheet
        if: ${{ !cancelled() }}
        run: just ci-architect-css
      - name: Clippy
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        run: just ci-clippy
      # rustdoc -D warnings isn't change-scoped: it documents the whole
      # workspace. Same check-mode dependency metadata as clippy.
      - name: Docs
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        run: just ci-docs
      - name: Disk
        if: ${{ always() }}
        run: |
          du -sh target ~/.cargo /nix/store 2>/dev/null || true
          df -h / | tail -1

  tests:
    name: Tests
    runs-on: ubuntu-latest
    # A cold workspace build on 4 vCPUs (dependencies from the rust-cache).
    timeout-minutes: 120
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' && needs.plan.outputs.tests == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/hosted-nix-rust
        with:
          kind: tests

      # Full runs first record rail evidence for this commit: the recorder
      # wraps rustc for one `cargo test --no-run` (units already fresh keep
      # their dep-info, so this compiles nothing nextest wouldn't), and the
      # nextest run after it finds every unit fresh. Best effort: a failure
      # only means later plans against this commit widen.
      - name: Tests
        env:
          # A hosted runner's 4 vCPUs: more test threads than cores makes the
          # dial-by-endpoint tests time out under load (STA-369).
          TASK_CI_TEST_THREADS: "4"
          TASK_CI_TEST_LOG: ${{ runner.temp }}/nextest-ci.log
          TASK_CI_TEST_FILTER: ${{ needs.plan.outputs.test_filter }}
          RECORD: ${{ needs.plan.outputs.record }}
        run: |
          # ~/rail-evidence: the literal path the hosted plan job restores
          # (see its restore step). Emptied first, so a failed recording
          # can never save the previous run's evidence under this commit.
          export EVIDENCE_DIR="$HOME/rail-evidence"
          rm -rf "${EVIDENCE_DIR}"
          # The app crates embed the generated tailwind.css (`asset!`), and
          # `ci-tests` only generates it after this recording: without it
          # the recorder's build died at task-app-web after ~18 minutes on
          # every run, recorded nothing, and the test build started over.
          just css
          if [ "${RECORD}" = "true" ]; then
            mkdir -p "${EVIDENCE_DIR}"
            cargo rail plan evidence --work cargo.test \
              --output "${EVIDENCE_DIR}/cargo.test.json" \
              -- test --workspace --locked --no-run \
              || echo "::warning::rail evidence not recorded; later plans against this commit widen"
          fi
          just ci-tests
      - name: Evidence key
        id: evidence
        if: ${{ always() && needs.plan.outputs.record == 'true' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [ -f "$HOME/rail-evidence/cargo.test.json" ] && echo "have=true" >> "$GITHUB_OUTPUT" || true
      - name: Save rail evidence
        if: ${{ always() && steps.evidence.outputs.have == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/rail-evidence
          key: rail-evidence-${{ runner.os }}-${{ runner.arch }}-cargo.test-${{ steps.evidence.outputs.sha }}
      - name: Test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-ci
          path: ${{ runner.temp }}/nextest-ci.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Disk
        if: ${{ always() }}
        run: |
          du -sh target ~/.cargo /nix/store 2>/dev/null || true
          df -h / | tail -1

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' && needs.plan.outputs.wasm == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      # wasm32 target + ring's clang env come from the flake CI shell,
      # entered once for every later step; target dir ./target.
      - uses: ./.github/actions/hosted-nix-rust
        with:
          kind: wasm
      #
      # Check via task-app-web, NOT `-p ui -p task-ui-core` directly.
      # getrandom on wasm needs BOTH halves: the `--cfg
      # getrandom_backend="wasm_js"` in .cargo/config.toml (global) and the
      # `wasm_js` FEATURE, which only apps/web enables. Checking the leaf
      # crates alone sets the cfg without the feature, and getrandom fails
      # with "the wasm_js backend requires the wasm_js feature". The web app
      # pulls both leaves in anyway, so coverage is unchanged.
      - name: wasm check (task-app-web)
        run: just ci-wasm

  # The aggregate: scripts/release.sh (CHECK_NAME) refuses to tag a commit
  # on main where `CI passed` isn't green, so rename both together. (PRs
  # into main are gated by pr.yml's `PR checks` + `Local CI` instead.)
  # This never skips: it fails unless every job the plan asked for
  # succeeded. A job may only be skipped when the plan said it had no work.
  checks-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, lint, tests, wasm]
    if: ${{ always() }}
    permissions:
      # A green dispatched full run posts `Local CI` (below).
      statuses: write
    steps:
      - name: Every required job succeeded
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          WANT_TESTS: ${{ needs.plan.outputs.tests }}
          WASM: ${{ needs.wasm.result }}
          WANT_WASM: ${{ needs.plan.outputs.wasm }}
        run: |
          set -u
          fail=0
          bad() { echo "::error::$1"; fail=1; }
          [ "$PLAN" = success ] || bad "plan: $PLAN"
          if [ "$SKIP" = "true" ]; then
            echo "plan: nothing to run"; exit "$fail"
          fi
          check() { # name result wanted
            if [ "$3" = "true" ]; then
              [ "$2" = success ] || bad "$1: $2"
            else
              case "$2" in success|skipped) ;; *) bad "$1: $2" ;; esac
            fi
            echo "$1: $2 (wanted=$3)"
          }
          check lint  "$LINT"  true
          check tests "$TESTS" "$WANT_TESTS"
          check wasm  "$WASM"  "$WANT_WASM"
          exit "$fail"
      # The escape hatch for a push the pre-push hook couldn't vouch for (a
      # contributor without the hook, a dirty tree, SKIP=local-ci): a green
      # dispatched FULL run on the branch stands in for it.
      - name: Post Local CI for a green dispatched full run
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.base == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --silent \
            -f state=success -f context="Local CI" \
            -f description="full run on GitHub (${GITHUB_RUN_ID})" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Local CI posted on ${GITHUB_SHA}"
