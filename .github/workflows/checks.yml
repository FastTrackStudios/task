# Task Checks — the PR gate, the full suite after every merge, and the
# nightly (fleet flow v4: the `release-workflow` skill,
# references/ci-gates.md).
#
# WHO CHECKS WHAT. Every CI minute of a Rust workspace this size is a
# build, so the expensive half of the PR gate runs on the developer's own
# warm target dir, and CI pays for builds once per merge:
#
#   PR into main   free hosted checks that compile nothing (fmt, change
#                  files, versions, manifests, boundaries, architect-ui
#                  sheet), plus the `local-ci` commit status: the
#                  pre-push hook (.githooks/pre-push -> scripts/ci-local.sh)
#                  ran clippy, the wasm check and the tests `cargo rail
#                  plan` says the change affects, and posted it. Both are
#                  required on main.
#   push to main   the FULL set on WarpBuild, once per merge. It catches two
#                  PRs that each passed alone but break together, and its
#                  green aggregator is what `just release-tag` requires.
#
# WHERE EACH JOB RUNS:
#
#   plan            ubuntu-latest   rustup + the released cargo-rail binary
#   pr-checks       ubuntu-latest   nix .#ci, no rust-cache (no codegen)
#   lint            warp 8x  + snapshot task-lint    clippy, docs (check mode)
#   tests           warp 16x + snapshot task-tests   the nextest build
#   wasm            ubuntu-latest   nix .#ci + rust-cache (checks-wasm): 3 min
#   checks-passed   ubuntu-latest   the required aggregator
#
# The repo is public, so hosted standard runners cost nothing; WarpBuild
# bills per started minute (2x $0.004, 8x $0.016, 16x $0.032 in 2026-10),
# so only the two jobs that build the workspace run there. Their snapshots
# (.github/actions/warp-nix) keep /nix and the target dir, saved from main
# only (.github/actions/warp-snapshot-save), so a run after a merge
# compiles what the merge changed. Seed a missing alias before the merge
# that needs it, rather than paying the cold build on main:
#
#   gh workflow run checks.yml --ref <branch> -f seed=true
#
# Toolchain comes from the repo flake: every job enters `.#ci` once (rust
# 1.98 pin, wasm target, clang env for ring, native headers, tailwindcss,
# cargo-rail) and every later step runs inside it.
#
# CHANGE SELECTION: `cargo rail plan` (the version nix/modules/cargo-rail.nix
# pins) through cargo's resolved reverse-dependency graph, turned into
# gates plus a nextest filterset by scripts/ci-rail-plan.py. The local hook
# uses it for every PR; here only a dispatch with `base` narrows. Only which
# tests RUN narrows; the test BUILD stays --workspace so the warm target
# dir keeps one artifact set. Full runs record rail's observed-input
# EVIDENCE for their commit into the Actions cache; a later plan against
# that commit restores it, so a change to docs/fixtures/examples narrows
# instead of widening. Workflow, Justfile, nix, scripts or nextest-config
# changes (.config/rail.toml [plan.work.*]), workspace scope, or any rail
# failure FAIL OPEN to the full set.
#
# CACHE (hosted wasm): Swatinem/rust-cache, SAVED ONLY ON MAIN. A repo gets
# 10 GB of Actions cache, evicted LRU across all branches; with main the
# only writer the budget holds one entry per kind (+ the tiny rail
# evidence, architect xtask and cargo-rail entries).

name: checks

# WHEN THIS RUNS:
#
#   PR into main        the free checks above (pr-checks). A release PR
#                       (release/pending: version + changelog only, proved
#                       by the BASE commit's release.sh) skips everything.
#   PR into release/**  a hotfix: the FULL set (no narrowing, and nothing
#                       left to a hook, on a branch that ships straight to
#                       production).
#   push to main        the FULL set, once per merge, and records rail
#   or release/v*       evidence for that commit.
#   by hand             `gh workflow run checks.yml --ref <branch>` runs
#                       everything and, when green, posts `local-ci` on the
#                       branch's head (for a push the hook couldn't vouch
#                       for); add `-f base=main` to check only what the
#                       branch changed, `-f seed=true` to save the snapshots.
#   nightly             the FULL set on main, unless a push run already
#                       passed at main's head (nothing merged since).
#
# A merge never deploys: production changes only when a v* tag is pushed
# (deploy.yml).
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    # release/v* (hotfix branches), not release/pending: a release PR's
    # head is version + changelog only and gets no full run of its own.
    branches: [main, "release/v*"]
  workflow_dispatch:
    inputs:
      base:
        description: "Only check crates affected since this ref (e.g. main). Empty = everything."
        required: false
        default: ""
      seed:
        description: "Save the WarpBuild snapshots from this run (warms a new alias before a merge)."
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 10 * * *"

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  cancel-in-progress: true

env:
  # mold for the host target only -- 326 test binaries get linked on a
  # `nextest run`, and GNU ld is the serial part of that. Scoped to the
  # host triple so the wasm32 rustflags in .cargo/config.toml are
  # untouched.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  # Terse, stable logs — this is CI, not a terminal.
  CARGO_TERM_COLOR: never
  # Incremental compilation helps repeated edits in one tree; a CI delta is
  # a whole merge, and incremental output is dead weight in a snapshot.
  CARGO_INCREMENTAL: "0"
  # Every build step runs through this, as its own build KIND
  # (checks-tests, checks-clippy, …): it records which units of the target
  # dir that step used, fresh or rebuilt, and the last step sweeps
  # everything no kind's latest build used, so a snapshot keeps exactly
  # one build. See scripts/target-sweep.py and docs/agents/build-strategy.md.
  # --record-failed: a red test run still compiled, and its artifacts are
  # what the next run needs warm.
  SWEEP_RUN: python3 scripts/target-sweep.py run --record-failed
  # The WarpBuild jobs save their snapshot on these runs only.
  SAVE_SNAPSHOT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.seed) }}

jobs:
  # Hosted, and without nix: the plan only resolves cargo's graph and
  # diffs two commits, so it needs cargo and cargo-rail, not the dev
  # shell's ~3 GB closure, and installs them only when it actually has to
  # narrow (a dispatch with `base`): the pinned rustc with the minimal
  # profile, and the RELEASED cargo-rail binary at exactly the version
  # nix/modules/cargo-rail.nix builds (checksum-verified), so the plan and
  # the shell's rail never drift.
  plan:
    name: Plan affected crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # A PR into main: the free checks only (pr-checks).
      light: ${{ steps.filter.outputs.light }}
      full: ${{ steps.filter.outputs.full }}
      cargo: ${{ steps.filter.outputs.cargo }}
      tests: ${{ steps.filter.outputs.tests }}
      test_filter: ${{ steps.filter.outputs.test_filter }}
      wasm: ${{ steps.filter.outputs.wasm }}
      skip: ${{ steps.filter.outputs.skip }}
      ref: ${{ steps.filter.outputs.ref }}
      record: ${{ steps.filter.outputs.record }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the plan needs both diff endpoints' ancestry.
          fetch-depth: 0
      # Which commit to plan against (only a dispatch with `base` narrows),
      # decided before the evidence restore (its cache key is that commit).
      - name: Choose the comparison base
        id: base
        env:
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          set -u
          base=""
          if [ "${GITHUB_EVENT_NAME:-}" = workflow_dispatch ] && [ -n "${DISPATCH_BASE}" ]; then
            git fetch --quiet origin "${DISPATCH_BASE}" || true
            base="$(git merge-base "origin/${DISPATCH_BASE}" HEAD 2>/dev/null || true)"
          fi
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
          echo "base: ${base:-<none>}"
      # The path is a LITERAL `~/rail-evidence` in both this restore and the
      # tests job's save: actions/cache versions an entry by its path
      # strings (and compression), so `${{ runner.temp }}` — a different
      # directory on every runner — never matched across runners.
      - name: Restore rail evidence for the base
        if: ${{ steps.base.outputs.sha != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/rail-evidence
          key: rail-evidence-${{ runner.os }}-${{ runner.arch }}-cargo.test-${{ steps.base.outputs.sha }}
      - name: Plan affected crates
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.base.outputs.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVIDENCE: ~/rail-evidence/cargo.test.json
        run: |
          set -u
          EVIDENCE="${EVIDENCE/#\~/$HOME}"

          # Fail open: if we cannot compute an honest plan, run everything.
          run_all() {
            echo "plan: $1 — running EVERYTHING"
            printf 'full=true\ncargo=true\ntests=true\ntest_filter=\nwasm=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          skip_all() {
            echo "plan: $1 — nothing to run"
            printf 'skip=true\nfull=false\ncargo=false\ntests=false\ntest_filter=\nwasm=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          light() {
            echo "plan: $1 — the free checks; clippy and the tests ran in the pre-push hook (local-ci)"
            printf 'light=true\nfull=false\ncargo=false\ntests=false\ntest_filter=\nwasm=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Full runs record evidence for the commit they check, so later
          # plans against it can narrow.
          record() { echo "record=true" >> "$GITHUB_OUTPUT"; }

          case "${GITHUB_EVENT_NAME:-}" in
            pull_request)
              # The release commit: its content was checked before it.
              # The BASE commit's release.sh decides, never the PR's own
              # copy: a release/pending branch that edited the script
              # must not be able to skip every check.
              git show "${BASE_SHA}:scripts/release.sh" > "${RUNNER_TEMP}/release-base.sh"
              if bash "${RUNNER_TEMP}/release-base.sh" release-only; then
                skip_all "release commit only (${HEAD_REF})"
              fi
              case "${BASE_REF}" in
                release/*) run_all "PR into ${BASE_REF} (hotfix): full set" ;;
              esac
              light "PR into ${BASE_REF}" ;;
            push)
              record; run_all "push to ${GITHUB_REF_NAME}: full set after every merge" ;;
            schedule)
              # Nothing merged since the last green push run: nothing new
              # to learn, and every full run is billed.
              green="$(gh run list --workflow checks.yml --commit "${GITHUB_SHA}" --event push \
                --status success --json databaseId -q length 2>/dev/null || echo 0)"
              [ "${green:-0}" -gt 0 ] && skip_all "nightly: a push run already passed at ${GITHUB_SHA:0:8}"
              record; run_all "nightly" ;;
            workflow_dispatch)
              [ -n "${BASE}" ] || { record; run_all "manual dispatch"; } ;;
            *) run_all "event ${GITHUB_EVENT_NAME:-?}" ;;
          esac
          [ -n "${BASE}" ] || run_all "no comparison base"

          # Narrowing: install the pinned toolchain (minimal) and cargo-rail.
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rail="$(sed -n 's/^ *version = "\([^"]*\)";.*/\1/p' nix/modules/cargo-rail.nix | head -1)"
          [ -n "${channel}" ] && [ -n "${rail}" ] || run_all "cannot read the toolchain/cargo-rail pins"
          rustup toolchain install "${channel}" --profile minimal --no-self-update \
            || run_all "rustup ${channel} failed"
          export RUSTUP_TOOLCHAIN="${channel}"
          dl="${RUNNER_TEMP}/cargo-rail"
          mkdir -p "${dl}"
          url="https://github.com/loadingalias/cargo-rail/releases/download/v${rail}"
          { curl -fsSL -o "${dl}/rail.zip" "${url}/cargo-rail-x86_64-unknown-linux-gnu.zip" \
            && curl -fsSL -o "${dl}/SHA256SUMS" "${url}/SHA256SUMS" \
            && (cd "${dl}" && grep ' cargo-rail-x86_64-unknown-linux-gnu.zip$' SHA256SUMS \
                | sed 's/cargo-rail-x86_64-unknown-linux-gnu.zip$/rail.zip/' | sha256sum -c --quiet) \
            && unzip -q -o "${dl}/rail.zip" -d "${dl}"; } \
            || run_all "cargo-rail ${rail} download failed"
          export PATH="${dl}/cargo-rail:${PATH}"
          cargo rail --version || run_all "cargo-rail does not run"

          ev=()
          if [ -f "${EVIDENCE}" ]; then
            ev=(--evidence "${EVIDENCE}")
            echo "plan: using rail evidence for ${BASE}"
          else
            echo "plan: no rail evidence for ${BASE} (non-Rust changes will widen)"
          fi
          plan="${RUNNER_TEMP}/rail-plan.json"
          cargo rail plan --from "${BASE}" --to HEAD "${ev[@]}" --json > "${plan}" \
            || run_all "cargo rail plan failed"
          cargo rail plan --from "${BASE}" --to HEAD "${ev[@]}" --explain-work cargo.test || true

          gates="$(python3 scripts/ci-rail-plan.py "${plan}")" \
            || run_all "plan parse failed"
          [ -n "${gates}" ] || run_all "plan parse produced no gates"
          echo "${gates}" >> "$GITHUB_OUTPUT"
          echo "${gates}"

  # A PR into main: everything here compiles nothing of Task's, so it runs
  # on a free hosted runner without a rust-cache. Clippy, wasm and the
  # tests are the pre-push hook's (the `local-ci` status).
  pr-checks:
    name: PR checks (fmt + change files + manifests + boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: ${{ needs.plan.outputs.light == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit plus its parents: the change check diffs
          # against the first parent (the base it merges into).
          fetch-depth: 2
      - uses: ./.github/actions/hosted-nix-rust
        with:
          kind: pr
          rust-cache: "false"
      - name: fmt
        run: just ci-fmt
      # Every crate the PR changes needs a cargo-rail change file
      # (.changes/README), against the base this PR merges into.
      - name: Change files
        if: ${{ !cancelled() }}
        run: just ci-changes "$(git rev-parse HEAD^1)"
      - name: One version everywhere
        if: ${{ !cancelled() }}
        run: just ci-versions
      - name: Manifests + lockfile
        if: ${{ !cancelled() }}
        run: just ci-manifests
      - uses: ./.github/actions/architect-xtask
        if: ${{ !cancelled() }}
      # Layer table + ratcheted baselines in boundaries.toml (architect
      # ADR layout.md, STA-268). Resolves graphs, compiles nothing.
      - name: Boundaries
        if: ${{ !cancelled() }}
        run: just ci-boundaries
      # Task's tokens come from architect-ui through apps/.architect-ui;
      # fails on a re-vendored copy or an import that bypasses the link
      # (STA-392).
      - name: architect-ui sheet
        if: ${{ !cancelled() }}
        run: just ci-architect-css

  # THREE full-run jobs, one per BUILD KIND.
  #
  #   lint   warp 8x   fmt, manifests, Boundaries, architect-ui, clippy,
  #                    docs: check/doc mode, no codegen.
  #   tests  warp 16x  the nextest build (full codegen) + rail evidence.
  #   wasm   hosted    the wasm32 check (another target triple).
  #
  # The three kinds share NO artifacts except build scripts and proc
  # macros (clippy re-checked 250 crates straight after the test build:
  # check-mode units are not the test build's units). So they run side by
  # side, each with its own snapshot or cache.
  lint:
    name: Lint (fmt + clippy + boundaries + docs)
    runs-on: warp-ubuntu-latest-x64-8x;snapshot.key=task-lint
    timeout-minutes: 60
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty = the event's own ref (a hotfix PR's merge ref, a
          # dispatched branch, main for the nightly).
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - uses: ./.github/actions/warp-nix
      # Every step is a `just ci-*` recipe; the Justfile is the single
      # source of truth, and `just ci` runs the same set locally.
      - name: fmt
        run: just ci-fmt
      # A hotfix PR into release/**: its changed crates need change files.
      - name: Change files
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: just ci-changes "$(git rev-parse HEAD^1)"
      - name: One version everywhere
        if: ${{ !cancelled() }}
        run: just ci-versions
      - name: Manifests + lockfile
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        run: just ci-manifests
      - uses: ./.github/actions/architect-xtask
        if: ${{ !cancelled() }}
      - name: Boundaries
        if: ${{ !cancelled() }}
        run: just ci-boundaries
      - name: architect-ui sheet
        if: ${{ !cancelled() }}
        run: just ci-architect-css
      - name: Clippy
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        run: ${SWEEP_RUN} checks-clippy -- just ci-clippy
      # rustdoc -D warnings isn't change-scoped: it documents the whole
      # workspace. Same check-mode dependency metadata as clippy.
      - name: Docs
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        run: ${SWEEP_RUN} checks-docs -- just ci-docs
      - name: Bound the target dir
        if: ${{ always() }}
        run: |
          python3 scripts/target-sweep.py sweep --protect-hours 0 || true
          du -sh "${CARGO_TARGET_DIR}" /nix/store 2>/dev/null || true
          df -h "${CARGO_TARGET_DIR}" | tail -1
      - uses: ./.github/actions/warp-snapshot-save
        if: ${{ !cancelled() }}
        with:
          alias: task-lint
          save: ${{ env.SAVE_SNAPSHOT }}

  tests:
    name: Tests
    runs-on: warp-ubuntu-latest-x64-16x;snapshot.key=task-tests
    timeout-minutes: 60
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true' && needs.plan.outputs.tests == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/warp-nix

      # Full runs first record rail evidence for this commit: the recorder
      # wraps rustc for one `cargo test --no-run` (units already fresh keep
      # their dep-info, so this compiles nothing nextest wouldn't), and the
      # nextest run after it finds every unit fresh. Best effort: a failure
      # only means later plans against this commit widen.
      - name: Tests
        env:
          TASK_CI_TEST_THREADS: "16"
          TASK_CI_TEST_LOG: ${{ runner.temp }}/nextest-ci.log
          TASK_CI_TEST_FILTER: ${{ needs.plan.outputs.test_filter }}
          RECORD: ${{ needs.plan.outputs.record }}
        run: |
          # ~/rail-evidence: the literal path the hosted plan job restores
          # (see its restore step). Emptied first, so a failed recording
          # can never save the previous run's evidence under this commit.
          export EVIDENCE_DIR="$HOME/rail-evidence"
          rm -rf "${EVIDENCE_DIR}"
          # Single quotes on purpose: the inner shell expands them.
          # shellcheck disable=SC2016
          ${SWEEP_RUN} checks-tests -- bash -c '
            if [ "${RECORD}" = "true" ]; then
              mkdir -p "${EVIDENCE_DIR}"
              cargo rail plan evidence --work cargo.test \
                --output "${EVIDENCE_DIR}/cargo.test.json" \
                -- test --workspace --locked --no-run \
                || echo "::warning::rail evidence not recorded; later plans against this commit widen"
            fi
            just ci-tests'
      - name: Evidence key
        id: evidence
        if: ${{ always() && needs.plan.outputs.record == 'true' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [ -f "$HOME/rail-evidence/cargo.test.json" ] && echo "have=true" >> "$GITHUB_OUTPUT" || true
      - name: Save rail evidence
        if: ${{ always() && steps.evidence.outputs.have == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/rail-evidence
          key: rail-evidence-${{ runner.os }}-${{ runner.arch }}-cargo.test-${{ steps.evidence.outputs.sha }}
      - name: Test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-ci
          path: ${{ runner.temp }}/nextest-ci.log
          if-no-files-found: ignore
          retention-days: 7
      # Cargo never collects stale artifacts, and the snapshot keeps
      # whatever is on disk (and is billed for it). Keep exactly the latest
      # build of each kind (scripts/target-sweep.py). always(): a red run
      # gives the space back too.
      - name: Bound the target dir
        if: ${{ always() }}
        run: |
          rm -rf "${CARGO_TARGET_DIR}/debug/incremental"
          python3 scripts/target-sweep.py sweep --protect-hours 0 || true
          python3 scripts/target-sweep.py status || true
          du -sh "${CARGO_TARGET_DIR}" /nix/store 2>/dev/null || true
          df -h "${CARGO_TARGET_DIR}" | tail -1
      - uses: ./.github/actions/warp-snapshot-save
        if: ${{ !cancelled() }}
        with:
          alias: task-tests
          save: ${{ env.SAVE_SNAPSHOT }}

  wasm:
    name: wasm check (task-app-web)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true' && needs.plan.outputs.wasm == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      # wasm32 target + ring's clang env come from the flake CI shell,
      # entered once for every later step; target dir ./target.
      - uses: ./.github/actions/hosted-nix-rust
        with:
          kind: wasm
      #
      # Check via task-app-web, NOT `-p ui -p task-ui-core` directly.
      # getrandom on wasm needs BOTH halves: the `--cfg
      # getrandom_backend="wasm_js"` in .cargo/config.toml (global) and the
      # `wasm_js` FEATURE, which only apps/web enables. Checking the leaf
      # crates alone sets the cfg without the feature, and getrandom fails
      # with "the wasm_js backend requires the wasm_js feature". The web app
      # pulls both leaves in anyway, so coverage is unchanged.
      - name: wasm check (task-app-web)
        run: just ci-wasm

  # The REQUIRED check (its name is the main ruleset's required check,
  # unchanged from the single-job days; `local-ci` is the other). A
  # required check that is skipped counts as passing, so this never skips:
  # it fails unless every job the plan asked for succeeded. A job may only
  # be skipped when the plan said it had no work.
  checks-passed:
    name: Checks (fmt + tests + clippy + wasm + docs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, pr-checks, lint, tests, wasm]
    if: ${{ always() }}
    permissions:
      # A green dispatched full run posts `local-ci` (below).
      statuses: write
    steps:
      - name: Every required job succeeded
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          LIGHT: ${{ needs.plan.outputs.light }}
          PR_CHECKS: ${{ needs.pr-checks.result }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          WANT_TESTS: ${{ needs.plan.outputs.tests }}
          WASM: ${{ needs.wasm.result }}
          WANT_WASM: ${{ needs.plan.outputs.wasm }}
        run: |
          set -u
          fail=0
          bad() { echo "::error::$1"; fail=1; }
          [ "$PLAN" = success ] || bad "plan: $PLAN"
          if [ "$SKIP" = "true" ]; then
            echo "plan: nothing to run"; exit "$fail"
          fi
          if [ "$LIGHT" = "true" ]; then
            [ "$PR_CHECKS" = success ] || bad "pr-checks: $PR_CHECKS"
            echo "pr-checks: $PR_CHECKS (clippy and the tests: the local-ci status)"
            exit "$fail"
          fi
          check() { # name result wanted
            if [ "$3" = "true" ]; then
              [ "$2" = success ] || bad "$1: $2"
            else
              case "$2" in success|skipped) ;; *) bad "$1: $2" ;; esac
            fi
            echo "$1: $2 (wanted=$3)"
          }
          check lint  "$LINT"  true
          check tests "$TESTS" "$WANT_TESTS"
          check wasm  "$WASM"  "$WANT_WASM"
          exit "$fail"
      # The escape hatch for a push the pre-push hook couldn't vouch for (a
      # contributor without the hook, a dirty tree, NO_LOCAL_CI=1): a green
      # dispatched FULL run on the branch stands in for it.
      - name: Post local-ci for a green dispatched full run
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.base == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --silent \
            -f state=success -f context=local-ci \
            -f description="full run on GitHub (${GITHUB_RUN_ID})" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "local-ci posted on ${GITHUB_SHA}"
