# Task Checks — the release gate (and on-demand/nightly checks), on THEBATTLESHIP.
#
# Runs on the org's self-hosted `nix-host` runner (32 cores, 186 GB),
# four instances so this workflow's parallel jobs do not queue behind
# each other. Hosted `ubuntu-latest` is 4 vCPU with nothing warm, which
# is what made a run take 35-40 minutes; see CACHE below.
#
# Toolchain comes from the repo flake: every step runs under
# `nix develop .#ci -c` (rust 1.94 pin, wasm target, clang env for ring,
# native headers, tailwindcss, cargo-rail). `--accept-flake-config` picks
# up the fasttrackstudio.cachix.org substituter from flake.nix nixConfig.
# On this runner the store is already warm, so entering the shell is
# instant and nothing installs nix per job.
#
# CHANGE SELECTION: the `plan` job asks `cargo rail plan` (0.32, built in
# nix/modules/cargo-rail.nix) which workspace packages a change affects,
# through cargo's resolved reverse-dependency graph (~189 members), and
# scripts/ci-rail-plan.py turns that into gates plus a nextest filterset.
# Only which tests RUN narrows; the test BUILD stays --workspace so the
# warm target dir keeps one artifact set. Full runs (push to main, the
# nightly, a dispatch without `base`) record rail's observed-input
# EVIDENCE for their commit (dep-info of every unit, no extra compiling)
# into the Actions cache; a later plan against that commit restores it,
# which is what lets a change to docs/fixtures/examples narrow instead of
# widening to the whole workspace. Workflow, Justfile, nix, scripts or
# nextest-config changes (.config/rail.toml [plan.work.*]), workspace
# scope, or any rail failure FAIL OPEN to the full set.
#
# CACHE: there is none, and that is the point. The old hosted setup ran
# `Swatinem/rust-cache`, which tars a multi-GB target dir up to the
# Actions cache at job end and untars it at job start. A repo gets 10 GB
# of that cache, evicted global-LRU, and three jobs times every open PR
# overflowed it within the hour — so most runs restored NOTHING and
# recompiled 228 crates from cold. That was the entire 35-40 minute wall
# clock. The workspace's 2655 tests execute in 3.3 seconds.
#
# A self-hosted runner needs no such round trip. Each instance keeps a
# CARGO_TARGET_DIR under its own $HOME (a real directory on NVMe, set by
# `workDir` in the fleet aspect — NOT the systemd RuntimeDirectory, which
# is tmpfs and is deleted on restart). It survives jobs, restarts and
# reboots, so an ordinary PR compiles only what it changed.
#
# It lives OUTSIDE $GITHUB_WORKSPACE on purpose: `actions/checkout`
# defaults to `clean: true`, which runs `git clean -ffdx`, and /target is
# gitignored — a target dir inside the checkout would be deleted at the
# start of every run.

name: checks

# WHEN THIS RUNS:
#
#   PR into main        the affected set (rail plan against the PR's base
#                       commit). The release commit (version + changelog only,
#                       proved by release.sh) skips the heavy job.
#   push to main        the FULL set, once per merge, and records rail
#                       evidence for that commit: it is the base the next PRs
#                       plan against, and it catches two PRs that each passed
#                       alone but break together.
#   by hand             `gh workflow run checks.yml --ref <branch>` runs
#                       everything; add `-f base=main` to check only what the
#                       branch changed against main.
#   nightly             the FULL set on dev's tip while `dev` exists (flow v2),
#                       else on main.
#
# A merge to main never deploys: production changes only when a v* tag is
# pushed (deploy.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Only check crates affected since this ref (e.g. main). Empty = everything."
        required: false
        default: ""
  schedule:
    - cron: "17 10 * * *"

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  cancel-in-progress: true

env:
  NIX_DEV: nix develop --accept-flake-config .#ci -c
  # mold for the host target only -- 326 test binaries get linked on a
  # `nextest run`, and GNU ld is the serial part of that. Scoped to the
  # host triple so the wasm32 rustflags in .cargo/config.toml are
  # untouched.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  # Terse, stable logs — this is CI, not a terminal.
  CARGO_TERM_COLOR: never
  # Incremental compilation helps repeated edits in one tree; a CI delta is
  # a whole PR, and it cost 31 GB of the 102 GB a warm instance was holding.
  # Swatinem/rust-cache sets this by default and dropping the action
  # inherited cargo's default of ON, which is how it went unnoticed.
  CARGO_INCREMENTAL: "0"
  # Every build step runs through this, as its own build KIND
  # (checks-tests, checks-clippy, …): it records which units of the target
  # dir that step used, fresh or rebuilt, and the last step sweeps
  # everything no kind's latest build used. See scripts/target-sweep.py
  # and docs/agents/build-strategy.md. --record-failed: a red test run
  # still compiled, and its artifacts are what the next run needs warm.
  SWEEP_RUN: python3 scripts/target-sweep.py run --record-failed

jobs:
  # GitHub applies `timeout-minutes` to EXECUTION, not to time spent
  # queued — with every real job on one host, a stopped runner service
  # would leave a PR sitting "Queued" rather than failing.
  #
  # This watches THIS RUN's own jobs (the `actions: read` the default
  # token already has — the org runners endpoint needs `admin:org`, which
  # no workflow token carries) and fails once anything has sat queued past
  # the grace period. It exits the moment the jobs are picked up, so a
  # healthy run pays a few seconds on a hosted runner.
  queue-timeout:
    name: Queue timeout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail if the self-hosted jobs never start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRACE_SECONDS: "480"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + GRACE_SECONDS ))
          while :; do
            queued="$(gh api \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              -q '[.jobs[] | select(.name != "Queue timeout")
                   | select(.status == "queued") | .name] | join(", ")' || true)"
            if [ -z "${queued}" ]; then
              echo "all jobs picked up"
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Still queued after ${GRACE_SECONDS}s: ${queued}"
              echo "::error::No self-hosted \`task\` runner took the work."
              echo "::error::On THEBATTLESHIP: systemctl status 'github-runner-github-fts-task-*'"
              exit 1
            fi
            echo "queued: ${queued}"
            sleep 20
          done

  plan:
    name: Plan affected crates
    runs-on: [self-hosted, task]
    timeout-minutes: 10
    outputs:
      full: ${{ steps.filter.outputs.full }}
      cargo: ${{ steps.filter.outputs.cargo }}
      tests: ${{ steps.filter.outputs.tests }}
      test_filter: ${{ steps.filter.outputs.test_filter }}
      wasm: ${{ steps.filter.outputs.wasm }}
      skip: ${{ steps.filter.outputs.skip }}
      ref: ${{ steps.filter.outputs.ref }}
      record: ${{ steps.filter.outputs.record }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the plan needs both diff endpoints' ancestry.
          fetch-depth: 0
      # Which commit to plan against, decided before the evidence restore
      # (its cache key is that commit).
      - name: Choose the comparison base
        id: base
        env:
          DISPATCH_BASE: ${{ inputs.base }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          base=""
          case "${GITHUB_EVENT_NAME:-}" in
            pull_request) base="${BASE_SHA}" ;;
            workflow_dispatch)
              if [ -n "${DISPATCH_BASE}" ]; then
                git fetch --quiet origin "${DISPATCH_BASE}" || true
                base="$(git merge-base "origin/${DISPATCH_BASE}" HEAD 2>/dev/null || true)"
              fi ;;
          esac
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
          echo "base: ${base:-<none: full run>}"
      - name: Restore rail evidence for the base
        if: ${{ steps.base.outputs.sha != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rail-evidence
          key: rail-evidence-${{ runner.os }}-${{ runner.arch }}-cargo.test-${{ steps.base.outputs.sha }}
      - name: Plan affected crates
        id: filter
        env:
          BASE: ${{ steps.base.outputs.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVIDENCE: ${{ runner.temp }}/rail-evidence/cargo.test.json
        run: |
          set -u

          # Fail open: if we cannot compute an honest plan, run everything.
          run_all() {
            echo "plan: $1 — running EVERYTHING"
            printf 'full=true\ncargo=true\ntests=true\ntest_filter=\nwasm=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          skip_all() {
            echo "plan: $1 — nothing to run"
            printf 'skip=true\nfull=false\ncargo=false\ntests=false\ntest_filter=\nwasm=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Full runs record evidence for the commit they check, so later
          # plans against it can narrow.
          record() { echo "record=true" >> "$GITHUB_OUTPUT"; }

          case "${GITHUB_EVENT_NAME:-}" in
            pull_request)
              # The release commit: its content was checked before it.
              if bash scripts/release.sh release-only; then
                skip_all "release commit only (${HEAD_REF})"
              fi ;;
            push)
              record; run_all "push to ${GITHUB_REF_NAME}: full set after every merge" ;;
            schedule)
              if git ls-remote --exit-code --heads origin dev >/dev/null; then
                echo "ref=dev" >> "$GITHUB_OUTPUT"
              fi
              record; run_all "nightly" ;;
            workflow_dispatch)
              [ -n "${BASE}" ] || { record; run_all "manual dispatch"; } ;;
            *) run_all "event ${GITHUB_EVENT_NAME:-?}" ;;
          esac
          [ -n "${BASE}" ] || run_all "no comparison base"

          ev=()
          if [ -f "${EVIDENCE}" ]; then
            ev=(--evidence "${EVIDENCE}")
            echo "plan: using rail evidence for ${BASE}"
          else
            echo "plan: no rail evidence for ${BASE} (non-Rust changes will widen)"
          fi
          plan="${RUNNER_TEMP}/rail-plan.json"
          ${NIX_DEV} cargo rail plan --from "${BASE}" --to HEAD "${ev[@]}" --json > "${plan}" \
            || run_all "cargo rail plan failed"
          ${NIX_DEV} cargo rail plan --from "${BASE}" --to HEAD "${ev[@]}" --explain-work cargo.test || true

          gates="$(${NIX_DEV} python3 scripts/ci-rail-plan.py "${plan}")" \
            || run_all "plan parse failed"
          [ -n "${gates}" ] || run_all "plan parse produced no gates"
          echo "${gates}" >> "$GITHUB_OUTPUT"
          echo "${gates}"

  # ONE job, on ONE runner instance, against ONE target dir.
  #
  # These used to be three parallel jobs. On hosted runners that was free
  # — three isolated VMs — but on a persistent runner it is waste twice
  # over. The 228 dependency crates are the dominant cost of every one of
  # these commands, and three jobs on three instances built them three
  # times into three target dirs (measured mid-run: 2.0G + 2.8G + 438M).
  # And a single PR occupied three of the four slots, so a second PR
  # queued behind the first instead of running beside it.
  #
  # Serialised into one job they share a target dir, so the deps are
  # built once and each later command pays only its own marginal cost.
  # Four slots now mean four concurrent PRs.
  #
  # ORDER IS DELIBERATE:
  #   fmt         — compiles nothing; fails in seconds on trivia.
  #   nextest     — needs full CODEGEN of every dependency. The expensive
  #                 one, so it goes first and everything after reuses the
  #                 rlibs it leaves behind.
  #   clippy      — needs only dependency METADATA, which the test build
  #                 already produced. Reversing these two would pay for
  #                 the codegen afterwards anyway.
  #   wasm        — a different target triple, so a separate tree; it
  #                 shares only build scripts and proc macros.
  #   docs        — rustdoc, release PRs only.
  #
  # Steps run under `!cancelled()` rather than stopping at the first
  # failure: serialised, a bail-out would cost a whole extra run to learn
  # the next thing wrong. One run still reports fmt AND tests AND clippy.
  checks:
    name: Checks (fmt + tests + clippy + wasm + docs)
    runs-on: [self-hosted, task]
    timeout-minutes: 60
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty = the event's own ref (a PR's merge ref, a dispatched
          # branch); `dev` for the nightly run.
          ref: ${{ needs.plan.outputs.ref }}
      - name: Persistent target dir
        run: |
          # Outside $GITHUB_WORKSPACE — actions/checkout runs
          # `git clean -ffdx` and /target is gitignored, so a target dir
          # inside the checkout would be deleted every run. $HOME is this
          # runner INSTANCE's workDir, so two instances never share a
          # cargo lock, and the dir outlives jobs, restarts and reboots.
          # The runner hands each job its own durable cache dir on the
          # big disk ($CI_CACHE_DIR, one per runner instance — see the
          # fleet's github-runner module); older runners without it fall
          # back to the instance's $HOME.
          dir="${CI_CACHE_DIR:-$HOME/cargo-target}/checks"
          # One-time migration off the old per-job dirs. `tests` is the
          # one that held full codegen artifacts, which is exactly what
          # the new step order reuses — adopting it saves this instance a
          # cold build. The other two were duplicates of it and go back to
          # the disk they were wasting.
          if [ ! -d "$dir" ] && [ -d "$HOME/cargo-target/tests" ]; then
            echo "adopting the old tests/ target dir"
            mv "$HOME/cargo-target/tests" "$dir"
          fi
          rm -rf "$HOME/cargo-target/tests" "$HOME/cargo-target/quality" \
                 "$HOME/cargo-target/wasm"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target dir: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"

      # Every step below is a `just ci-*` recipe, and the Justfile is the
      # single source of truth for what each one runs. `just ci` runs the
      # same set in the same order, so an agent verifying before a push
      # gets the gate's answer without spending a round trip on it — the
      # steps stay separate here only for per-step timing and for the
      # plan's gating. (tailwind is a dependency of the recipes that need
      # it, so it no longer needs a step of its own.)
      #
      # fmt is ungated: it compiles nothing, so change selection would
      # save nothing.
      - name: fmt
        run: ${NIX_DEV} just ci-fmt
      # Ungated too: greps manifests and workflows, compiles nothing.
      - name: One version everywhere
        if: ${{ !cancelled() }}
        run: ${NIX_DEV} just ci-versions
      - name: Manifests + lockfile
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        run: ${NIX_DEV} just ci-manifests
      # Ungated: resolves dependency graphs and scans sources, compiles
      # nothing of Task's. Layer table + ratcheted baselines in
      # boundaries.toml (architect ADR layout.md, STA-268).
      - name: Boundaries
        if: ${{ !cancelled() }}
        run: ${NIX_DEV} just ci-boundaries
      # Ungated: compiles the Tailwind sheet, nothing of Task's Rust. Task's
      # tokens come from architect-ui through apps/.architect-ui; fails on a
      # re-vendored copy or an import that bypasses the link (STA-392).
      - name: architect-ui sheet
        if: ${{ !cancelled() }}
        run: ${NIX_DEV} just ci-architect-css

      # `macpro-*` runners are Lima VMs on the Mac Pro: half the test
      # threads (see `ci-tests` in the Justfile), and test scratch on the
      # unit's tmpfs `RuntimeDirectory` (`.config/nextest.toml`,
      # `ci-test-tmpdir`). STA-369.
      # Full runs first record rail evidence for this commit: the recorder
      # wraps rustc for one `cargo test --no-run` (units already fresh keep
      # their dep-info, so this compiles nothing nextest wouldn't), and the
      # nextest run after it finds every unit fresh. Best effort: a failure
      # only means later plans against this commit widen.
      - name: Tests
        if: ${{ !cancelled() && needs.plan.outputs.tests == 'true' }}
        env:
          TASK_CI_TEST_THREADS: ${{ startsWith(runner.name, 'macpro-') && '8' || '16' }}
          TASK_CI_TEST_LOG: ${{ runner.temp }}/nextest-ci.log
          TASK_CI_TEST_FILTER: ${{ needs.plan.outputs.test_filter }}
          RECORD: ${{ needs.plan.outputs.record }}
          EVIDENCE_DIR: ${{ runner.temp }}/rail-evidence
        run: |
          ${NIX_DEV} ${SWEEP_RUN} checks-tests -- bash -c '
            if [ "${RECORD}" = "true" ]; then
              mkdir -p "${EVIDENCE_DIR}"
              cargo rail plan evidence --work cargo.test \
                --output "${EVIDENCE_DIR}/cargo.test.json" \
                -- test --workspace --locked --no-run \
                || echo "::warning::rail evidence not recorded; later plans against this commit widen"
            fi
            just ci-tests'
      - name: Evidence key
        id: evidence
        if: ${{ always() && needs.plan.outputs.record == 'true' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [ -f "${RUNNER_TEMP}/rail-evidence/cargo.test.json" ] && echo "have=true" >> "$GITHUB_OUTPUT" || true
      - name: Save rail evidence
        if: ${{ always() && steps.evidence.outputs.have == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rail-evidence
          key: rail-evidence-${{ runner.os }}-${{ runner.arch }}-cargo.test-${{ steps.evidence.outputs.sha }}
      - name: Test log
        if: ${{ always() && needs.plan.outputs.tests == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-ci
          path: ${{ runner.temp }}/nextest-ci.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Clippy
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        run: ${NIX_DEV} ${SWEEP_RUN} checks-clippy -- just ci-clippy

      # wasm32 target + ring's clang env come from the flake CI shell.
      #
      # Check via task-app-web, NOT `-p ui -p task-ui-core` directly.
      # getrandom on wasm needs BOTH halves: the `--cfg
      # getrandom_backend="wasm_js"` in .cargo/config.toml (global) and the
      # `wasm_js` FEATURE, which only apps/web enables. Checking the leaf
      # crates alone sets the cfg without the feature, and getrandom fails
      # with "the wasm_js backend requires the wasm_js feature". The web app
      # pulls both leaves in anyway, so coverage is unchanged.
      - name: wasm check (task-app-web)
        if: ${{ !cancelled() && needs.plan.outputs.wasm == 'true' }}
        run: ${NIX_DEV} ${SWEEP_RUN} checks-wasm -- just ci-wasm

      # PRs into main and every full run (push to main, nightly). rustdoc
      # -D warnings isn't change-scoped: it documents the whole workspace.
      - name: Docs
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' && (github.base_ref == 'main' || needs.plan.outputs.full == 'true') }}
        run: ${NIX_DEV} ${SWEEP_RUN} checks-docs -- just ci-docs

      # Cargo never collects stale artifacts: every rebuild leaves the old
      # one in deps/ forever. On a throwaway VM that is invisible; on a
      # persistent runner it is unbounded — this dir reached 167 GB in two
      # runs, because changing a flag (CARGO_INCREMENTAL) re-fingerprints
      # everything and orphans the previous full set beside the new one.
      #
      # Keep exactly the latest build of each kind (each step above), and
      # nothing else. This replaced `cargo sweep --maxsize 60GB`, which
      # evicts oldest-first: one full run here needs ~100 GB, so every
      # sweep evicted the run's OWN first-built units (the test build's
      # dependencies) and the next run recompiled all ~1300 of them from
      # cold — measured on every release run, "Cleaned 52 GiB" each time.
      # A size cap below the working set is a cache that never hits.
      #
      # always(): a red run has to give the disk back too.
      - name: Bound the target dir
        if: ${{ always() }}
        run: |
          # The tmpfs test scratch is RAM: give it back even after a red
          # run (tests killed by a timeout leave their worlds behind).
          [ -n "${RUNTIME_DIRECTORY:-}" ] && rm -rf "${RUNTIME_DIRECTORY%%:*}/nextest-tmp" || true
          # CARGO_INCREMENTAL=0 stops new incremental output but does not
          # remove what earlier runs left; nothing regenerates this now.
          rm -rf "${CARGO_TARGET_DIR}/debug/incremental"
          ${NIX_DEV} python3 scripts/target-sweep.py sweep --protect-hours 0 || true
          ${NIX_DEV} python3 scripts/target-sweep.py status || true
          du -sh "${CARGO_TARGET_DIR}" || true
          df -h "${CARGO_TARGET_DIR}" | tail -1
