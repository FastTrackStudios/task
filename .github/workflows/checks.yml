# Task Checks — the one PR/push gate, on THEBATTLESHIP.
#
# Runs on the org's self-hosted `nix-host` runner (32 cores, 186 GB),
# four instances so this workflow's parallel jobs do not queue behind
# each other. Hosted `ubuntu-latest` is 4 vCPU with nothing warm, which
# is what made a run take 35-40 minutes; see CACHE below.
#
# Toolchain comes from the repo flake: every step runs under
# `nix develop .#ci -c` (rust 1.94 pin, wasm target, clang env for ring,
# native headers, tailwindcss, cargo-rail). `--accept-flake-config` picks
# up the fasttrackstudio.cachix.org substituter from flake.nix nixConfig.
# On this runner the store is already warm, so entering the shell is
# instant and nothing installs nix per job.
#
# CHANGE SELECTION: the `plan` job asks `cargo rail plan` (patched flake
# build — nix/modules/cargo-rail.nix) which workspace crates the range
# actually affects, walking cargo's resolved reverse-dependency graph.
# This workspace is ~163 members, so that selection is worth real minutes
# per PR. Gates are crate-membership checks against the plan's execution
# set; infra changes (.github/**, flake.nix, nix/**, … — see
# .config/rail.toml [change-detection].infrastructure) or any rail
# failure FAIL OPEN.
#
# CACHE: there is none, and that is the point. The old hosted setup ran
# `Swatinem/rust-cache`, which tars a multi-GB target dir up to the
# Actions cache at job end and untars it at job start. A repo gets 10 GB
# of that cache, evicted global-LRU, and three jobs times every open PR
# overflowed it within the hour — so most runs restored NOTHING and
# recompiled 228 crates from cold. That was the entire 35-40 minute wall
# clock. The workspace's 2655 tests execute in 3.3 seconds.
#
# A self-hosted runner needs no such round trip. Each instance keeps a
# CARGO_TARGET_DIR under its own $HOME (a real directory on NVMe, set by
# `workDir` in the fleet aspect — NOT the systemd RuntimeDirectory, which
# is tmpfs and is deleted on restart). It survives jobs, restarts and
# reboots, so an ordinary PR compiles only what it changed.
#
# It lives OUTSIDE $GITHUB_WORKSPACE on purpose: `actions/checkout`
# defaults to `clean: true`, which runs `git clean -ffdx`, and /target is
# gitignored — a target dir inside the checkout would be deleted at the
# start of every run.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_DEV: nix develop --accept-flake-config .#ci -c
  # mold for the host target only -- 326 test binaries get linked on a
  # `nextest run`, and GNU ld is the serial part of that. Scoped to the
  # host triple so the wasm32 rustflags in .cargo/config.toml are
  # untouched.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  # Four runner instances share 32 cores. Capping each job keeps a full
  # fan-out from thrashing; jobs are not all CPU-saturated at the same
  # moment, so mild oversubscription (4 x 12 > 32) is a win rather than a
  # cost.
  CARGO_BUILD_JOBS: "12"
  # Terse, stable logs — this is CI, not a terminal.
  CARGO_TERM_COLOR: never

jobs:
  # GitHub applies `timeout-minutes` to EXECUTION, not to time spent
  # queued — with every real job on one host, a stopped runner service
  # would leave a PR sitting "Queued" rather than failing. This is the
  # only hosted job left: it asks the API whether an online `nix-host`
  # runner exists and fails in seconds if not, so a dead battleship shows
  # up as a red check instead of silence.
  runner-online:
    name: Runner online
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert an online nix-host runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          online="$(gh api orgs/${{ github.repository_owner }}/actions/runners \
            -q '[.runners[] | select(.status == "online")
                 | select([.labels[].name] | index("nix-host"))] | length')"
          echo "online nix-host runners: ${online}"
          if [ "${online}" -lt 1 ]; then
            echo "::error::No online self-hosted runner carries the nix-host label."
            echo "::error::On THEBATTLESHIP: systemctl status 'github-runner-github-fts-*'"
            exit 1
          fi

  plan:
    name: Plan affected crates
    runs-on: [self-hosted, nix-host]
    needs: runner-online
    timeout-minutes: 10
    outputs:
      workspace: ${{ steps.filter.outputs.workspace }}
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the plan needs both diff endpoints' ancestry.
          fetch-depth: 0
      - name: Plan affected crates
        id: filter
        run: |
          set -u

          # Fail open: if we cannot compute an honest plan, run everything.
          run_all() {
            echo "plan: $1 — running EVERYTHING (fail open)"
            for o in workspace wasm; do
              echo "$o=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          }

          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && run_all "manual dispatch"

          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            base="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD 2>/dev/null)" \
              || run_all "no merge-base"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD~1 2>/dev/null)" || run_all "no parent commit"
            fi
          fi

          plan="$(${NIX_DEV} cargo rail plan --quiet --from "$base" --to HEAD -f json)" \
            || run_all "cargo rail plan failed"

          eval "$(printf '%s' "$plan" | python3 -c '
          import json, sys

          plan = json.load(sys.stdin)

          infra = bool(plan.get("surfaces", {}).get("infra", {}).get("enabled"))
          if plan.get("result") != "success":
              infra = True

          crates = set(plan.get("scope", {}).get("crates", []))

          # The browser build is a first-class target: these crates and
          # everything they pull must stay wasm-clean or the web app stops
          # building. rail already folded reverse deps into `crates`, so
          # membership of the leaf entry points is enough.
          WASM = {"ui", "task-ui-core", "task-player-ui", "task-app-web"}

          gates = {
              "workspace": bool(crates),
              "wasm":      bool(crates & WASM),
          }
          if infra:
              gates = {k: True for k in gates}
              print("infra=true")
          for k, v in gates.items():
              print(f"{k}={str(v).lower()}")
          print(f"n_crates={len(crates)}")
          ')" || run_all "plan parse failed"

          # Infra surface (toolchain / flake / CI inputs changed) is a
          # DELIBERATE full run, not a failure — everything's inputs
          # changed, so everything rebuilds.
          [ "${infra:-false}" = "true" ] && echo "plan: infra-surface change — full run (all gates on)"

          {
            echo "workspace=$workspace"
            echo "wasm=$wasm"
          } >> "$GITHUB_OUTPUT"
          echo "rail plan: $n_crates affected crate(s) — workspace=$workspace wasm=$wasm"

  build:
    name: Build (wasm)
    runs-on: [self-hosted, nix-host]
    timeout-minutes: 30
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - name: Persistent target dir
        run: |
          # Outside $GITHUB_WORKSPACE — actions/checkout runs
          # `git clean -ffdx` and /target is gitignored, so a target dir
          # inside the checkout would be deleted every run. $HOME is this
          # runner INSTANCE's workDir, so two instances never share a
          # cargo lock, and the dir outlives jobs, restarts and reboots.
          dir="$HOME/cargo-target/wasm"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target dir: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"
      # Every step here is gated on the WASM surface, not the workspace
      # one. The native `cargo check --workspace --all-targets` this job
      # used to run was a strict subset of the clippy run in `quality`
      # (clippy-driver does the same check pass before it lints), so it
      # cost 13 minutes to learn nothing. What is left is the one thing
      # only this job does: prove the browser target still builds.
      # apps/{web,desktop,mobile}/assets/tailwind.css are GENERATED, not
      # committed, and asset!() resolves them at compile time — so they
      # have to exist before cargo runs. The CI shell carries the
      # tailwindcss binary, which resolves `@import "tailwindcss"` on its
      # own; the two npm installs this step used to do were a minute a job
      # for nothing.
      - name: tailwind
        if: needs.plan.outputs.wasm == 'true'
        run: ${NIX_DEV} just css

      # wasm32 target + ring's clang env come from the flake CI shell.
      #
      # Check via task-app-web, NOT `-p ui -p task-ui-core` directly.
      # getrandom on wasm needs BOTH halves: the `--cfg
      # getrandom_backend="wasm_js"` in .cargo/config.toml (global) and the
      # `wasm_js` FEATURE, which only apps/web enables. Checking the leaf
      # crates alone sets the cfg without the feature, and getrandom fails
      # with "the wasm_js backend requires the wasm_js feature". The web app
      # pulls both leaves in anyway, so coverage is unchanged.
      - name: wasm check (task-app-web)
        if: needs.plan.outputs.wasm == 'true'
        run: |
          ${NIX_DEV} cargo check --target wasm32-unknown-unknown \
            -p task-app-web

  tests:
    name: Tests
    runs-on: [self-hosted, nix-host]
    timeout-minutes: 30
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - name: Persistent target dir
        run: |
          # Outside $GITHUB_WORKSPACE — actions/checkout runs
          # `git clean -ffdx` and /target is gitignored, so a target dir
          # inside the checkout would be deleted every run. $HOME is this
          # runner INSTANCE's workDir, so two instances never share a
          # cargo lock, and the dir outlives jobs, restarts and reboots.
          dir="$HOME/cargo-target/tests"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target dir: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"
      # apps/{web,desktop,mobile}/assets/tailwind.css are GENERATED, not
      # committed, and asset!() resolves them at compile time — so they
      # have to exist before cargo runs. The CI shell carries the
      # tailwindcss binary, which resolves `@import "tailwindcss"` on its
      # own; the two npm installs this step used to do were a minute a job
      # for nothing.
      - name: tailwind
        if: needs.plan.outputs.workspace == 'true'
        run: ${NIX_DEV} just css
      - name: cargo nextest run --workspace
        if: needs.plan.outputs.workspace == 'true'
        run: ${NIX_DEV} cargo nextest run --profile ci --workspace

  quality:
    name: Quality (fmt + clippy + docs)
    runs-on: [self-hosted, nix-host]
    timeout-minutes: 30
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - name: Persistent target dir
        run: |
          # Outside $GITHUB_WORKSPACE — actions/checkout runs
          # `git clean -ffdx` and /target is gitignored, so a target dir
          # inside the checkout would be deleted every run. $HOME is this
          # runner INSTANCE's workDir, so two instances never share a
          # cargo lock, and the dir outlives jobs, restarts and reboots.
          dir="$HOME/cargo-target/quality"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target dir: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"
      # fmt is ungated: it compiles nothing, so change selection would
      # save nothing.
      - name: fmt
        run: ${NIX_DEV} cargo fmt --all -- --check
      - name: Manifests + lockfile
        if: needs.plan.outputs.workspace == 'true'
        run: ${NIX_DEV} cargo metadata --locked --format-version 1 > /dev/null
      # apps/{web,desktop,mobile}/assets/tailwind.css are GENERATED, not
      # committed, and asset!() resolves them at compile time — so they
      # have to exist before cargo runs. The CI shell carries the
      # tailwindcss binary, which resolves `@import "tailwindcss"` on its
      # own; the two npm installs this step used to do were a minute a job
      # for nothing.
      - name: tailwind
        if: needs.plan.outputs.workspace == 'true'
        run: ${NIX_DEV} just css
      - name: Clippy
        if: needs.plan.outputs.workspace == 'true'
        run: ${NIX_DEV} cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        if: needs.plan.outputs.workspace == 'true' && github.ref == 'refs/heads/main'
        env:
          RUSTDOCFLAGS: -D warnings
        run: ${NIX_DEV} cargo doc --workspace --no-deps
