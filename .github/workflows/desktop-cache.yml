# Linux desktop to the binary cache — build `task-desktop` (x86_64-linux)
# at a release tag and push it to fasttrackstudio.cachix.org, so a NixOS
# host installing the release downloads it instead of compiling the
# workspace (nix/modules/packages/desktop-apps.nix).
#
# The consumer is nix-fleet: a timer on THEBATTLESHIP builds
# `github:FastTrackStudios/task/<rev of the newest vX.Y.Z tag>#task-desktop`
# into /nix/var/nix/profiles/task-desktop. This job builds exactly that
# flake reference, so the out path it pushes is the one the fleet asks
# for. (The cargo derivations are rev-free — crane.nix — so the release
# merge on main and the tag on the release branch, which share a tree,
# give the same path anyway.)
#
# WHEN: called from deploy.yml once the release is published (after the
# tag guard + "GitHub Release"; Verify live runs beside, informational).
# By hand, to backfill a release:
# `gh workflow run desktop-cache.yml --ref main -f tag=v0.2.3`. A release
# already cached is harmless to re-run: cachix skips paths it holds.
#
# WHERE: THEBATTLESHIP's `task-release` pool (self-hosted; its job gate
# admits only tag pushes, main/release pushes and dispatches). The package
# is a pure Nix build of the whole workspace (cargoArtifacts = null): ~61
# min cold on the Mac Pro, an hour or more on a 4-vCPU hosted runner, so the
# warm nix store of the host that installs it is the place to build it. (The
# Free disk / install-nix steps run only if a hosted runner ever takes the
# job.) It runs once per release and nobody waits on it; the result lives in
# cachix, which is the point of the job.
#
# SECRET: CACHIX_AUTH_TOKEN, a repo Actions secret (owned by Keeper; a
# cachix token with write access to `fasttrackstudio`). It reaches cachix
# only through the environment. Without it the job fails loudly rather
# than reporting a release cached that is not.

name: Desktop cache

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to cache. Empty = the v* tag the run is on."
        type: string
        required: false
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to cache (v<X.Y.Z>). Empty = the v* tag the run is on."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-cache-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CACHE: fasttrackstudio

jobs:
  cache:
    name: task-desktop -> cachix
    # THEBATTLESHIP's `task-release` pool: the nix store there is warm (and
    # it is the host whose fleet timer installs this very package), so a
    # release rebuilds only the derivations that changed.
    runs-on: [self-hosted, task-release-desktop]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The image's unused toolchains (Android SDK, .NET, GHC, CodeQL, ~30 GB):
      # the whole-workspace nix build needs the disk.
      - name: Free disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: cachix/install-nix-action@v31
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://fasttrackstudio.cachix.org
            extra-trusted-public-keys = fasttrackstudio.cachix.org-1:r7v7WXBeSZ7m5meL6w0wttnvsOltRvTpXeVNItcy9f4=

      - name: Which release
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags --force origin
          # The input, else the release tag this run is on (deploy.yml's
          # call on a tag push, or a dispatch with the tag as its ref).
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;;
              *) echo "::error::pass the tag input, or run on a v* tag (ref is $GITHUB_REF)"; exit 1 ;;
            esac
          fi
          rev="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" \
            || { echo "::error::no tag $tag — this caches a release that has been tagged (just release)"; exit 1; }
          # This is the PURE flake at the tag, the derivation a NixOS host
          # builds from the same ref, so the cache hits. Releases commit no
          # version and this build is not stamped, so the package reports
          # the version committed at the tag, not the tag's.
          v="$(bash scripts/release.sh version "$tag")"
          {
            echo "tag=$tag"
            echo "version=$v"
            echo "flake=github:${GITHUB_REPOSITORY}/${rev}#packages.x86_64-linux.task-desktop"
          } >> "$GITHUB_OUTPUT"
          echo "release $tag = $rev"

      - name: Build
        id: build
        env:
          FLAKE: ${{ steps.plan.outputs.flake }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          out="$(nix build --accept-flake-config --no-link --print-out-paths --print-build-logs "$FLAKE")"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "built $out"
          # What the fleet checks after an update. `--version` returns
          # before any window, so it needs no display.
          got="$("$out/bin/task-app-desktop" --version)"
          echo "$got"
          [ "$got" = "task-app-desktop $VERSION" ] \
            || echo "::warning::--version says '$got', not 'task-app-desktop $VERSION' (the version committed at the tag; releases before v0.2.4 have no --version)"

      - name: Push to cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          OUT: ${{ steps.build.outputs.out }}
        run: |
          set -euo pipefail
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "::error::CACHIX_AUTH_TOKEN is not set for this repo — nothing pushed. Keeper adds it as a repo Actions secret (write access to $CACHE.cachix.org)."
            exit 1
          fi
          # The closure; cachix skips what cache.nixos.org already serves.
          nix run --accept-flake-config nixpkgs#cachix -- push "$CACHE" "$OUT"

      - name: Verify the cache serves it
        env:
          OUT: ${{ steps.build.outputs.out }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          hash="$(basename "$OUT" | cut -d- -f1)"
          url="https://$CACHE.cachix.org/$hash.narinfo"
          for _ in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -I "$url" || true)"
            [ "$code" = 200 ] && break
            sleep 6
          done
          echo "$url -> $code"
          [ "$code" = 200 ] || { echo "::error::$url answers $code after the push"; exit 1; }
          {
            echo "### task-desktop $TAG cached"
            echo ""
            echo "- out path: \`$OUT\`"
            echo "- narinfo: $url (200)"
          } >> "$GITHUB_STEP_SUMMARY"
