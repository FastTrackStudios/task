# Headless node binaries — standalone `task-server` builds attached to the
# GitHub Release `v<version>`, for running a Task node outside the cluster
# and outside Nix: on a desktop, a home server, a VPS (docs/headless-node.md).
#
#   task-server-linux-x86_64     glibc >= the Nix toolchain's floor (2.39 today;
#                                built on THEBATTLESHIP, printed by the build)
#   task-server-linux-aarch64    glibc >= 2.35
#   task-server-macos-aarch64    macOS 14+, Apple silicon
#   SHA256SUMS                   `sha256sum` format, over all three
#   SHA256SUMS.minisig           minisign signature of SHA256SUMS, by the release
#                                key, trusted comment "task-server <tag> SHA256SUMS"
#
# The signature is what `self-update` trusts: the binaries and SHA256SUMS
# come from the same release, so whoever can write release assets can swap
# both, and only a key that is not in the release proves which build it is.
# The secret half is the TASK_RELEASE_MINISIGN_KEY Actions secret (an
# unencrypted minisign secret key file, `minisign -G -W`); the public half
# is RELEASE_SIGNING_KEY in apps/server/src/self_update.rs, and the publish
# job refuses to sign with a key that is not that one. A tag that pins a
# key fails without the secret (an unsigned release would be one no pinned
# node installs); only a backfill of a tag from before the pin (v0.2.4 and
# older) goes out unsigned, with a warning.
#
# The asset names are a contract: `task-server self-update`
# (apps/server/src/self_update.rs) and scripts/install-node.sh look them up
# by name, and a unit test reads this file to keep the two in step.
#
# WHEN: called from deploy.yml once the release is published (after the
# tag guard + "GitHub Release", on the release tag; Verify live runs beside,
# informational, and nothing waits on it). By hand: `gh workflow run
# node-binaries.yml --ref v0.2.4` (or `-f tag=v0.2.3` to backfill a release
# from its tag). A release that already carries SHA256SUMS is left alone
# unless `replace` is set: a published checksum must not change under
# anyone who verified it.
#
# WHERE: linux-x86_64 on THEBATTLESHIP's `task-release` pool, in the Nix dev
# shell on a warm target dir (scripts/node-binary-linux.sh: OpenSSL and
# bzip2 static, the binary taken off /nix/store, so it needs only glibc and
# libgcc_s; its glibc floor is the Nix toolchain's, decision 2026-10-24).
# linux-aarch64 (ubuntu-22.04-arm) and macos-aarch64 stay on GitHub-hosted
# runners until they get machines of their own: built against the OS's own
# libc with rustup's toolchain, OpenSSL static (OPENSSL_STATIC).

name: Node binaries

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach to. Empty = the v* tag the run is on."
        type: string
        required: false
        default: ""
    secrets:
      # Passed by name from deploy.yml. A called job that declares
      # `environment:` still gets that environment's secrets only when the
      # caller passes them; otherwise they resolve to "" with no error
      # (which is how v26.10.0's binaries were refused as unsigned). Not
      # `required`: a backfill of a pre-pin tag runs without it.
      TASK_RELEASE_MINISIGN_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach to (v<X.Y.Z>). Empty = the v* tag the run is on."
        required: false
        default: ""
      replace:
        description: "Rebuild and replace binaries a release already carries."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: node-binaries-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Which release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REPLACE: ${{ inputs.replace && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
              || { echo "::error::no tag $tag"; exit 1; }
            ref="$tag"
          else
            # No tag input: the run must itself be on a release tag (the
            # deploy's workflow_call, or a dispatch with the tag as its
            # ref). A branch dispatch would read its own Cargo.toml and
            # could swap a published release's binaries for branch-built
            # ones.
            case "${GITHUB_REF}" in
              refs/tags/v*) ;;
              *) echo "::error::run this on a v* tag (ref is ${GITHUB_REF}), or pass the tag input"; exit 1 ;;
            esac
            tag="${GITHUB_REF#refs/tags/}"
            ref="${GITHUB_SHA}"
          fi
          # The binaries report the tag's version: the build stamps it
          # (releases commit none), so the tag must be a release version.
          bash scripts/release.sh image-tag "$tag" >/dev/null
          # Either way the tag is a commit of main: binaries attach to
          # releases, not to branch builds.
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$(git rev-parse "refs/tags/$tag^{commit}")" origin/main \
            || { echo "::error::$tag is not in main's history"; exit 1; }
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no GitHub Release $tag — the binaries attach to a published release (release.yml publishes it)"
            exit 1
          fi
          build=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
              | grep -qx SHA256SUMS && [ "$REPLACE" != true ]; then
            echo "::notice::$tag already carries node binaries — nothing to do (dispatch with replace=true to rebuild)"
            build=false
          fi
          {
            echo "tag=$tag"
            echo "ref=$ref"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "release $tag from $ref (build: $build)"

  build:
    name: ${{ matrix.asset }}
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # THEBATTLESHIP's `task-release` pool, from the Nix dev shell:
          # scripts/node-binary-linux.sh links OpenSSL and bzip2 statically
          # and takes the binary off /nix/store (glibc floor: the Nix
          # toolchain's, decision 2026-10-24).
          - asset: task-server-linux-x86_64
            os: [self-hosted, task-release]
            target: x86_64-unknown-linux-gnu
          - asset: task-server-linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # airlock's `task-release-mac` runner (as Studio's macOS release
          # builds): Homebrew's OpenSSL static + rust-toolchain.toml's rustup
          # toolchain, so the binary links only the OS (checked below).
          - asset: task-server-macos-aarch64
            os: [self-hosted, macos, task-release-mac]
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # libssl.a instead of libssl.so.3 / Homebrew's dylib: the binary must
      # not depend on a library a fresh host may not have. On Linux this is
      # only honoured together with OPENSSL_LIB_DIR / OPENSSL_INCLUDE_DIR
      # (set below): with `OPENSSL_STATIC=1` alone openssl-sys goes through
      # pkg-config, emits a dynamic `link-lib=ssl` and v0.2.4's binaries
      # needed libssl.so.3 (probed on ubuntu-22.04 and -arm, STA-161).
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      # Releases commit no version: write the tag's into this checkout, so
      # every binary reports the release.
      - name: Stamp the release version
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/release.sh stamp "$TAG"

      - name: Native build dependencies (Linux)
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config libssl-dev cmake clang
          # Point openssl-sys at the static archives (/usr/lib/<multiarch>/libssl.a,
          # libcrypto.a ship in libssl-dev) so it links them statically.
          m="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          test -f "/usr/lib/$m/libssl.a" -a -f "/usr/lib/$m/libcrypto.a" \
            || { echo "::error::no static OpenSSL archives in /usr/lib/$m"; exit 1; }
          echo "OPENSSL_LIB_DIR=/usr/lib/$m" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> "$GITHUB_ENV"

      - name: Native build dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          # airlock: Homebrew and rustup live outside the runner's PATH.
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          # The oldest macOS the binary promises to run on.
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      # rustup reads rust-toolchain.toml: the same compiler as the dev shell.
      - name: Toolchain
        if: ${{ runner.environment == 'github-hosted' || runner.os == 'macOS' }}
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Build
        if: ${{ runner.environment == 'github-hosted' || runner.os == 'macOS' }}
        run: cargo build --release --locked -p task-server --target ${{ matrix.target }}

      # Builds, checks what the binary needs and its glibc floor, and runs it.
      # Linux only: the macOS target runs on a self-hosted Mac (airlock),
      # which the step above builds; this one there would put its target
      # dir at `/node` (no TASK_CACHE_DIR) and fail on the read-only root.
      - name: Build (THEBATTLESHIP, Nix)
        if: ${{ runner.environment == 'self-hosted' && runner.os == 'Linux' }}
        run: |
          CARGO_TARGET_DIR="$TASK_CACHE_DIR/node" OUT_DIR="$PWD/dist" \
            bash scripts/node-binary-linux.sh

      # The binary reports the release's version, and links nothing but
      # the platform's own libraries.
      - name: Verify
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          [ "v$(bash scripts/release.sh version)" = "$TAG" ] \
            || { echo "::error::built $(bash scripts/release.sh version), releasing $TAG"; exit 1; }
          # The Nix build checked itself (scripts/node-binary-linux.sh).
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ "$RUNNER_OS" = Linux ]; then
            ls -la "dist/${{ matrix.asset }}"
            exit 0
          fi
          bin="target/${{ matrix.target }}/release/task-server"
          bash scripts/check-versions.sh --bin "$bin"
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "$bin"
            if ldd "$bin" | grep -E 'libssl|libcrypto|/nix/store'; then
              echo "::error::$bin links a library a fresh host may lack"; exit 1
            fi
          else
            otool -L "$bin"
            if otool -L "$bin" | tail -n +2 | grep -vE '^\s*(/usr/lib/|/System/Library/)'; then
              echo "::error::$bin links something outside the OS"; exit 1
            fi
          fi
          # `--help` must not boot either.
          "$bin" --help >/dev/null
          mkdir -p dist
          cp "$bin" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to the release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The signing key is an environment secret, and the environment only
    # admits runs on a `v*` tag (deployment policy). A branch run, or a
    # workflow edited on a branch, cannot read it (Reviewer S11, STA-161).
    # Keep TASK_RELEASE_MINISIGN_KEY out of the repository-level secrets:
    # an environment job can read those too.
    environment: release-signing
    permissions:
      contents: write
    steps:
      # Only for the pinned public key the signature must verify against.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          sparse-checkout: apps/server/src/self_update.rs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums, signature + upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          MINISIGN_KEY: ${{ secrets.TASK_RELEASE_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          # The const, however rustfmt wraps it: `Some("RW…")`, or empty for `None`.
          pinned="$(awk '/^pub const RELEASE_SIGNING_KEY/{f=1} f{printf "%s", $0} f&&/;$/{exit}' \
            apps/server/src/self_update.rs | tr -d ' ' | sed -n 's/.*=Some("\([A-Za-z0-9+\/=]*\)");$/\1/p')"
          cd dist
          for a in task-server-linux-x86_64 task-server-linux-aarch64 task-server-macos-aarch64; do
            [ -f "$a" ] || { echo "::error::missing $a"; exit 1; }
          done
          sha256sum task-server-* > SHA256SUMS
          cat SHA256SUMS
          assets=(task-server-* SHA256SUMS)
          if [ -n "$pinned" ] && [ -z "$MINISIGN_KEY" ]; then
            echo "::error::$TAG pins RELEASE_SIGNING_KEY but TASK_RELEASE_MINISIGN_KEY is not set (release-signing environment): an unsigned release would install on no node"
            exit 1
          fi
          if [ -n "$MINISIGN_KEY" ]; then
            [ -n "$pinned" ] || { echo "::error::TASK_RELEASE_MINISIGN_KEY is set but $TAG pins no RELEASE_SIGNING_KEY: nodes could not verify this signature"; exit 1; }
            sudo apt-get install -y -q minisign >/dev/null
            key="$RUNNER_TEMP/release.key"
            ( umask 077; printf '%s\n' "$MINISIGN_KEY" > "$key" )
            minisign -S -s "$key" -m SHA256SUMS -x SHA256SUMS.minisig -t "task-server $TAG SHA256SUMS"
            rm -f "$key"
            # Signed by the key the binaries pin, or nothing is published.
            minisign -V -P "$pinned" -m SHA256SUMS -x SHA256SUMS.minisig
            assets+=(SHA256SUMS.minisig)
          else
            echo "::warning::$TAG pins no RELEASE_SIGNING_KEY (a tag from before the pin) and TASK_RELEASE_MINISIGN_KEY is not set: its node binaries go out unsigned, and task-server self-update will not install them"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          {
            echo "### Node binaries attached to $TAG"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
