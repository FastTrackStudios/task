# Task macOS TestFlight — build the Task desktop app (task-app-desktop, a
# Dioxus/dx macOS app) and upload it to TestFlight for Mac when a release tag
# `vX.Y.Z` is pushed (a push to main builds nothing). The macOS mirror of
# task-ios.yml; testers' Macs then auto-update via the TestFlight app.
#
# Runs on the SAME self-hosted airlock Mac as the iOS workflows and shares
# their `ios-testflight` concurrency group, so the single Mac never runs two
# Apple builds at once (they queue behind each other and don't fight over
# target/ or the keychain).
#
# The build script is apps/desktop/macos/deploy-testflight-macos.sh
# (keychain unlock → ASC-API provisioning profile → dx build → App-Sandbox
# codesign → installer .pkg → altool upload). One-time machine setup is
# apps/desktop/macos/setup-macos.sh (signing identities in the build
# keychain); see docs/macos-testflight.md for the runbook.
#
# ONCE PER RELEASE: the trigger is the release tag, and the build is marked
# with the release's version (the Version step). The `desktop-release` job
# below also cuts the Developer-ID `desktop-v<ver>` release the in-app
# updater follows. No `paths:` filter (tag pushes ignore them).
# workflow_dispatch forces a build (select the tag as the ref).

name: task-macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "CFBundleShortVersionString. Empty = the workspace version in Cargo.toml (the release's)."
        required: false
        default: ""
      desktop_release:
        description: "Developer-ID desktop job: skip, or build (build + notarize, never publish). Publishing happens only on a v* tag push."
        type: choice
        options: [skip, build]
        default: skip

# Serialize with the iOS builds — one Apple build at a time on the single
# Mac. Shared group name across the workflows; queue, never cancel.
concurrency:
  # Per-WORKFLOW, not shared across the three Apple workflows.
  #
  # They used to share one `ios-testflight` group, intending to stop the
  # single Mac running two Apple builds at once. The effect was the
  # opposite of the intent: a concurrency group holds only ONE pending
  # run, so task-ios and task-macos evicted each other — every merge
  # fires both, the later arrival takes the pending slot, and the other
  # is CANCELLED. task-ios lost that race every time, which is why
  # TestFlight went stale while every run showed "cancelled".
  #
  # The serialization they wanted is already guaranteed: airlock is a
  # SINGLE self-hosted runner and runs one job at a time, so two Apple
  # builds cannot overlap regardless. The shared group added nothing
  # except mutual cancellation.
  #
  # Keeping the group per-workflow preserves the useful half — a newer
  # run of the SAME workflow supersedes an older queued one.
  group: ios-testflight-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: [self-hosted, macos, airlock]
    # Fail loudly when the airlock Mac isn't there. Without this a job
    # with no available runner just QUEUES, and is eventually cancelled —
    # which reads as "cancelled", not "failed", so nothing alerts and
    # nobody looks. That is exactly how TestFlight silently missed every
    # merge from 2026-08-09 onward while the runner was offline: four
    # cancelled runs in a row, discovered only by picking up the phone.
    # A timeout turns a missing runner into a red X within the hour.
    timeout-minutes: 90
    steps:
      # The runner's work dir lives on an external SSD (/Volumes/build-disk).
      # If that volume is not mounted — after a reboot or a power cut — the
      # runner's checkout path simply does not exist, and every later step
      # fails with a confusing "no such file" instead of "the disk is gone".
      # Fail here, with the reason.
      - name: Preflight — build volume mounted
        run: |
          if [ ! -d /Volumes/build-disk ]; then
            echo "ERROR: /Volumes/build-disk is not mounted on this runner." >&2
            echo "  The runner's _work dir and ~/fts, ~/.cargo and" >&2
            echo "  ~/task-macos-deploy all live there (see" >&2
            echo "  docs/airlock-build-volume.md). Remount it, then re-run." >&2
            exit 1
          fi
          df -h /Volumes/build-disk | tail -1
      # clean:false keeps target/ between runs so nix+cargo build incrementally.
      - uses: actions/checkout@v4
        with:
          clean: false

      # One version for every shipped thing — see the same step in
      # task-ios.yml.
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.marketing_version }}
        run: |
          v="${INPUT_VERSION:-$(bash scripts/release.sh version)}"
          echo "MARKETING_VER=$v" >> "$GITHUB_ENV"
          echo "marketing version: $v"

      - name: Build, sign, and upload Task (macOS) to TestFlight
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          # MARKETING_VER comes from the Version step.
          # Sentry DSN baked in at compile time (option_env! in
          # architect-telemetry). Sourced from the repo secret — never committed
          # (public repo). Empty when the secret is unset → telemetry no-op.
          TASK_SENTRY_DSN: ${{ secrets.TASK_SENTRY_DSN }}
          # OTLP export, baked the same way (option_env! in architect-telemetry).
          # The endpoint is task-server's authenticated /otlp proxy, not the
          # collector — the collector is a ClusterIP on purpose. The token is
          # a static ingest bearer: an OTLP exporter is constructed at process
          # start, before anyone signs in, so a session token can't be the
          # credential. Both empty → the client stays telemetry-free.
          TASK_OTLP_ENDPOINT: ${{ vars.TASK_OTLP_ENDPOINT }}
          TASK_OTLP_TOKEN: ${{ secrets.TASK_OTLP_TOKEN }}
          # The server a fresh install dials (option_env! in ui-core's
          # vox_session); same default as the iPhone app.
          TASK_VOX_URL_NATIVE: ${{ vars.TASK_VOX_URL_NATIVE || 'wss://task.fasttrackstudio.app/vox' }}
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          # Build kind "macos" (scripts/target-sweep.py): records the units
          # this build used so the sweep below keeps the latest macOS AND
          # the latest iOS build warm in this shared target/, and nothing
          # else. Without python3 it just builds.
          if command -v python3 >/dev/null; then
            python3 scripts/target-sweep.py run macos -- bash apps/desktop/macos/deploy-testflight-macos.sh
          else
            bash apps/desktop/macos/deploy-testflight-macos.sh
          fi

      # target/ persists (clean: false) and is shared with task-ios. Keep
      # the latest build of each kind (macos, ios, desktop-release); the
      # 2 h protection covers a build of another kind still in flight.
      - name: Bound the target dir
        if: always()
        run: |
          command -v python3 >/dev/null || exit 0
          python3 scripts/target-sweep.py sweep --protect-hours 2 || true
          python3 scripts/target-sweep.py status || true
          du -sh target || true

      - name: Summary
        if: always()
        run: |
          echo "### Task macOS TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "commit \`$(git rev-parse --short HEAD)\` → Task desktop app uploaded (see log for build number)." >> "$GITHUB_STEP_SUMMARY"

  # The Developer-ID app (DMG + the zip/manifest the in-app updater
  # installs) as GitHub release `desktop-v<version>` — the same thing
  # `just release-desktop <version>` does by hand on airlock.
  #
  # ON for every release (the Captain's call): each release tag publishes
  # `desktop-v<release version>`, the version read from [workspace.package]
  # in Cargo.toml by scripts/release.sh — the same number TestFlight, iOS
  # and the server release carry, so the desktop can never drift onto its
  # own track again (it sat at 0.0.5 while the release was 0.2.x).
  #
  # It runs even when the TestFlight job fails (`!cancelled()`): the App
  # Store and the direct download are separate channels, and one Apple
  # rejection must not take the other one down with it. `needs` stays, so
  # the two builds still run one after the other on the one Mac.
  #
  # workflow_dispatch with desktop_release=build runs the whole thing —
  # build, Developer-ID sign, notarize, staple, Gatekeeper check, manifest —
  # and stops before `gh release create` (PUBLISH=0), so a fix branch can
  # prove the job without publishing. Only a `v*` tag push publishes.
  # Skips itself when desktop-v<version> exists, so a re-run never
  # collides with a hand-made release.
  desktop-release:
    name: Developer-ID desktop release (desktop-v*)
    needs: testflight
    if: ${{ !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.desktop_release == 'build') }}
    runs-on: [self-hosted, macos, airlock]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Preflight — build volume mounted
        run: |
          [ -d /Volumes/build-disk ] || { echo "ERROR: /Volumes/build-disk is not mounted" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Publish desktop-v<version>
        env:
          GH_TOKEN: ${{ github.token }}
          # 1 only on a v* tag push; a dispatch builds and notarizes but
          # never publishes.
          PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && '1' || '0' }}
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          TASK_SENTRY_DSN: ${{ secrets.TASK_SENTRY_DSN }}
          TASK_OTLP_ENDPOINT: ${{ vars.TASK_OTLP_ENDPOINT }}
          TASK_OTLP_TOKEN: ${{ secrets.TASK_OTLP_TOKEN }}
          TASK_VOX_URL_NATIVE: ${{ vars.TASK_VOX_URL_NATIVE || 'wss://task.fasttrackstudio.app/vox' }}
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:/opt/homebrew/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          v="$(bash scripts/release.sh version)"
          echo "desktop version: $v (PUBLISH=$PUBLISH)"
          if [ "$PUBLISH" = 1 ] && gh release view "desktop-v$v" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "desktop-v$v already published — nothing to do"
            exit 0
          fi
          if command -v python3 >/dev/null; then
            python3 scripts/target-sweep.py run desktop-release -- bash apps/desktop/macos/release.sh "$v"
          else
            bash apps/desktop/macos/release.sh "$v"
          fi
