# Task macOS TestFlight — build the Task desktop app (task-app-desktop, a
# Dioxus/dx macOS app) and upload it to TestFlight for Mac when a release tag
# `vX.Y.Z` is pushed (a push to main builds nothing). The macOS mirror of
# task-ios.yml; testers' Macs then auto-update via the TestFlight app.
#
# Runs on the SAME self-hosted airlock Mac as the iOS workflows and shares
# their `ios-testflight` concurrency group, so the single Mac never runs two
# Apple builds at once (they queue behind each other and don't fight over
# target/ or the keychain).
#
# The build script is apps/desktop/macos/deploy-testflight-macos.sh
# (keychain unlock → ASC-API provisioning profile → dx build → App-Sandbox
# codesign → installer .pkg → altool upload). One-time machine setup is
# apps/desktop/macos/setup-macos.sh (signing identities in the build
# keychain); see docs/macos-testflight.md for the runbook.
#
# ONCE PER RELEASE: the trigger is the release tag, and the build is marked
# with the release's version (the Version step). The `desktop-release` job
# below also attaches the Developer-ID app (DMG, and the zip + manifest the
# in-app updater follows) to the release `v<ver>` itself, beside the node
# binaries, the web bundle and the Linux AppImage. No `paths:` filter (tag
# pushes ignore them). workflow_dispatch forces a build (select the tag as
# the ref), or backfills the macOS app onto an existing release
# (`-f desktop_release=publish -f tag=v26.10.0 -f testflight=false`, run
# from main).

name: macOS

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "CFBundleShortVersionString. Empty = the workspace version in Cargo.toml (the release's)."
        required: false
        default: ""
      testflight:
        description: "Build and upload to TestFlight."
        type: boolean
        default: true
      desktop_release:
        description: "Developer-ID desktop job: skip; build (build + notarize, never upload); or publish (attach to the release `tag`, which must exist or appear)."
        type: choice
        options: [skip, build, publish]
        default: skip
      tag:
        description: "With publish: the release tag (v<X.Y.Z>) to build and attach to. The app is built from that tag."
        required: false
        default: ""

# Serialize with the iOS builds — one Apple build at a time on the single
# Mac. Shared group name across the workflows; queue, never cancel.
concurrency:
  # Per-WORKFLOW, not shared across the three Apple workflows.
  #
  # They used to share one `ios-testflight` group, intending to stop the
  # single Mac running two Apple builds at once. The effect was the
  # opposite of the intent: a concurrency group holds only ONE pending
  # run, so task-ios and task-macos evicted each other — every merge
  # fires both, the later arrival takes the pending slot, and the other
  # is CANCELLED. task-ios lost that race every time, which is why
  # TestFlight went stale while every run showed "cancelled".
  #
  # The serialization they wanted is already guaranteed: Task's Apple
  # builds run on airlock's `task-release-mac`, a SINGLE self-hosted runner
  # that runs one job at a time, so two of them cannot overlap regardless.
  # (Studio's run on its own `studio-release-mac` runner on the same Mac.)
  # The shared group added nothing except mutual cancellation.
  #
  # Keeping the group per-workflow preserves the useful half — a newer
  # run of the SAME workflow supersedes an older queued one.
  group: ios-testflight-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  testflight:
    if: ${{ github.event_name == 'push' || inputs.testflight }}
    runs-on: [self-hosted, macos, task-release-mac]
    # The tag guard reads the tagged commit's `CI passed`.
    permissions:
      contents: read
      checks: read
    # Fail loudly when the airlock Mac isn't there. Without this a job
    # with no available runner just QUEUES, and is eventually cancelled —
    # which reads as "cancelled", not "failed", so nothing alerts and
    # nobody looks. That is exactly how TestFlight silently missed every
    # merge from 2026-08-09 onward while the runner was offline: four
    # cancelled runs in a row, discovered only by picking up the phone.
    # A timeout turns a missing runner into a red X within the hour.
    timeout-minutes: 90
    steps:
      # The runner's work dir lives on an external SSD (/Volumes/build-disk).
      # If that volume is not mounted — after a reboot or a power cut — the
      # runner's checkout path simply does not exist, and every later step
      # fails with a confusing "no such file" instead of "the disk is gone".
      # Fail here, with the reason.
      - name: Preflight — build volume mounted
        run: |
          if [ ! -d /Volumes/build-disk ]; then
            echo "ERROR: /Volumes/build-disk is not mounted on this runner." >&2
            echo "  The runner's _work dir and ~/fts, ~/.cargo and" >&2
            echo "  ~/task-macos-deploy all live there (see" >&2
            echo "  docs/airlock-build-volume.md). Remount it, then re-run." >&2
            exit 1
          fi
          df -h /Volumes/build-disk | tail -1
      # clean:false keeps target/ between runs so nix+cargo build incrementally.
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      # Releases commit no version: on a release tag, write the tag's into
      # this checkout (the next checkout's --force discards it again).
      - name: Stamp the release version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: bash scripts/release.sh stamp "$GITHUB_REF_NAME"

      # A pushed tag must be vX.Y.Z on a commit of main or a release/v*
      # hotfix line, with `CI passed` green on it. Without this a stray v*
      # tag on a branch would build TestFlight. A manual dispatch is exempt.
      - name: Tag guard
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh tag-guard

      # One version for every shipped thing — see the same step in
      # task-ios.yml.
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.marketing_version }}
        run: |
          v="${INPUT_VERSION:-$(bash scripts/release.sh version)}"
          echo "MARKETING_VER=$v" >> "$GITHUB_ENV"
          echo "marketing version: $v"

      - name: Build, sign, and upload Task (macOS) to TestFlight
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          # MARKETING_VER comes from the Version step.
          # Sentry DSN baked in at compile time (option_env! in
          # architect-telemetry). Sourced from the repo secret — never committed
          # (public repo). Empty when the secret is unset → telemetry no-op.
          TASK_SENTRY_DSN: ${{ secrets.TASK_SENTRY_DSN }}
          # OTLP export, baked the same way (option_env! in architect-telemetry).
          # The endpoint is task-server's authenticated /otlp proxy, not the
          # collector — the collector is a ClusterIP on purpose. The token is
          # a static ingest bearer: an OTLP exporter is constructed at process
          # start, before anyone signs in, so a session token can't be the
          # credential. Both empty → the client stays telemetry-free.
          TASK_OTLP_ENDPOINT: ${{ vars.TASK_OTLP_ENDPOINT }}
          TASK_OTLP_TOKEN: ${{ secrets.TASK_OTLP_TOKEN }}
          # The server a fresh install dials (option_env! in ui-core's
          # vox_session); same default as the iPhone app.
          TASK_VOX_URL_NATIVE: ${{ vars.TASK_VOX_URL_NATIVE || 'wss://task.fasttrackstudio.app/vox' }}
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          # Build kind "macos" (scripts/target-sweep.py): records the units
          # this build used so the sweep below keeps the latest macOS AND
          # the latest iOS build warm in this shared target/, and nothing
          # else. Without python3 it just builds.
          if command -v python3 >/dev/null; then
            python3 scripts/target-sweep.py run macos -- bash apps/desktop/macos/deploy-testflight-macos.sh
          else
            bash apps/desktop/macos/deploy-testflight-macos.sh
          fi

      # target/ persists (clean: false) and is shared with task-ios. Keep
      # the latest build of each kind (macos, ios, desktop-release); the
      # 2 h protection covers a build of another kind still in flight.
      - name: Bound the target dir
        if: always()
        run: |
          command -v python3 >/dev/null || exit 0
          python3 scripts/target-sweep.py sweep --protect-hours 2 || true
          python3 scripts/target-sweep.py status || true
          du -sh target || true

      - name: Summary
        if: always()
        run: |
          echo "### Task macOS TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "commit \`$(git rev-parse --short HEAD)\` → Task desktop app uploaded (see log for build number)." >> "$GITHUB_STEP_SUMMARY"

  # The Developer-ID app (DMG + the zip/manifest the in-app updater
  # installs), attached to the release `v<version>` — the same thing
  # `just release-desktop <version>` does by hand on airlock.
  #
  # ON for every release (the Captain's call): the version is the tag's,
  # stamped into [workspace.package] in Cargo.toml (scripts/release.sh
  # stamp) — the same number TestFlight, iOS and the server release carry,
  # so the desktop can
  # never drift onto its own track again (it sat at 0.0.5 while the release
  # was 0.2.x). Until 26.10 it went out as its own `desktop-v<version>`
  # release; the updater still reads those, so older installs keep finding
  # their way forward.
  #
  # It runs even when the TestFlight job fails or is skipped
  # (`!cancelled()`): the App Store and the direct download are separate
  # channels, and one Apple rejection must not take the other one down with
  # it. `needs` stays, so the two builds still run one after the other on
  # the one Mac.
  #
  # The build is always PUBLISH=0 (build, Developer-ID sign, notarize,
  # staple, Gatekeeper check, zip, manifest) and the upload is this job's
  # own step, so it attaches to any tag — including one whose copy of
  # release.sh predates the single release. The release is created by the
  # deploy right after its tag guard, so the upload waits for it.
  #   - tag push: build the tag, attach to it.
  #   - dispatch, desktop_release=build: build the ref, never upload (prove
  #     a fix branch).
  #   - dispatch, desktop_release=publish + tag: build that tag, attach to
  #     it (a backfill; run from main so this job is the current one).
  # Skips itself when the release already carries latest-macos.json.
  desktop-release:
    name: Developer-ID desktop app → release
    needs: testflight
    if: ${{ !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.desktop_release == 'build' || inputs.desktop_release == 'publish') }}
    runs-on: [self-hosted, macos, task-release-mac]
    timeout-minutes: 240
    permissions:
      contents: write
      checks: read
    steps:
      - name: Preflight — build volume mounted
        run: |
          [ -d /Volumes/build-disk ] || { echo "ERROR: /Volumes/build-disk is not mounted" >&2; exit 1; }

      # What to build and where it goes. A push builds its own tag; a
      # publish dispatch builds the tag it names, which must be a release
      # of main (the build stamps the tag's version).
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'push' && 'publish' || inputs.desktop_release }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          if [ "${{ github.event_name }}" = push ]; then
            tag="${GITHUB_REF#refs/tags/}"
            ref="${GITHUB_SHA}"
          elif [ "$MODE" = publish ]; then
            [ -n "$INPUT_TAG" ] || { echo "::error::desktop_release=publish needs the tag input"; exit 1; }
            tag="$INPUT_TAG"
            ref="$tag"
          else
            tag=""
            ref="${GITHUB_SHA}"
          fi
          skip=false
          if [ -n "$tag" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qx latest-macos.json; then
            echo "::notice::$tag already carries the macOS app — nothing to do"
            skip=true
          fi
          {
            echo "mode=$MODE"
            echo "tag=$tag"
            echo "ref=$ref"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$MODE tag=${tag:-none} ref=$ref skip=$skip"

      - uses: actions/checkout@v4
        if: ${{ steps.plan.outputs.skip != 'true' }}
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ steps.plan.outputs.ref }}

      # Releases commit no version: write the tag's into this checkout, so
      # the app reports the release (the next checkout's --force discards
      # it again).
      - name: Stamp the release version
        if: ${{ steps.plan.outputs.skip != 'true' && steps.plan.outputs.tag != '' }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: bash scripts/release.sh stamp "$TAG"

      # A pushed tag must be vX.Y.Z on a commit of main or a release/v*
      # hotfix line, with `CI passed` green on it. A backfill must name a
      # tag of main.
      - name: Tag guard
        if: ${{ steps.plan.outputs.skip != 'true' && steps.plan.outputs.tag != '' }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            bash scripts/release.sh tag-guard
            exit 0
          fi
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not in main's history"; exit 1; }

      - name: Build + notarize
        if: ${{ steps.plan.outputs.skip != 'true' }}
        env:
          PUBLISH: "0"
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          TASK_SENTRY_DSN: ${{ secrets.TASK_SENTRY_DSN }}
          TASK_OTLP_ENDPOINT: ${{ vars.TASK_OTLP_ENDPOINT }}
          TASK_OTLP_TOKEN: ${{ secrets.TASK_OTLP_TOKEN }}
          TASK_VOX_URL_NATIVE: ${{ vars.TASK_VOX_URL_NATIVE || 'wss://task.fasttrackstudio.app/vox' }}
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:/opt/homebrew/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          export OUT_DIR="$PWD/target/dmg"
          v="$(bash scripts/release.sh version)"
          echo "desktop version: $v"
          if command -v python3 >/dev/null && [ -f scripts/target-sweep.py ]; then
            python3 scripts/target-sweep.py run desktop-release -- bash apps/desktop/macos/release.sh "$v"
          else
            bash apps/desktop/macos/release.sh "$v"
          fi

      - name: Attach to the release
        if: ${{ steps.plan.outputs.skip != 'true' && steps.plan.outputs.mode == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          out="$PWD/target/dmg"
          # The manifest names the zip on THIS release, whatever tag the
          # checked-out build-dmg.sh wrote (older tags wrote desktop-v…).
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/Task-macos.zip"
          sed -i '' "s|\"zip\": *\"[^\"]*\"|\"zip\": \"$url\"|" "$out/latest-macos.json"
          grep -q "\"zip\": \"$url\"" "$out/latest-macos.json" \
            || { echo "::error::could not point latest-macos.json at $url"; cat "$out/latest-macos.json"; exit 1; }
          cat "$out/latest-macos.json"
          # The deploy creates the release once the tag verifies live.
          for _ in $(seq 1 150); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 60
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null \
            || { echo "::error::release $TAG did not appear in 150 min — did the deploy verify live?"; exit 1; }
          # The app first: the manifest is what makes installed apps move,
          # so it must never name a zip that is not there yet.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$out/Task-macos.dmg" "$out/Task-macos.zip"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$out/latest-macos.json"
          echo "### macOS app attached to $TAG" >> "$GITHUB_STEP_SUMMARY"
