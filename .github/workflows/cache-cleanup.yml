# Give a closed PR's cache entries back to the budget.
#
# A repo has 10 GB of Actions cache, evicted global-LRU. `checks.yml`
# only lets pushes to main SAVE entries, which keeps steady-state usage
# to main's three; this workflow is the belt to that's braces, clearing
# anything a PR ref still holds (an entry written before that rule, or by
# a workflow that does save on PRs) the moment the PR closes.
#
# Nothing here can touch main's entries: the scope filter is the PR's own
# `refs/pull/<n>/merge`.

name: cache-cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Drop the closed PR's cache entries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete caches scoped to this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          keys="$(gh api --paginate \
            "repos/${REPO}/actions/caches?ref=${REF}&per_page=100" \
            -q '.actions_caches[].id' || true)"
          if [ -z "$keys" ]; then
            echo "no cache entries for ${REF}"
            exit 0
          fi
          for id in $keys; do
            echo "deleting cache id ${id}"
            gh api --method DELETE "repos/${REPO}/actions/caches/${id}" || true
          done
