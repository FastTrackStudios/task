# Release — the GitHub Release of a tag. Releases are tags (tag-from-main,
# the same flow as studio's; Task's specifics in
# skills/release-workflow.md); the logic is scripts/release.sh, so a human
# can run every step by hand (`just release*`).
#
#   workflow_call          from deploy.yml after its tag guard: the GitHub
#                          Release for the tag that started the deploy, with
#                          the notes from the change files added since the
#                          previous tag. It waits for nothing else: the
#                          images, TestFlight and the assets start from the
#                          same tag and attach as they finish.
#   workflow_dispatch      the same, by hand, with the tag as the ref.
#
# `just release` pushes the tag (as the fts-forge App or a person: a tag
# pushed with GITHUB_TOKEN starts no workflow). There are no release PRs.

name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: GitHub Release
    # In a called workflow `github` is the CALLER's context: the tag push
    # that started deploy.yml, or this file's own dispatch on a tag.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh publish
