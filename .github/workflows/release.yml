# Release — the guard on release PRs, and the tag + GitHub Release once
# production serves the result. The procedure and its reasons are in
# skills/release-workflow.md; the logic is scripts/release.sh, so a human
# can run every step of it by hand (`just release-*`).
#
# A release is a BRANCH, `release/vX.Y.Z`, cut from dev's head by
# `just release-prepare`; dev never freezes for it.
#
#   pull_request -> main   "Release guard": cheap, on a hosted runner. It
#                          fails a release PR that would deploy something
#                          other than what `checks` tested:
#                            - the head is `release/v<its version>` (or
#                              hotfix/*), not dev or a card branch,
#                            - a release branch was cut from a commit of
#                              dev (dev may have moved on since: fine),
#                            - Cargo.toml's version is new and greater,
#                            - CHANGELOG.md has that version's section,
#                            - the head commit IS `chore(release): v<ver>`
#                              (a fix on the branch is followed by
#                              `just release-refresh`),
#                            - main is in the head, so merging produces
#                              exactly the head's tree.
#   workflow_call          from deploy.yml after "Verify live": tag
#                          `v<version>` and publish the GitHub Release.
#   workflow_dispatch      the same, by hand, on main (a re-run, or a
#                          release whose deploy was skipped).
#
# Merge release PRs with "Create a merge commit". Squash or rebase would
# give main a commit the release branch does not have, and the tag would
# not be in main's history. After the release: `just release-backmerge`
# (main -> dev, merge commit). A workflow cannot do that step: PRs opened
# with GITHUB_TOKEN start no workflows, so dev's required title check
# would never report. The publish job says so in its summary.

name: release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Is this a sound release?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/release.sh guard

  publish:
    name: Tag + GitHub Release
    # In a called workflow `github` is the CALLER's context: a push to
    # main from deploy.yml, or this file's own dispatch.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh publish
      - name: Back-merge reminder
        run: |
          git fetch --quiet origin dev
          if git merge-base --is-ancestor HEAD origin/dev; then
            echo "main is already in dev"
          else
            msg="Released. Back-merge main into dev now: just release-backmerge (PR backmerge/v$(bash scripts/release.sh version) -> dev, merge commit). The next release-prepare refuses until it is merged."
            echo "::notice::$msg"
            echo "### Back-merge pending" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
