name: Shared runner tools
description: Put the pinned devenv (2.4.0) on PATH on shared NixOS slots.
runs:
  using: composite
  steps:
    # devenv 2.4.0 (cachix/devenv tag v2.4.0, b904dcb) from the nixpkgs
    # revision devenv-fleet's pins.json names (`devenv.nixpkgs`). The shared
    # slots have nix, so a store path they already have is an evaluation, not
    # a build. The host's devenv wins when it is on PATH; the version check
    # fails the job on any other devenv. gh and python3 are not set up here:
    # the steps that need them run in the dev shell (devenv.nix carries both).
    - name: devenv
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v devenv >/dev/null; then
          out=$(nix build --no-link --print-out-paths \
            github:NixOS/nixpkgs/e62746b0b472753ef019baceab6f1e2e52014980#devenv)
          echo "$out/bin" >> "$GITHUB_PATH"
          export PATH="$out/bin:$PATH"
        fi
        v="$(devenv version | awk '{print $2}')"
        [ "$v" = 2.4.0 ] || { echo "::error::devenv $v on this runner; this repo pins 2.4.0"; exit 1; }
        echo "devenv $v: $(command -v devenv)"
