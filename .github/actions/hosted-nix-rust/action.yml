# Set up a GitHub-HOSTED runner (ubuntu-latest) for one build kind of
# checks.yml: nix, the pinned devenv, the repo's devenv shell evaluated
# once, and a Swatinem/rust-cache of that kind's dependencies.
#
# The job's later steps run inside the dev shell through checks.yml's
# `defaults.run.shell: devenv shell -- bash -e {0}`, so they call `just
# ci-*` directly. Every build kind of checks.yml (lint, tests, wasm) uses
# it; .github/actions/battleship-nix-rust is the self-hosted twin.
#
# CACHE BUDGET: the repo gets 10 GB of Actions cache, evicted LRU across
# every branch. So rust-cache SAVES only on main (`save-if`), and PRs
# restore main's entry without writing their own; each kind has its own
# `shared-key` so lint (check-mode metadata) and wasm (wasm32) never
# overwrite each other. The source-built tools below are ~150 MB and are
# saved from any ref (only when missing).
name: Hosted nix + rust cache
description: Free disk, install nix with the FTS cachix, put the pinned devenv on PATH, evaluate the devenv shell, restore the rust cache for one build kind.
inputs:
  kind:
    description: Build kind; the rust-cache shared-key (lint, tests, wasm).
    required: true
runs:
  using: composite
  steps:
    # The image's unused toolchains (Android SDK, .NET, GHC, CodeQL, ~30 GB)
    # are deleted in the background: the space is free before the build
    # needs it, and nothing waits on it.
    - name: Free disk (background)
      shell: bash
      run: |
        nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
        df -h / | tail -1

    # The flake's nixConfig names the same cachix; setting it here makes it
    # trusted without --accept-flake-config prompts.
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://fasttrackstudio.cachix.org
          extra-trusted-public-keys = fasttrackstudio.cachix.org-1:r7v7WXBeSZ7m5meL6w0wttnvsOltRvTpXeVNItcy9f4=

    # cargo-rail, dx and wasm-bindgen-cli (devenv-fleet's pkgs/) build from
    # source and are in neither cache.nixos.org nor the FTS cachix, so
    # entering the shell would compile them on every run. Their store paths
    # are kept in the Actions cache as a file:// binary cache, keyed on the
    # lock that pins them.
    - name: Restore source-built tools
      id: tools-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix-file-cache
        key: devenv-tools-${{ runner.os }}-${{ hashFiles('devenv.lock') }}
    - name: Import source-built tools
      if: ${{ steps.tools-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: |
        cache="$HOME/.cache/nix-file-cache"
        xargs -r nix copy --no-check-sigs --from "file://$cache" < "$cache/paths" \
          || echo "::warning::tool import failed; the shell builds them"

    # devenv 2.4.0 from the nixpkgs revision devenv-fleet's pins.json names
    # (`devenv.nixpkgs`).
    - name: devenv
      shell: bash
      run: |
        set -euo pipefail
        out=$(nix build --no-link --print-out-paths \
          github:NixOS/nixpkgs/e62746b0b472753ef019baceab6f1e2e52014980#devenv)
        echo "$out/bin" >> "$GITHUB_PATH"
        "$out/bin/devenv" version
    # Evaluates the shell once and asserts its rustc is devenv-fleet's
    # pinned store path. The toolchain's bin also goes on the job's PATH,
    # so rust-cache (a JS action, outside the shell) keys on that rustc and
    # not on the image's rustup, which would download the
    # rust-toolchain.toml pin.
    - name: dev shell
      shell: devenv shell -- bash -e {0}
      run: |
        fleet-doctor
        dirname "$(readlink -f "$(command -v rustc)")" >> "$GITHUB_PATH"

    - name: Export source-built tools
      id: tools-export
      if: ${{ steps.tools-cache.outputs.cache-hit != 'true' }}
      shell: devenv shell -- bash -e {0}
      run: |
        cache="$HOME/.cache/nix-file-cache"
        mkdir -p "$cache"
        for bin in cargo-rail dx wasm-bindgen; do
          readlink -f "$(command -v "$bin")" | cut -d/ -f1-4
        done > "$cache/paths"
        xargs nix copy --to "file://$cache" < "$cache/paths"
    - name: Save source-built tools
      if: ${{ steps.tools-export.outcome == 'success' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/nix-file-cache
        key: devenv-tools-${{ runner.os }}-${{ hashFiles('devenv.lock') }}

    # After the shell, so its key reads the pinned nix rustc (above).
    # Dependencies only: rust-cache drops the workspace's own crates.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: checks-${{ inputs.kind }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
