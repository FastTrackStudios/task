# Set up a GitHub-HOSTED runner (ubuntu-latest) for one build kind of
# checks.yml: the repo's `.#ci` dev shell exported into the job's
# environment, a Swatinem/rust-cache of that kind's dependencies and,
# for the codegen kinds (tests), sccache on the GitHub Actions cache.
#
# After this action every later step of the job runs inside the dev shell
# (nicknovitski/nix-develop writes its PATH and env to $GITHUB_PATH /
# $GITHUB_ENV), so steps call `just ci-*` directly, with no `nix develop`
# prefix.
#
# CACHE BUDGET: the repo gets 10 GB of Actions cache, evicted LRU across
# every branch. So every writer here SAVES ONLY ON MAIN: rust-cache
# (`save-if`), sccache (READ_ONLY off main) and the cargo-rail store path
# (~370 MB). PRs restore main's entries (a PR may read its base branch's
# cache) and write none, so the budget holds one rust-cache entry per
# kind plus main's sccache objects, never one copy per open PR. Each kind
# has its own `shared-key` so lint (check-mode metadata), wasm (wasm32)
# and tests (full codegen) never overwrite each other.
#
# Two caches, two jobs: rust-cache restores the DEPENDENCIES' target dir
# (it drops the workspace's own crates before saving), so cargo never even
# calls rustc for them; sccache then serves the workspace crates a change
# did not touch. The checkout path is the same on every hosted runner
# (/home/runner/work/task/task), which is what lets sccache hit at all:
# its keys include absolute paths.
name: Hosted nix + rust cache
description: Free disk, install nix with the FTS cachix, enter .#ci, restore the rust cache for one build kind, optionally sccache.
inputs:
  kind:
    description: Build kind (lint, wasm, tests); the rust-cache shared-key is checks-<kind> unless shared-key is given.
    required: true
  shared-key:
    description: Override the rust-cache shared-key.
    required: false
    default: ""
  sccache:
    description: "true: install sccache and wrap rustc with it (GHA backend; read-write on main, read-only elsewhere)."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # The image's unused toolchains (Android SDK, .NET, GHC, CodeQL, ~30 GB)
    # are deleted in the background: the space is free before the build
    # needs it, and nothing waits on it.
    - name: Free disk (background)
      shell: bash
      run: |
        nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
        df -h / | tail -1

    # The flake's nixConfig names the same cachix; setting it here makes it
    # trusted without --accept-flake-config prompts.
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://fasttrackstudio.cachix.org
          extra-trusted-public-keys = fasttrackstudio.cachix.org-1:r7v7WXBeSZ7m5meL6w0wttnvsOltRvTpXeVNItcy9f4=

    # cargo-rail (nix/modules/cargo-rail.nix) is built from source and is in
    # neither cache.nixos.org nor the FTS cachix, so entering the shell
    # would compile it on every run. Its store path is kept in the Actions
    # cache as a file:// binary cache, keyed on the path itself. Saved from
    # main only: when it was saved from any ref that missed, every open PR
    # wrote its own ~370 MB copy (four at once, 1.5 GB of the 10 GB).
    - name: cargo-rail store path
      id: rail
      shell: bash
      run: |
        set -euo pipefail
        out="$(nix eval --raw .#devShells.x86_64-linux.ci --apply \
          'sh: toString (builtins.filter (p: (p.pname or "") == "cargo-rail") (sh.nativeBuildInputs ++ sh.buildInputs))')"
        echo "out=$out" >> "$GITHUB_OUTPUT"
        echo "hash=$(basename "$out" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
        echo "cargo-rail: ${out:-<not in the shell>}"
    - name: Restore cargo-rail
      id: rail-cache
      if: ${{ steps.rail.outputs.out != '' }}
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix-file-cache
        key: nix-cargo-rail-${{ steps.rail.outputs.hash }}
    - name: Import cargo-rail
      if: ${{ steps.rail-cache.outputs.cache-hit == 'true' }}
      shell: bash
      env:
        OUT: ${{ steps.rail.outputs.out }}
      run: nix copy --no-check-sigs --from "file://$HOME/.cache/nix-file-cache" "$OUT" || echo "::warning::cargo-rail import failed; the shell builds it"

    - name: Enter .#ci
      uses: nicknovitski/nix-develop@v1
      with:
        arguments: --accept-flake-config .#ci

    - name: Export cargo-rail
      id: rail-export
      if: ${{ steps.rail.outputs.out != '' && steps.rail-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
      shell: bash
      env:
        OUT: ${{ steps.rail.outputs.out }}
      run: nix copy --to "file://$HOME/.cache/nix-file-cache" "$OUT"
    - name: Save cargo-rail
      if: ${{ steps.rail-export.outcome == 'success' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/nix-file-cache
        key: nix-cargo-rail-${{ steps.rail.outputs.hash }}

    # After the shell, so its key reads the pinned nix rustc, not the
    # image's rustup (which would download the rust-toolchain.toml pin).
    # Dependencies only: rust-cache drops the workspace's own crates.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.shared-key != '' && inputs.shared-key || format('checks-{0}', inputs.kind) }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true

    # sccache on the GitHub Actions cache. Read-write on main only (the same
    # budget rule as above). CARGO_INCREMENTAL is already 0 in the
    # workflows: sccache cannot cache incremental builds. It cannot cache
    # proc-macro dylibs or links either; those are rust-cache's (deps) or
    # always rebuilt (the workspace's own few).
    - name: sccache
      if: ${{ inputs.sccache == 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Wrap rustc with sccache
      if: ${{ inputs.sccache == 'true' }}
      shell: bash
      env:
        RW: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "SCCACHE_GHA_RW_MODE=${RW}"
          echo "RUSTC_WRAPPER=sccache"
          # Never idle out: a test phase is longer than the default 10 min,
          # and a restarted server reports zeroed stats at the end.
          echo "SCCACHE_IDLE_TIMEOUT=0"
        } >> "$GITHUB_ENV"
        echo "sccache: ${RW}"
