    "features/milestone/milestone-proto",
    "features/mount/mount",
    "features/mount/mount-proto",
    "features/notify/notify",
    "features/notify/notify-proto",
    "features/org/org-proto",
    "features/org/org-snapshot",
    "features/prefs/prefs",
    "features/prefs/prefs-proto",
    "features/project/project",
    "features/project/project-proto",
    "features/recall/recall",
    "features/recall/recall-proto",
    "features/resources/resources",
    "features/resources/resources-proto",
    "features/scheduling/scheduling",
    "features/scheduling/scheduling-proto",
    "features/scheduling/scheduling-ui",
