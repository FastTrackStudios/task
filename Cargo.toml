# task — ONE root workspace.
#
# Extracted from the FastTrackStudio monorepo into its own repo. Every
# crate in the tree (apps/, crates/, features/) is a member here;
# one lockfile, one target/, one [workspace.dependencies] table carrying
# every intra-repo path dep exactly once.
#
# Three sibling repos supply what used to be path deps in the monorepo:
#   architect  — the entity/RPC framework + architect-ui + telemetry
#   vendor     — patched third-party (phon, phon-jit, styx-format)
#   FastTrackStudio — the music-production domains (daw / session /
#                     keyflow / engraver / input) Task consumes read-only

[workspace]
resolver = "2"
members = [
    # ── apps ──────────────────────────────────────────────────────────
    "apps/cli",
    "apps/desktop",
    "apps/mobile",
    "apps/server",
    "apps/web",
    # ── crates/ — small shared crates ─────────────────────────────────
    "crates/note-tabs",
    "crates/player-ui",
    "crates/plugin",
    "crates/ui",
    "crates/ui-core",
    "crates/widgets",
    # ── tests/ — the cross-feature integration suite ──────────────────
    "tests/integration",
    # ── xtask — build tooling; never in default-members ────────────────
    "xtask",
    # ── features/ — the feature slices ────────────────────────────────
    "features/agent/agent-codex",
    "features/agent/agent-dispatch",
    "features/agent/agent-hermes",
    "features/agent/agent-inbox",
    "features/agent/agent-proto",
    "features/agent/agent-runners",
    "features/agent/agent-tasks",
    "features/agent/agent-wiki",
    "features/agent/agent-worktree",
    "features/attachments/attachments-proto",
    "features/collection/collection",
    "features/collection/collection-proto",
    "features/contacts/contacts",
    "features/contacts/contacts-proto",
    "features/cycle/cycle",
    "features/email/email-autoconfig",
    "features/email/email-config",
    "features/email/email-imap",
    "features/email/email-integration-tests",
    "features/email/email-jmap",
    "features/email/email-link",
    "features/email/email-maildir",
    "features/email/email-mux",
    "features/email/email-product",
    "features/email/email-proto",
    "features/email/email-secret",
    "features/email/email-smtp",
    "features/email/email-store",
    "features/email/email-sync",
    "features/email/email-ui",
    # Email feature harness — standalone Dioxus binary exercising the
    # email-* crates without the full task-ui shell.
    "features/email/examples/email-client",
    "features/files/files",
    "features/files/files-daemon",
    "features/files/files-daemon-proto",
    "features/files/files-domain",
    "features/files/files-fileprovider",
    "features/files/files-fuse",
    "features/files/files-proto",
    "features/files/files-storage",
    "features/files/files-store",
    "features/files/files-storage-proto",
    "features/files/files-sync",
    "features/files/files-transcode",
    "features/files/files-ui",
    "features/files/files-webdav",
    "features/finance/finance",
    "features/finance/finance-db",
    "features/finance/finance-proto",
    "features/fitness/body",
    "features/fitness/exercises",
    "features/fitness/fitness",
    "features/fitness/fitness-proto",
    "features/fitness/intake",
    "features/fitness/workouts",
    "features/git/git-config",
    "features/git/git-forgejo",
    "features/git/git-github",
    "features/git/git-proto",
    "features/goal/goal",
    "features/goal/goal-proto",
    "features/goal/goal-ui",
    "features/identity/identity",
    "features/identity/identity-proto",
    "features/inbox/inbox",
    "features/inbox/inbox-proto",
    "features/inventory/inventory",
    "features/inventory/inventory-proto",
    "features/label/label-proto",
    "features/links/links",
    "features/links/links-proto",
    "features/links/links-ui",
    "features/locations/locations",
    "features/locations/locations-proto",
    "features/mealplan/cookbook",
