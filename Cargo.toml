    "features/wiki/wiki-extract",
    "features/wiki/wiki-graph",
    "features/wiki/wiki-live",
    "features/wiki/wiki-proto",
    "features/wiki/wiki-search",
    "features/workflows/workflows-orchestrator",
    "features/workflows/workflows-proto",
    "features/workstream/workstream",
    "features/workstream/workstream-proto",
    # ── features/editor — the text/markdown/keyflow editor stack ──────
    # Editor's vendored mermaid fork (see [patch.crates-io] below).
    "features/spaced-repetition/spaced-repetition",
]
exclude = [
    # Quarantined pdf renderer (fulgur/stylo trips a rustc trait-solver
    # recursion limit inside the big workspace graph); it keeps its own
    # [workspace]. `task-pdf-render` is the stdin/stdout interop point.
    "features/pdf/pdf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/FastTrackStudios/task"

[workspace.dependencies]
# ── Internal — every crate in this repo, path declared ONCE ───────────
# `-proto` crates that ship a wasm-clean surface keep
# `default-features = false` (the consumer opts into `vox`/`server`/
# `native`). Note that cargo ignores a member's `default-features = false`
# on a workspace dependency unless the workspace entry sets it too.
# crates/
task-note-tabs = { path = "crates/note-tabs" }
task-player-ui = { path = "crates/player-ui" }
task-plugin = { path = "crates/plugin" }
task-ui-core = { path = "crates/ui-core" }
