files-storage = { path = "features/files/files-storage" }
files-storage-proto = { path = "features/files/files-storage-proto", default-features = false }
files-store = { path = "features/files/files-store" }
files-sync = { path = "features/files/files-sync" }
files-transcode = { path = "features/files/files-transcode" }
files-ui = { path = "features/files/files-ui" }
files-webdav = { path = "features/files/files-webdav" }
