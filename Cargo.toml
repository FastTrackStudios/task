# features/view — view components
view = { path = "features/view/view" }
view-calendar = { path = "features/view/view-calendar" }
view-gantt = { path = "features/view/view-gantt" }
view-heatmap = { path = "features/view/view-heatmap" }
view-kanban = { path = "features/view/view-kanban" }
view-knowledge-graph = { path = "features/view/view-knowledge-graph" }
view-table = { path = "features/view/view-table" }
# ── editor — its own repo since the 2026-08 split ─────────────────────
# (FastTrackStudios/editor: the document model, the markdown pass, the
# Dioxus view, vim, tree-sitter syntax, CRDT, LSP.) It sits BELOW keyflow
# and depends on dioxus and crates.io only — that is what makes it
# embeddable, and why it is no longer hosted here.
#
# `editor-keyflow` and `editor-keyflow-lang` stayed: they need
# `keyflow-text` and `engraver`, so they belong above the editor. The
# chart renderer registers itself through `editor_state::fence_renderer`
# rather than editor-state depending on it. See docs/SPLIT.md in that repo.
editor = { git = "https://github.com/FastTrackStudios/editor", tag = "v0.1.0" }
editor-crdt = { git = "https://github.com/FastTrackStudios/editor", tag = "v0.1.0" }
editor-lsp = { git = "https://github.com/FastTrackStudios/editor", tag = "v0.1.0" }
editor-mermaid = { git = "https://github.com/FastTrackStudios/editor", tag = "v0.1.0" }
editor-state = { git = "https://github.com/FastTrackStudios/editor", tag = "v0.1.0" }
editor-syntax = { git = "https://github.com/FastTrackStudios/editor", tag = "v0.1.0" }
editor-typst = { git = "https://github.com/FastTrackStudios/editor", tag = "v0.1.0" }
editor-view = { git = "https://github.com/FastTrackStudios/editor", tag = "v0.1.0" }
editor-vim = { git = "https://github.com/FastTrackStudios/editor", tag = "v0.1.0" }
# The editor's keyflow half moved to the keyflow repo with v0.2.0: both
# crates need `editor-state` from below AND `keyflow-text`/`engraver` from
# above, so that is the only repo where they can live.
editor-keyflow = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.0" }
editor-keyflow-lang = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.0" }
# features/spaced-repetition — the FSRS scheduler the recall deck runs on
spaced-repetition = { path = "features/spaced-repetition/spaced-repetition" }

# ── architect — the entity/RPC framework, its own repo ────────────────
# Formerly libs/architect/* + libs/fts-ui + crates/task/telemetry in the
# monorepo. `fts-ui` is now `architect-ui`; `task-telemetry` is now
# `architect-telemetry`.
architect = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0", features = ["iroh"] }
architect-auth = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0" }
architect-permissions = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0" }
architect-permissions-proto = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0" }
architect-telemetry = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0" }
architect-ui = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0" }
auth = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0" }
auth-proto = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0" }
crdt = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.5.0" }

# ── FastTrackStudio monorepo — the music-production domains ───────────
# These stay in the FTS monorepo; Task consumes them cross-repo. REPIN
# from `branch = "main"` to a tag as soon as the FTS repo is tagged —
# a branch dep means every `cargo update` can move the whole domain
# surface underneath this tree.
actions-proto = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
actions-standalone = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
daw = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
daw-proto = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
daw-standalone = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
dioxus-test = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
engraver = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0", default-features = false }
input = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
keyflow = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
keyflow-text = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
session = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
session-proto = { git = "https://github.com/FastTrackStudios/FastTrackStudio", tag = "v0.1.0" }
