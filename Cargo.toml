agent-codex = { path = "features/agent/agent-codex" }
agent-dispatch = { path = "features/agent/agent-dispatch" }
agent-hermes = { path = "features/agent/agent-hermes" }
agent-inbox = { path = "features/agent/agent-inbox" }
agent-proto = { path = "features/agent/agent-proto" }
agent-runners = { path = "features/agent/agent-runners" }
agent-tasks = { path = "features/agent/agent-tasks" }
agent-wiki = { path = "features/agent/agent-wiki" }
agent-worktree = { path = "features/agent/agent-worktree" }
# features/files — the Files platform (CAS chunk store, version store,
# RPC surface, placement, sync, transcode, WebDAV bridge)
files = { path = "features/files/files" }
files-daemon = { path = "features/files/files-daemon" }
files-daemon-proto = { path = "features/files/files-daemon-proto" }
files-domain = { path = "features/files/files-domain" }
