# ── Facet reflection + vox RPC — the rc.5 fleet pins ──────────────────
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
facet-json = "0.50.0-rc.5"
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }
vox-core = "0.10.0-rc.5"
vox-types = "0.10.0-rc.5"
vox-websocket = "0.10.0-rc.5"
# `cargo xtask` TS-type generation (xtask/).
vox-codegen = "0.10.0-rc.5"

# ── UI framework ──────────────────────────────────────────────────────
# dioxus 0.8 line — git rev pinned; it must stay in lockstep across every
# dioxus-* entry AND the FTS fork branches that pin the same rev.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false, features = ["lib"] }
dioxus-native = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", features = ["prelude", "system-fonts", "svg", "autofocus", "incremental", "data-uri"] }
dioxus-router = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }
dioxus-icons = { git = "https://github.com/FastTrackStudios/dioxus-icons", branch = "main" }
neo_frizbee = { version = "0.11", features = ["match_end_col"] }
nucleo-matcher = "0.3"

# ── Editor stack externals ────────────────────────────────────────────
arborium = { version = "2.16.0", default-features = false }
arborium-theme = "2.16.0"
arborium-tree-sitter = "2.16.0"
ropey = "1.6"

# ── Server / storage ──────────────────────────────────────────────────
axum = { version = "0.8", features = ["ws"] }
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
octocrab = "0.46"

# ── Files platform (ADR 0001) ─────────────────────────────────────────
# Streaming FastCDC content-defined chunking, blake3 content addressing,
# iroh-blobs as the local blob store.
fastcdc = { version = "4", features = ["tokio"] }
iroh = { version = "1.0" }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
blake3 = "1.8"
# Whole-file placement: reflink where the filesystem clones extents,
# hardlink otherwise (see ChunkStore::write_path).
reflink-copy = "0.1"
# Files version-store engine: jj-lib's `Backend` trait, implemented over
# the chunk store above. Pinned (jj-lib is pre-1.0 per the ADR).
jj-lib = "=0.44.0"
# Software File Roots are colocated git: the `files` feature talks to the
# root's real `.git` directly alongside jj-lib's `GitBackend`. Same version
# jj-lib itself pins, so there is one gix in the tree.
gix = { version = "0.85", default-features = false, features = ["index", "max-performance-safe", "sha1"] }

# ── Filesystem watching ───────────────────────────────────────────────
# crates.io `notify`, used by the Files cadence engine for activity
# *hints*. Renamed: `notify` is already taken by the in-tree
# features/notify member, and one name can only mean one crate here.
notify-fs = { package = "notify", version = "8" }
globset = "0.4"
walkdir = "2"

# ── Async runtime ─────────────────────────────────────────────────────
tokio = { version = "1.48", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
pollster = "0.4.0"

# ── Serialization ─────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
eyre = "0.6"

# ── Observability ─────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Sentry error/crash telemetry — rustls (not native-tls) for iOS.
sentry = { version = "0.44", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

# ── wasm / browser ────────────────────────────────────────────────────
web-sys = "0.3.98"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

# ── Utilities ─────────────────────────────────────────────────────────
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
base64 = "0.22"
sha2 = "0.10"
indexmap = "2"
regex = "1"
rrule = "0.11"
rust_decimal = "1.39"
cooklang = "0.18"
pulldown-cmark = { version = "0.10", default-features = false }
libc = "0.2"

# ── Test / dev ────────────────────────────────────────────────────────
fake = { version = "4", features = ["derive", "uuid", "chrono"] }
proptest = "1"
tempfile = "3"

# ── Patches ───────────────────────────────────────────────────────────
[patch.crates-io]
# vox-core with `Caller::with_global_middleware` — the service-agnostic
# middleware seam the native iroh transport needs to present a bearer on
# every call of a connection (crates/ui-core/src/vox_clients.rs; the CLI
# documents the same gap in `dial_authenticated`). The branch is
# `feat/global-client-middleware` on the vox repo, one additive change
# over the published rc.5 (its vox-core is byte-identical to the
# crates.io release).
#
# Fetched, not local: this used to be an absolute path into one
# machine's worktree, and every other machine failed before compiling a
# line with `failed to read …/vox-global-mw/rust/vox-core/Cargo.toml`.
# The branch is pushed now, and the repository is public, so a checkout
# anywhere builds with no credentials and nothing to copy across.
#
# Pinned by `rev` rather than tracked by branch: a patch that moves when
# somebody pushes is a build that changes without a commit here saying
# so. Bump this line to take a newer one.
vox-core = { git = "https://github.com/Codys-Wright/vox.git", rev = "98d6798dd926cb06c9da44add5eb9599b8f5c267" }
# Blitz from the FTS fork (0.3.0-beta.1 line, upstream 02523b83 +
# fts-focus: focus-follows-pointerdown for all focusable content —
# upstream only click-focuses text inputs, leaving the editor's tabindex
# div unfocusable by mouse). dioxus git pins `=0.3.0-beta.1`. One rev
# across all blitz crates.
blitz-dom = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-traits = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-paint = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-shell = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-net = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-html = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
# Vendored one-line fix: quote scalars containing `<`/`>` — upstream
# styx-format emits them bare but styx-parse rejects them, so serialized
# keybind configs (`keys "<C-s>"`) could not be re-parsed.
styx-format = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.2.0" }
# Vendored phon rc.5 + derive support for parse/display opaque scalars
# (Uuid, chrono DateTime/NaiveDate, url, …). Upstream rc.5 PANICS (and the
# reply path aborts the process) the first time a vox RPC reply contains
# such a field — every task-server list/stats call died.
phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.2.0" }
# Vendored phon-jit rc.5 with a one-line build.rs fix: force the stable,
# call-based stencils (upstream's nightly detection misfires on the pinned
# stable toolchain → E0658 on `become`).
phon-jit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.2.0" }
# Vendored facet-core rc.5 with one change: chrono's display fns keep
# sub-second precision. chrono types are opaque scalars whose only
# encode path is `display`, so upstream's `SecondsFormat::Secs` rounded
# EVERY timestamp on every vox RPC to the second — and anything ordered
# by one could invert when two events shared a second.
facet-core = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.2.0" }
# The editor's vendored mermaid-rs-renderer fork now lives in the editor
# repo, so it arrives as an ordinary transitive dep of `editor-mermaid`
# and needs no patch entry here.

# ── Lints ─────────────────────────────────────────────────────────────
[workspace.lints.rust]
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"
type_complexity = "allow"
manual_clamp = "allow"
needless_range_loop = "allow"
not_unsafe_ptr_arg_deref = "allow"
only_used_in_recursion = "allow"
unnecessary_sort_by = "allow"
unusual_byte_groupings = "allow"
manual_c_str_literals = "allow"
branches_sharing_code = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
collapsible_if = "allow"
map_clone = "allow"
unnecessary_map_or = "allow"
if_same_then_else = "allow"
redundant_locals = "allow"
large_enum_variant = "allow"
explicit_counter_loop = "allow"
manual_strip = "allow"
too_many_arguments = "allow"
double_must_use = "allow"
vec_init_then_push = "allow"
collapsible_match = "allow"
filter_next = "allow"

# ── Profiles ──────────────────────────────────────────────────────────
[profile.dev]
opt-level = 1

# Debuginfo discipline. Full DWARF was the single biggest cost in the
# monorepo: a `debug` test binary measured 1.62 GB, of which 98% was
# `.debug_*` sections, copied into every artifact on every relink.
#
#   line-tables-only  keeps file:line in backtraces + profiler symbols
#                     (samply/perf still work); drops variable/type DWARF,
#                     so a *debugger* can't inspect locals.
#   unpacked          leaves the remaining DWARF in the .o files under
#                     deps/ instead of copying it into each artifact.
#
# Need a real debugger session? Build with `--profile dev-dbg`.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Escape hatch: full DWARF for stepping in gdb/lldb.
[profile.dev-dbg]
inherits = "dev"
debug = 2
split-debuginfo = "packed"

# dx web builds: native debuginfo in the wasm module blew past Chrome's
# 1 GiB WebAssembly module cap (1.14 GB observed). Wasm dev builds don't
# need it — strip it and dev bundles come back to a loadable size.
[profile.wasm-dev]
inherits = "dev"
debug = false
strip = "debuginfo"

[profile.wasm-dev.package."*"]
opt-level = 3

# Dependencies at opt-level 1: gets rid of the pathological O0 debug
# codegen at a fraction of the compile cost. Applies to dependencies only
# — workspace members are governed by profile.dev's base opt-level.
[profile.dev.package."*"]
opt-level = 1

# phon's JIT engine — generates and runs the DSP graph itself. Reaches
# this tree transitively through vox.
[profile.dev.package.phon]
opt-level = 3
[profile.dev.package.phon-jit]
opt-level = 3

# Files CAS: blake3 hashes every chunk on ingest, so it is on the hot path
# of every checkpoint and every import.
[profile.dev.package.blake3]
opt-level = 3

# Build scripts + proc macros and their deps. `package."*"` does NOT cover
# these — cargo routes them through build-override, where they land at
# opt-level 0 with full debuginfo. This tree leans hard on derive macros
# (facet, architect, dioxus rsx), executed thousands of times per build.
[profile.dev.build-override]
opt-level = 3
debug = false
