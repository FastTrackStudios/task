[package]
name = "finance-db"
description = "SeaORM entities + migrations for the finance feature. Authoritative storage for ledger (books, accounts, transactions, splits), parties, invoices, payments, recurring schedules, and expenses. SQLite under the hood; this is the canonical write path — the vault gets one-way markdown exports via the `finance` facade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Native-only: SeaORM + sqlite. No wasm path.
[dependencies]
finance-proto = { workspace = true, default-features = false, features = ["server"] }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
async-trait = "0.1"
chrono = { workspace = true, features = ["clock", "std", "serde"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
rust_decimal = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
