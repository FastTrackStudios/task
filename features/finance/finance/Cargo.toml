[package]
name = "finance"
description = "Finance facade: ledger + invoicing + expenses, SQLite-authoritative (see `finance-db`). One-way exports to the vault's Records sub-vault (`Records/Finance/{book}/Invoices/{year}/INV-####.md` + PDF). Carve-out from the Loro-is-truth rule — finance needs hard invariants (sum-to-zero, unique numbers, FK integrity) that CRDT LWW merges can't provide."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Native-only: the facade owns the markdown export path into the
# Records sub-vault. wasm builds use finance-proto + finance-ui.
[dependencies]
finance-proto = { workspace = true, default-features = false, features = ["server"] }
finance-db = { workspace = true }
architect = { workspace = true, features = ["dispatch-tokio"] }
timer-proto = { workspace = true, default-features = false, features = ["server"] }
timer = { workspace = true }
sea-orm = { workspace = true }
async-trait = "0.1"
vault = { workspace = true }
chrono = { workspace = true, features = ["clock", "std", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
rust_decimal = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sea-orm-migration = { workspace = true }

[lints]
workspace = true
