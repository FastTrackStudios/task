[package]
name = "threads-db"
description = "SeaORM-authoritative backend for the threads feature — impl of threads-proto's `Thread` + `Message` entities and the `ThreadsService` (anchored reads + provenance-stamped writes). Owns the migrations. SeaORM means the DB is swappable without app changes. Consumers depend on the `threads` facade, not this crate directly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
threads-proto = { workspace = true, features = ["server", "vox"] }
async-trait = "0.1"
chrono = { workspace = true, features = ["clock", "serde"] }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true
