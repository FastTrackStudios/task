[package]
name = "threads-proto"
description = "Wire contract for the `threads/` feature — a universal conversation primitive. `Thread` (a topic anchored to any entity via (entity_type, entity_id)) + `Message` (an entry, with per-message provenance for ingestion/traceability), both `#[derive(architect::Entity)]`-emitted, plus a slim `ThreadsService` for anchored reads + writes. Source of truth is SeaORM so the DB is swappable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
facet = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
thiserror = { workspace = true }
architect = { workspace = true }
serde = { workspace = true }
serde_json = "1"
uuid = { workspace = true, features = ["v4", "serde"] }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]
# Client-side optimistic store (`architect::Store`): adds the
# `architect::StoreEntity` impls UI crates key their entity caches on.
# Pulls Dioxus via architect-atom, so it stays opt-in (UI-only).
atom = ["architect/atom"]
server = ["architect/server-seaorm", "dep:sea-orm"]
fake = ["dep:fake", "architect/fake"]

[lints]
workspace = true
