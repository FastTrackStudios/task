[package]
name = "recall-ui"
description = "The spaced-repetition deck: its screen, its service calls, and its live optimistic store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
architect = { workspace = true, features = ["atom", "vox", "client", "platform"] }
architect-ui.workspace = true
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }
dioxus = { workspace = true }
recall-proto = { workspace = true, features = ["vox", "atom"] }
# The FSRS scheduler the review flow drives client-side.
spaced-repetition = { workspace = true }
task-stores = { workspace = true }
task-ui-core = { workspace = true }
uuid = { workspace = true }
# The vault, for "generate cards from this note" — a service this app
# calls, not a crate it is inside of.
vault-proto = { workspace = true, features = ["vox"] }

[lints]
workspace = true
