[package]
name = "identity-proto"
description = "Wire contract for the `identity/` feature — the server-side identity locker. One `LinkedServer` row per home-org user per linked remote server, holding the encrypted session token for that server, `#[derive(architect::Entity)]`-emitted."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
facet = { workspace = true }
thiserror = { workspace = true }
architect = { workspace = true }
serde = { workspace = true }
serde_json = "1"
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["clock", "std", "serde"] }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]
server = ["architect/server-seaorm", "dep:sea-orm"]
fake = ["dep:fake", "architect/fake"]

[lints]
workspace = true
