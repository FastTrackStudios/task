[package]
name = "agent-runners"
description = "Server-side runner registry — persistence and the `Backends` implementation. A runner is an `AgentBackend` that declares capabilities, scope and a concurrency limit; this crate stores them, tracks heartbeats, and reports a lapsed runner as stale."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-proto = { workspace = true, features = ["server", "vox"] }
architect = { workspace = true, features = ["vox"] }
async-trait = "0.1"
chrono = { workspace = true, features = ["clock", "serde"] }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The registry shares a database with the agent-task queue in the
# real server, so the migration tests exercise that exact pairing.
agent-tasks = { workspace = true }

[lints]
workspace = true
