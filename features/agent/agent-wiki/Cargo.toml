[package]
name = "agent-wiki"
description = "Binding library — wires `agent-proto` agent loops to `wiki-proto` operations. Carries the prompt templates (ingest analyze + generate, query, lint, dedup, vision caption, multi-query generation) ported from `nashsu/llm_wiki`, plus block-format parsers (FILE/REVIEW/LINT) that turn LLM output into wiki-proto method calls. No backend; just types + pure functions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
facet = { workspace = true }
thiserror = { workspace = true }
agent-proto = { workspace = true }
agent-codex = { workspace = true }
wiki-proto = { workspace = true }
wiki-live = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
futures = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

