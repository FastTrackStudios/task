[package]
name = "live-proto"
description = "Wire contract for live sessions: a setlist played together, hosted by Task — joining it, its songs' shared docs, the clock every peer follows, and the epochs a playground resets by."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
facet = { workspace = true }
thiserror = { workspace = true }
# Not the workspace entry: that one turns on iroh, and a wire contract
# should not choose a peer's transport — a browser joins over WebSocket.
architect = { git = "https://github.com/FastTrackStudios/architect", rev = "5e43e3531aeeda8416cccc7e0e3604ba19bf2e21" }
serde = { workspace = true, features = ["derive"] }
vox = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "architect/vox"]

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
