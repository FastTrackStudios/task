[package]
name = "fitness-proto"
description = "Wire contract for the fitness suite: the body / exercises / workouts / intake models + their `#[architect::rpc]` service traits. Wasm-clean (the web UI binds to these clients directly); the sibling `body` / `exercises` / `workouts` / `intake` crates own the vault-backed parse / write / store side and re-export this proto. Mirrors the `locations-proto` split."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wasm-clean baseline (Facet types). Enable the `vox` feature to
# pull in the architect-emitted RPC clients + dispatchers.
[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
facet = { workspace = true }
thiserror = { workspace = true }
architect = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
# Shared `Nutrition` macro shape (wasm-clean). `intake`'s
# `IntakeLog` embeds it; keeping it as `cookbook_proto::Nutrition`
# means the native `intake` crate's service trait matches.
cookbook-proto = { workspace = true, default-features = false }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { version = "4", optional = true, features = ["derive", "chrono", "uuid"] }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox", "cookbook-proto/vox"]
# Client-side optimistic store (`architect::Store`): adds the
# `architect::StoreEntity` impls UI crates key their entity caches on.
# Pulls Dioxus via architect-atom, so it stays opt-in (UI-only).
atom = ["architect/atom"]
server = ["architect/server-seaorm", "dep:sea-orm", "cookbook-proto/server"]
fake = ["dep:fake", "architect/fake", "cookbook-proto/fake"]
full = ["vox", "server", "fake"]

[lints]
workspace = true
