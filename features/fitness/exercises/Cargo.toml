[package]
name = "exercises"
description = "Exercise catalog feature. `Exercise` is an `architect::Entity` — the markdown frontmatter under `<vault>/Wiki/Exercises/<slug>.md` is the source of truth today, but the same schema mounts to SQLite under `--features server` without rewrite. Modeled on wger's Exercise + Category + Muscle + Equipment tables, flattened onto one page-per-exercise; wikilinks (`[[pectoralis-major]]`) ride on the wiki feature for cross-page navigation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
architect = { workspace = true }
vault = { workspace = true }
vault-entity = { workspace = true }
fitness-proto = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { version = "4", optional = true, features = ["derive", "chrono", "uuid"] }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox", "fitness-proto/vox"]
server = ["architect/server-seaorm", "dep:sea-orm", "fitness-proto/server"]
fake = ["dep:fake", "architect/fake", "fitness-proto/fake"]
full = ["vox", "server", "fake"]

[dev-dependencies]
tempfile = "3"
