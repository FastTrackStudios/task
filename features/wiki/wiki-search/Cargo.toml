[package]
name = "wiki-search"
description = "Search over `<vault>/Wiki/`. Token mode (grep + TF-IDF over page bodies) is always available; the optional `vector` feature pulls in LanceDB for embedding-backed hybrid retrieval. Lives in the wiki feature so personal vault material outside `Wiki/` doesn't leak into search results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
wiki-proto = { workspace = true }

# Vector search lives behind a feature flag — LanceDB
# (arrow + rocksdb) is heavy and isn't needed for the
# token path. Building with `--features vector` needs
# `protoc` on PATH (the nix dev-shell provides it).
lancedb = { version = "0.29.0", optional = true }
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
vector = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures", "dep:tokio"]

[lints]
workspace = true
