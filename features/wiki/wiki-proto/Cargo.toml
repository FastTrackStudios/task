[package]
name = "wiki-proto"
description = "Wire contract for the `wiki/` feature — Task's port of Karpathy's LLM-Wiki pattern (see nashsu/llm_wiki). Defines the `#[architect::rpc] trait WikiService` covering ingest, graph, lint, review, and federation. Backends live in sibling `wiki-live` (file-backed primary impl, future) and any peer-federation transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wasm-clean baseline (just Facet types + chrono). Enable the
# `vox` feature to pull in `#[vox::service]` + `vox-types::Reborrow`
# impls; the server crate and both transport clients all enable it.
[dependencies]
facet = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
thiserror = { workspace = true }
architect = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { version = "4", optional = true, features = ["derive", "chrono", "uuid"] }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]
server = ["architect/server-seaorm", "dep:sea-orm"]
fake = ["dep:fake", "architect/fake"]
full = ["vox", "server", "fake"]

[lints]
workspace = true
