# NOTE: `features/pdf/pdf` is intentionally a *standalone* cargo
# project — it is NOT a member of the repo-root workspace
# (it sits in that manifest's `exclude`). See that file's
# comment near the `pdf =` workspace-dep entry for the why
# (fulgur's transitive stylo blows up the workspace's
# trait-solver recursion limit). The `task-pdf-render`
# binary built here is the cross-process interop point.

[workspace]

[package]
name = "pdf"
description = "Thin wrapper over [fulgur](https://github.com/fulgur-rs/fulgur) — HTML/CSS to PDF. Surfaces three entry points: `render_html`, `render_template`, `render_invoice`. Pinned to `=0.16` because fulgur is pre-1.0; owning the upgrade window matters more than tracking the latest tag."
version = "0.1.0"
edition = "2021"
authors = ["Cody Wright"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "task-pdf-render"
path = "src/bin/render.rs"

[dependencies]
# Pinned: fulgur is at v0.16, two months old. Bumping is a
# deliberate decision, not a `cargo update` side effect.
fulgur = "=0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

# fd-1 redirect in `task-pdf-render` (see Stdout hygiene in
# src/bin/render.rs) — blitz-html println!s parse noise to
# stdout, which would interleave with PDF bytes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
