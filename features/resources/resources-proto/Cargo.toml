[package]
name = "resources-proto"
description = "Wasm-clean wire contract for the Resource Library — the `#[architect::rpc] ResourcesService` that reads server-side resource sidecars (transcripts, …) for the in-app watch/reader views."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
facet = { workspace = true }
thiserror = { workspace = true }
# ADR 0004: a chart is a vault document on the Assets shelf, so this
# crate's `assets` module re-exports the tier's own constants rather
# than re-spelling them. Wire contract only — no filesystem, wasm-clean.
vault-proto = { workspace = true, default-features = false }
architect = { workspace = true }
serde = { workspace = true, features = ["derive"] }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]
full = ["vox"]

[lints]
workspace = true
