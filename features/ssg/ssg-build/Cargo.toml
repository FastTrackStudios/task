[package]
name = "ssg-build"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The build-script half of the static-site feature. A consuming site adds
# this as a *build-dependency* and its whole build.rs becomes one call.
#
# `ssg-vault` is the only dependency, on purpose: this compiles before
# every build of every site that uses it, so anything added here is paid
# for four times over on a cold build. In particular it does NOT pull the
# knowledge-graph crate — that would drag Dioxus into a build script.
# The graph is built where it is drawn, in `ssg-ui`, at render time.

[dependencies]
ssg-vault = { workspace = true }

# Filesystem watching for `Vault::render`-on-save. Optional because this
# crate is consumed from build scripts in four workspaces, and a build
# script never watches anything — see `watch`.
notify-fs = { workspace = true, optional = true }

[features]
default = []
# A dev server that re-renders the vault when a note is saved.
watch = ["dep:notify-fs"]

[lints]
workspace = true
