[package]
name = "contacts"
description = "Contacts feature backend: parse + write contacts as markdown files in a vault (Records/contacts/<id>.md), manage CardDAV sync accounts, and (one-way) import addressbooks from Nextcloud / iCloud over the Contacts vox RPC. Native-only — the round-trip + sync touch disk and network; the UI uses contacts-proto directly on wasm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Native-only: the vault round-trip reads from disk, and CardDAV sync
# hits the network.

[dependencies]
# `vox` pulls in the architect-emitted dispatcher so the server can
# mount `VaultContacts` as a `Contacts` vox service (mirrors `recall`).
contacts-proto = { workspace = true, features = ["vox"] }
# `Contacts` is a *sync* rpc trait, so its backend must provide a
# `HasDispatcher` impl — `dispatch-tokio` gives the `spawn_blocking`
# dispatcher the server uses.
architect = { workspace = true, features = ["dispatch-tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
vault-entity = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["clock", "std", "serde"] }
# CardDAV pull: blocking HTTP (fits the spawn_blocking sync dispatcher),
# a light XML reader for the DAV multistatus, and a vCard 3.0/4.0 parser.
ureq = "2.12"
roxmltree = "0.20"
ical = { version = "0.11", default-features = false, features = ["vcard"] }
# Where the CardDAV password lives instead of the vault: the OS keyring
# through email-secret's resolver, or the auth::crypto envelope.
email-secret = { workspace = true }
auth = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
# The transport policy: parse origins properly (https-only, credential
# scope), and trust an extra CA (`TASK_CARDDAV_EXTRA_CA`) alongside the
# public roots ureq ships with. Versions match ureq 2.12's own.
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
webpki-roots = "0.26"
# The page walk's private-directory marker (`vault.private.node-only`).
vault-live = { workspace = true }

[features]
default = []
# `contacts::testing` — the fake TLS CardDAV server the integration
# suite dials. Test-only; the server never enables it.
test-support = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
