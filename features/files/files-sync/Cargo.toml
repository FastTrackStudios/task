[package]
name = "files-sync"
version = "0.1.0"
edition = "2024"
description = "Files replica sync engine (issue #264): the SyncService wire surface one backend serves and the reconcile pull the other runs — commit-graph exchange plus chunk-level, resumable content transfer. Divergence is preserved (both sides survive as visible heads), never content-merged."

[features]
default = ["vox"]
vox = ["dep:vox", "architect/vox"]

[dependencies]
architect = { workspace = true }
facet = { workspace = true }
files = { workspace = true }
files-proto = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
vox = { workspace = true, optional = true }

[dev-dependencies]
architect = { workspace = true, features = ["local"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
