[package]
name = "task-files-util"
description = "Shared primitives for the Files platform (issue #255): filesystem-path confinement (the security-critical `safe_relative` / `confine` / `create_confined` gate every Files surface applies to caller-supplied paths) and the `blocking` seam that runs the platform's synchronous, jj-lib-driving work off the async runtime. One implementation, consumed by `files` and `files-storage` — a hardening fix here reaches every caller (PR #284 review)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
