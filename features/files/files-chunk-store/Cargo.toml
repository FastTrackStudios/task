[package]
name = "task-files-chunk-store"
description = "Files platform (issue #255) content-addressed chunk store: streaming FastCDC (v2020) chunking, blake3 addressing, chunks held in an iroh-blobs FsStore, with Files-owned chunk manifests (FileId = manifest hash) kept outside the blob store so it is rebuildable. See ADR 0001 (apps/task/docs/adr/0001-files-version-store-jj-cas.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fastcdc.workspace = true
iroh-blobs.workspace = true
blake3.workspace = true
reflink-copy.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
futures.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
