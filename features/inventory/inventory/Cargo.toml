[package]
name = "inventory"
description = "Inventory feature. `Item` is an `architect::Entity` — markdown frontmatter at `inventory/<slug>.md` stays the source of truth; SeaORM Model emitted under `--features server`. Each item references locations by id (see the `locations` crate). Provides parse / serialize / scan plus an `#[architect::rpc] trait InventoryService` for agent integrations over vox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
architect = { workspace = true }
vault = { workspace = true }
vault-entity = { workspace = true }
inventory-proto = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { version = "4", optional = true, features = ["derive", "chrono", "uuid"] }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox", "inventory-proto/vox"]
server = ["architect/server-seaorm", "dep:sea-orm", "inventory-proto/server"]
fake = ["dep:fake", "architect/fake", "inventory-proto/fake"]
full = ["vox", "server", "fake"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
