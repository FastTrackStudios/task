[package]
name = "pantry-proto"
description = "Wire contract for the pantry suite: the `PantryItem` model (+ `StockEntry` / `Substitution` / `SubReason` / `PantryItemDraft` value types) and the `PantryService` `#[architect::rpc]` trait. Wasm-clean (the web UI binds the client directly); the sibling `pantry` crate owns the vault-backed parse / write / store side and re-exports this proto. Mirrors the `cookbook-proto` / `fitness-proto` split. `Nutrition` is reused from `cookbook-proto` so recipes + pantry speak the same currency. The `native` feature pulls `inventory` for the `PantryItem::to_item` / `from_item` interop helpers (off by default → wasm stays clean)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
facet = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
architect = { workspace = true }
cookbook-proto = { workspace = true, default-features = false }

# Native-only interop with the gear-inventory model. Gated so the
# wasm UI never pulls the vault-backed `inventory` crate; the native
# `pantry` crate turns it on via its own `vox` feature.
inventory = { workspace = true, optional = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { version = "4", optional = true, features = ["derive", "chrono", "uuid"] }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox", "cookbook-proto/vox"]
# Client-side optimistic store (`architect::Store`): adds the
# `architect::StoreEntity` impls UI crates key their entity caches on.
# Pulls Dioxus via architect-atom, so it stays opt-in (UI-only).
atom = ["architect/atom"]
server = ["architect/server-seaorm", "dep:sea-orm", "cookbook-proto/server"]
fake = ["dep:fake", "architect/fake", "cookbook-proto/fake"]
# `inventory` interop (`PantryItem::to_item` / `from_item`). Native
# only — the `inventory` crate is `cfg(not(wasm))`.
native = ["dep:inventory"]
full = ["vox", "server", "fake", "native"]

[lints]
workspace = true
