[package]
name = "workstream-proto"
description = "Wire contract for the workstream feature: the `Workstream` parent-with-swarm entity (lead + members + status + dates, project-scoped) + `#[architect::rpc] trait WorkstreamService` CRUD/rollup surface with a `#[subscribe]` event stream. Wasm-clean (the UI binds to it directly); the sibling `workstream` crate owns the vault-backed parse / write / backend / rollup side. One construct covering what Plane splits into Module + Epic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wasm-clean baseline (Facet types). Enable the `vox` feature to
# pull in the architect-emitted RPC client + dispatcher.
[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
facet = { workspace = true }
thiserror = { workspace = true }
architect = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
# `AgentRef` — the lead / member actor shape shared with the
# workflow audit log and `task::WorkflowAttrs::assignees`.
workflows-proto = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
fake = { version = "4", optional = true, features = ["derive", "chrono", "uuid"] }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox"]
server = ["architect/server-seaorm", "dep:sea-orm"]
fake = ["dep:fake", "architect/fake", "workflows-proto/fake"]
full = ["vox", "server", "fake"]

[lints]
workspace = true
