# This repo's git hooks, run by prek (https://github.com/j178/prek; the
# dev shell carries the pinned release, nix/modules/prek.nix, bumped by
# `just prek-bump`). Install once per clone: `just install-hooks`.
#
#   commit   rustfmt, shellcheck and actionlint on the STAGED files only.
#            prek stashes unstaged edits while hooks run, so a hook sees
#            exactly what is being committed. A hook that rewrites a file
#            fails the commit: `git add` the result and commit again.
#   push     local CI (scripts/ci-local-hook.sh): the clippy, wasm and
#            tests `cargo rail plan` says the change affects, on this
#            machine's warm target dir, then the `Local CI` status on the
#            pushed commit, which main requires (checks.yml header).
#   merge    after a pull onto main, rail evidence for the new HEAD
#            (scripts/rail-evidence-hook.sh -> `just rail-evidence`), in
#            the background, so local CI on the next branch narrows.
#
# Skip one hook by its id: `SKIP=local-ci git push` (the PR then waits on the
# `Local CI` status
# until a checked push or `gh workflow run checks.yml --ref <branch>`).
default_install_hook_types = ["pre-commit", "pre-push", "post-merge"]

[[repos]]
repo = "local"

# Each file through rustfmt's stdin: `rustfmt <file>` would follow `mod`
# declarations and rewrite files that aren't staged.
[[repos.hooks]]
id = "rustfmt"
name = "rustfmt (staged files)"
language = "system"
entry = "bash scripts/rustfmt-files.sh"
types = ["rust"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
entry = "shellcheck"
types = ["shell"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "actionlint"
name = "actionlint (workflows)"
language = "system"
entry = "actionlint"
files = "^\\.github/workflows/.*\\.ya?ml$"
stages = ["pre-commit"]

[[repos.hooks]]
id = "local-ci"
name = "Local CI (rail-planned clippy + tests)"
language = "system"
entry = "bash scripts/ci-local-hook.sh"
always_run = true
pass_filenames = false
require_serial = true
stages = ["pre-push"]

[[repos.hooks]]
id = "rail-evidence"
name = "rail evidence for main's new HEAD (background)"
language = "system"
entry = "bash scripts/rail-evidence-hook.sh"
always_run = true
pass_filenames = false
stages = ["post-merge"]
