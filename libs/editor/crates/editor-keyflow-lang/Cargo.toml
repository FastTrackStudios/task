[package]
name = "editor-keyflow-lang"
description = "Keyflow language support for the Editor: syntax highlighting + live IDE diagnostics surfaced as editor `DecoratedRange` decorations. Pairs with `editor-keyflow` (which renders `.kf` fences to inline SVG). Pure functions — no Dioxus — so it stays wasm-friendly and view-agnostic."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Decoration model + EditorState we map keyflow spans/diagnostics onto.
editor-state = { workspace = true }
# keyflow-text (NOT the `keyflow` facade — the facade pulls daw-module/tokio
# and breaks wasm). `ide` gives the analyzer (`ide::analyze`); the
# `highlighting` feature (set in the workspace dep) exposes the line
# highlighter + theme→CSS renderer at `keyflow_text::highlighting::*`.
keyflow-text = { workspace = true, features = ["highlighting"] }

[lints]
workspace = true
