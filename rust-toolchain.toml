# The fleet's toolchain: rust 1.99.1 stable, the same release architect,
# studio, keyflow and frame pin, and must match devenv-fleet's (the dev
# shell's and nix/modules/toolchain.nix's compiler).
#
# One compiler across the fleet so kache (the rustc wrapper on the build
# hosts) reuses a crate built for one repo in the others: its key holds
# the rustc version and every rustflag (.cargo/config.toml), so a repo on
# its own compiler rebuilds Dioxus, Blitz and architect from scratch.
# Architect's skill lists the whole set (architect:
# skills/architect/references/xtask-tooling.md, "Fleet toolchain").
#
# The nix compiler is devenv-fleet's `toolchain` (its pins.json: rust
# version, rust-overlay and nixpkgs revisions), shared by devenv.yaml and
# flake.nix. Bumping means a devenv-fleet release, then moving both pins
# here (devenv.yaml's inputs and `devenv update`, flake.nix's
# `devenv-fleet` tag and `nix flake update devenv-fleet`) and this
# channel, which are halves of one pin and drift silently if only one
# moves (`fleet-doctor` and devenv-fleet's scripts/fleet-pins check them).
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy", "rust-src"]
targets = ["wasm32-unknown-unknown"]
