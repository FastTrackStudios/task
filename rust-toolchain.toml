# Matches the FastTrackStudio fleet pin, and must match
# nix/modules/toolchain.nix.
#
# rust-overlay is this repo's own input rather than `dioxus-flake`'s, so
# a compiler release can be taken here without moving nixpkgs or `dx`
# (which comes from the dedicated `nixpkgs-dx` pin — see
# nix/modules/dx.nix). Bumping means: `nix flake update rust-overlay`,
# then this channel and the version in nix/modules/toolchain.nix, which
# are two halves of one pin and drift silently if only one moves.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "rust-src"]
targets = ["wasm32-unknown-unknown"]
