[package]
name = "task-player-ui"
description = "What Task plays of a song: the global Now Playing stream, the `type: song` / `type: setlist` note widgets that link to Session for rehearsal, and the ```kf chart fence renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dioxus = { workspace = true }

# The shared Task UI seam: `format::duration_mmss`, the `type: song`
# frontmatter shape, and the signed media grants.
task-ui-core.workspace = true
# The note-widget contract: this crate PROVIDES the `type: song` /
# `type: setlist` note widgets + embed href handling (`src/widgets.rs`)
# that the shell's note view mounts through the registry.
task-widgets.workspace = true
# The lazy boundary (`lazy_element!`) that keeps the Now Playing engine
# out of the web app's first load. The SDK names no plugin, so this is
# not a cycle.
task-plugin-ui.workspace = true

# Chart fences: the CPU engraver behind ```kf, registered into the
# editor's fence registry.
editor-keyflow = { workspace = true }
editor-state = { workspace = true }

# `architect::platform::sleep` — the cross-target tick.
architect = { workspace = true, features = ["platform"] }

tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Parses the song.md / arrangement.md frontmatter (the `song` folder
# schema) when playing a manifest-less colocated song.
serde_yaml.workspace = true

wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "NodeList",
    "DomTokenList",
    "CssStyleDeclaration",
    "Response",
    # Now Playing: one streamed <audio> element routed through an
    # analyser for the level meter on the playing song strip.
    "AudioContext",
    "BaseAudioContext",
    "AudioNode",
    "AudioDestinationNode",
    "AnalyserNode",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "MediaElementAudioSourceNode",
] }

[features]
default = []
# The split web build: the Now Playing engine and the chart engraver each
# become a lazily fetched chunk. Off everywhere else — desktop, mobile
# and `dx serve` call straight through.
wasm-split = ["task-plugin-ui/wasm-split", "dioxus/wasm-split"]

[lints]
workspace = true
