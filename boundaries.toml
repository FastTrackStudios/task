# `cargo xtask boundaries` (FastTrackStudios/architect xtask, STA-268): the
# layer table for architect's docs/content/architecture/layout.md, applied to
# Task. Run with `just ci-boundaries`.
#
# Each [[row]] is a package + feature set, resolved with `cargo tree -p`:
#   L0  contract: resolved for wasm32; must not reach an engine/storage/host/UI
#       package, a tokio runtime, or a transport-host/server architect feature.
#   L4  ui: must not reach an engine/storage/host package or a server feature.
#   L1  everything else in features/ (engine, storage, glue): recorded, not
#       constrained, until each feature folds into one crate with flags.
# Workspace rules: nothing outside apps/ enables a transport host by default;
# every member has `[lints] workspace = true`; one architect source in
# Cargo.lock; every feature crate has a row.
#
# Task still has *-proto / *-ui sibling crates. They keep explicit rows until
# they fold in (one feature per PR, ADR "Migration").
#
# [baseline] is today's count per rule. Above it fails; below it fails until
# you lower it here, so the numbers only go down.

contract-target = "wasm32-unknown-unknown"
host-dirs = ["apps"]
unmapped-ok = ["features/email/examples", "features/email/email-integration-tests"]
single-source = ["architect", "architect-*", "auth", "auth-*", "crdt", "crdt-*", "ui-snapshot"]

[forbidden]
engine = [
    "sea-orm", "sea-orm-migration", "sqlx", "rusqlite", "libsql", "turso",
    "axum", "tower-http", "iroh", "tokio-tungstenite",
]
ui = ["dioxus", "dioxus-core", "dioxus-web", "dioxus-desktop", "blitz-dom", "vello"]
tokio-runtime = ["rt", "rt-multi-thread"]
transport-host = ["host", "server", "server-axum", "http", "iroh", "dispatch-tokio"]
architect-server = ["server-seaorm"]

[baseline]
# 2026-10-21 first run (architect xtask d644a04, Task dev 80a8c1b2), 4m20s.
# The root cause of most: the workspace `architect` dep enables `iroh` for
# every crate (Cargo.toml [workspace.dependencies]); moving it to apps/*
# clears ~200 rows at once.
#   contract-clean 123: tokio/rt 41, iroh 41, architect/iroh 41.
#   ui-reach 81: tower-http 22, iroh 22, architect/iroh 22, tokio-tungstenite 15.
#   transport-host 217: architect/iroh and architect/dispatch-tokio by default.
#   lints 5: fitness body/exercises/fitness/intake/workouts.
#   single-source 1: Cargo.lock has architect v0.9.2 and v0.9.6.
contract-clean = 123
ui-reach = 81
transport-host = 217
lints = 5
single-source = 1

