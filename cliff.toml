# git-cliff config — the FALLBACK changelog source.
#
# Release notes come from cargo-rail change files (.changes/README):
# scripts/release.sh builds each CHANGELOG section from the pending
# `.changes/*.md`. Only when a release has no change files at all (the
# first CalVer release after 0.2.4; a range that skipped them) does it run
# git-cliff over the commit RANGE since the last release tag, so a release
# is never empty. Never regenerate the whole file with `git cliff -o`.
#
#   git cliff --tag v26.10.0 --strip all v0.2.4..HEAD   preview that fallback
#
# Delete this file once every release since has had change files.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/);
this project follows [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/)
so the file is regenerated by `git cliff` from commit history.

"""
# Groups carry an HTML-comment sort key (striptags removes it on render),
# so sections come out Features, Fixes, … instead of alphabetically.
# Only the first line of a message: unconventional commits keep their
# body in `commit.message`, and a squash body is the whole PR log.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**breaking** {% endif %}{% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}{% endfor %}
{% endfor %}

"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_preprocessors = [
    # "(#149)" → a link to the PR.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/FastTrackStudios/task/pull/${1}))" },
]
commit_parsers = [
    # Bookkeeping that is not a change to the product.
    { message = "^chore\\(release\\)", skip = true },
    { message = "^Merge (pull request|branch|remote-tracking branch)", skip = true },
    { message = "^Merge [A-Za-z0-9/_.-]+ into [A-Za-z0-9/_.-]+", skip = true },
    { message = "^(Release|Hotfix) v[0-9]+\\.[0-9]+\\.[0-9]+", skip = true },
    { message = "^Promote dev to main", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactor" },
    { message = "^docs", group = "<!-- 5 -->Docs" },
    { message = "^test", group = "<!-- 6 -->Tests" },
    { message = "^(build|ci)", group = "<!-- 7 -->Build" },
    { message = "^chore", group = "<!-- 8 -->Chores" },
    { message = ".*", group = "<!-- 4 -->Changes" },
]
filter_commits = false
# Product releases only. Anchored: `desktop-v0.0.5` (the macOS app.s own
# releases before 26.10) must not count as a release of the whole product.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
# Pre-1.0: a feature is a minor, a breaking change is also a minor (not a
# jump to 1.0.0). Going 1.0 is a decision, made with an explicit
# `just release-prepare 1.0.0`.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
