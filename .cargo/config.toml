# Repo-root cargo config — the product root IS the repo root, so this has
# to live at the top or cargo never reads it.
#
# `cargo xtask <command>` runs the Task xtask binary (xtask/). Its only
# verb is `codegen <out-dir>`, which writes TypeScript clients for the
# vox services listed in xtask/src/main.rs.

[alias]
xtask = "run --package xtask --release --"

# Matters more than it used to: this repo has three git-dep remotes
# (architect, vendor, FastTrackStudio), so fetches must use the git CLI
# for SSH/credentials to work the way they do outside cargo.
[net]
git-fetch-with-cli = true

# The parallel front end (nightly; the toolchain is a dated nightly for
# this, rust-toolchain.toml): type checking, borrow checking and the rest
# of rustc's front half run on up to 8 threads per crate instead of one.
# Under `cfg(all())` so it reaches every target, and because cargo JOINS
# `target.<cfg>` rustflags with `target.<triple>` ones (the wasm cfg
# below, CI's mold `CARGO_TARGET_*_RUSTFLAGS`), where `build.rustflags`
# would be silently replaced by either. 8 is what the compiler team
# recommends; past it the front end stops scaling.
[target.'cfg(all())']
rustflags = ["-Zthreads=8"]

# getrandom 0.3 (transitive via fake -> rand) needs its backend selected
# explicitly on wasm. Paired with the `wasm_js` feature in apps/web.
# `dx` sets the same cfg on its own builds; declaring it here makes plain
# `cargo check --target wasm32-unknown-unknown` agree.
# See docs.rs/getrandom/#webassembly-support.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
