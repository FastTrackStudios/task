# Repo-root cargo config — the product root IS the repo root, so this has
# to live at the top or cargo never reads it.
#
# `cargo xtask <command>` runs the Task xtask binary (xtask/). Its only
# verb is `codegen <out-dir>`, which writes TypeScript clients for the
# vox services listed in xtask/src/main.rs.

[alias]
xtask = "run --package xtask --release --"

# Matters more than it used to: this repo has three git-dep remotes
# (architect, vendor, FastTrackStudio), so fetches must use the git CLI
# for SSH/credentials to work the way they do outside cargo.
[net]
git-fetch-with-cli = true

# ── The fleet's rustflags ─────────────────────────────────────────────
# Everything below is the same, flag for flag and in the same order, in
# Task, architect, studio, keyflow and frame (architect:
# skills/architect/references/xtask-tooling.md, "Fleet toolchain").
# kache keys every crate on rustc's version and every rustflag, so one
# differing flag rebuilds the whole graph in each repo instead of sharing
# one build of Dioxus, Blitz and architect across them. Change it in all
# of them or in none. Never override it from CI with `RUSTFLAGS` or
# `CARGO_TARGET_<triple>_RUSTFLAGS`: either replaces these tables.

# Frame pointers: originally for the (now retired) moire fork's trace
# capture, kept because samply/perf profiling of the audio path on NixOS
# glibc needs intact frame-pointer chains to unwind. Cheap; keep it.
#
# NOTE ON PRECEDENCE: `target.<triple>.rustflags` REPLACES `build.rustflags`
# — cargo does not merge them. So the tables below must repeat the
# frame-pointer flag. This `[build]` table is what the other targets
# (aarch64 darwin and linux, iOS, musl) get.
[build]
rustflags = ["-C", "force-frame-pointers=yes"]

# mold instead of the default `ld.bfd`. Linking is the serial tail of every
# build here: a `nextest run --workspace` links ~330 test binaries, and GNU
# ld does each serially. mold is multi-threaded and typically turns a
# 30-60s link into a few seconds. Comes from the dev shell and every nix
# build (devenv-fleet's `rust`, crane.nix); GCC accepts -fuse-ld=mold
# natively.
[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-C", "link-arg=-fuse-ld=mold",
  "-C", "target-cpu=x86-64-v3",
]

# x86-64-v3 (AVX2, FMA, BMI2 — Haswell, 2013, and later) on every x86-64
# desktop target, for studio's DSP: the amps, the sampler and the FX
# vectorise to 256 bits. A machine older than that cannot run these
# builds, task-server's x86_64 release binary included. Apple Silicon
# (aarch64) is unaffected.
[target.x86_64-apple-darwin]
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-C", "target-cpu=x86-64-v3",
]

# getrandom 0.3 refuses wasm32-unknown-unknown unless told which entropy
# source to use — the cargo *feature* alone is not enough, it gates on this
# cfg. The browser answer is `wasm_js` (crypto.getRandomValues). Reached
# transitively (fake -> rand, uuid, ahash, …), so it has to be set for the
# whole target rather than by any one dependency; apps/web turns on the
# `wasm_js` feature it pairs with, and `dx` sets the same cfg on its own
# builds. See docs.rs/getrandom/#webassembly-support.
#
# Note the precedence rule above: this table REPLACES `build.rustflags`, so
# the frame-pointer flag is repeated here.
[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "force-frame-pointers=yes",
  "--cfg", 'getrandom_backend="wasm_js"',
]
