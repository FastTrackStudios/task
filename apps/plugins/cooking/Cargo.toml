[package]
name = "task-plugin-cooking"
description = "A worked example of a Task app plugin: it depends on the plugin SDK and on nothing else in this workspace, which is the property the whole extension point rests on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The SDK, and *only* the SDK. No task-ui, no task-plugin, no feature
# crate. If this list ever grows a second Task crate, the example has
# stopped demonstrating the thing it exists to demonstrate.
task-plugin-ui = { workspace = true }

[lints]
workspace = true
