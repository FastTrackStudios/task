{{- if and .Values.uiLab.enabled .Values.ingress.enabled }}
{{- if not .Values.uiLab.host }}
{{- fail "uiLab.enabled requires uiLab.host" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "task.fullname" . }}-ui-lab
  labels:
    {{- include "task.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui-lab
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.uiLab.host | quote }}
      http:
        paths:
          {{- /* ui-lab's live-data stories speak to the same server,
                 same-origin — route the API prefixes identically. */}}
          {{- range .Values.ingress.serverPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "task.fullname" $ }}-server
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "task.fullname" . }}-ui-lab
                port:
                  name: http
{{- end }}
