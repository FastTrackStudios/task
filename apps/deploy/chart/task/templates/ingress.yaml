{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "task.fullname" . }}
  labels:
    {{- include "task.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* API + websocket prefixes go to the server; the wasm app
                 derives its vox URL same-origin, so these MUST live on
                 the same host as the static bundle. */}}
          {{- range .Values.ingress.serverPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "task.fullname" $ }}-server
                port:
                  name: http
          {{- end }}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "task.fullname" . }}-web
                port:
                  name: http
          {{- end }}
{{- end }}
