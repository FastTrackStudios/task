# EXAMPLE values — the dev environment on starcommand (ArgoCD watches
# the `dev` branch with these). Self-hosters: copy this next to your
# own values file as a starting point; nothing in the chart itself
# depends on these hostnames.
#
#   helm upgrade --install task-dev ./deploy/chart/task \
#     -n task-dev --create-namespace \
#     -f deploy/chart/values-dev.yaml

server:
  image:
    tag: dev
  # In-cluster Ingress is plain HTTP (TLS terminates at the host
  # nginx) but the PUBLIC url is https — signed attachment URLs must
  # use the outside scheme. Derived from ingress.host by default;
  # spelled out here for clarity.
  publicUrl: https://tasks-dev.starcommand.live
  # Sealing key + integration tokens come from a Secret created out of
  # band (kubectl create secret generic task-dev-env \
  #   --from-literal=TASK_SERVER_SEALING_KEY=$(openssl rand -hex 32)).
  # existingSecret: task-dev-env
  persistence:
    size: 10Gi

web:
  image:
    tag: dev

ingress:
  className: traefik
  host: tasks-dev.starcommand.live
  # external-dns picks the host up automatically; TLS terminates at
  # the host nginx fallthrough proxy, so no tls: block here.
