apiVersion: v2
name: task
description: >-
  Self-hosted Task — local-first project/issue tracker. Deploys the
  task-server (vox websocket API + attachments + per-org data) and the
  static wasm web app.
type: application
home: https://codeberg.org/FastTrackStudios/Task
sources:
  - https://codeberg.org/FastTrackStudios/Task
# Static: a release changes neither (releases commit nothing). The chart
# does not pin its images: each renders its image.tag, `latest` by
# default, and on starcommand argocd-image-updater writes the release
# there (the highest X.Y.Z task-server / task-web on GHCR, which every
# release tag's Images job pushes). Bump `version` by hand when the chart
# itself changes; appVersion records the last release that committed one.
version: 26.10.1
appVersion: "26.10.1"
