apiVersion: v2
name: task
description: >-
  Self-hosted Task — local-first project/issue tracker. Deploys the
  task-server (vox websocket API + attachments + per-org data) and the
  static wasm web app.
type: application
home: https://codeberg.org/FastTrackStudios/Task
sources:
  - https://codeberg.org/FastTrackStudios/Task
# Both follow the repo's one version (Cargo.toml [workspace.package]
# version): the release commit (scripts/release.sh) rewrites these two
# lines with the bump, and scripts/check-versions.sh holds them to it.
# appVersion is the image tag the chart renders when values set none, so
# the chart at tag vX.Y.Z deploys ghcr.io/fasttrackstudios/task-*:X.Y.Z,
# which the release pushes before the tag exists (images.yml).
version: 26.10.1
appVersion: "26.10.1"
