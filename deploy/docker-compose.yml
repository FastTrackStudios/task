# Self-hosted Task — minimal compose: server + web behind one origin.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   open http://localhost:8090
#
# The web container proxies nothing — your browser talks to both
# services. For the wasm app's same-origin URL derivation to work the
# API paths must be reachable on the SAME host+port as the static
# bundle, so a tiny reverse proxy ("edge" below) fronts the pair the
# same way the Helm chart's Ingress does in k8s.
#
# Images: pull from the in-cluster LAN registry (tags: latest / dev /
# sha-<short>), or build them yourself with Nix — there are no
# Dockerfiles. Each image is a `dockerTools.streamLayeredImage` in
# flake.nix; to build + load one locally:
#
#   $(nix build --no-link --print-out-paths .#task-server-image) \
#     | docker load        # or pipe into skopeo / podman load
#
# (build .#task-web-image the same way).

services:
  server:
    image: registry.starcommand.live:30050/task-server:latest
    restart: unless-stopped
    environment:
      # Everything lives under /data (the volume below) — back that
      # up and you have backed up the instance.
      TASK_DATA_ROOT: /data
      TASK_SERVER_BIND: 0.0.0.0:8080
      # Public base URL — used to mint signed attachment URLs. Set to
      # whatever your users put in the address bar.
      TASK_SERVER_PUBLIC_URL: http://localhost:8090
      # Production: generate with `openssl rand -hex 32` and set it,
      # e.g. via `docker compose --env-file`:
      # TASK_SERVER_SEALING_KEY: ${TASK_SERVER_SEALING_KEY}
    volumes:
      - task-data:/data

  web:
    image: registry.starcommand.live:30050/task-web:latest
    restart: unless-stopped

  # Same-origin edge: API prefixes -> server, everything else -> web.
  # Mirrors the chart's ingress.serverPaths.
  edge:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - server
      - web
    configs:
      - source: edge-nginx
        target: /etc/nginx/conf.d/default.conf

configs:
  edge-nginx:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
      }
      server {
          listen 80;
          client_max_body_size 1g;

          location ~ ^/(vox|org|server|blobs|\.well-known) {
              proxy_pass http://server:8080;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_read_timeout 1h;
              proxy_send_timeout 1h;
          }
          location / {
              proxy_pass http://web:8080;
              proxy_set_header Host $$host;
          }
      }

volumes:
  task-data:
