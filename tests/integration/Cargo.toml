[package]
name = "integration"
description = "The cross-feature integration suite: two orgs on two servers over iroh, exercised end to end as ordinary tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A library, not a binary. `src/` is the harness — how a server is
# booted, which orgs exist, who works for them — and `tests/` is the
# suite that drives it. A binary crate's modules are not reachable from
# `tests/`, so the harness has to be a lib for the tests to share it.
[lib]
path = "src/lib.rs"

[dependencies]
architect = { workspace = true, features = ["iroh", "vox"] }
files = { workspace = true }
files-sync = { workspace = true }
files-domain = { workspace = true }
iroh = { workspace = true }
async-trait = { workspace = true }
vox = { workspace = true }
vox-core = "0.10.0-rc.5"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
